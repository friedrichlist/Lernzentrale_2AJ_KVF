":"S. 235–238","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie die Voraussetzungen der Haftung nach § 823 Abs. 1 BGB in die richtige Reihenfolge der Prüfung.","paare":[["1.","Handlung (Tun oder Unterlassen)"],["2.","dadurch verursachte Verletzung eines geschützten Rechtsguts"],["3.","Rechtswidrigkeit"],["4.","Verschulden (Vorsatz oder Fahrlässigkeit)"],["5.","Schaden, der auf der Rechtsgutverletzung beruht"]],"erkl":"Die Reihenfolge dient der Prüfung; fehlt eine Voraussetzung, besteht kein Anspruch aus § 823 Abs. 1 BGB.","norm":"§ 823 Abs. 1 BGB","id":"5.2-1-1"},{"typ":"wf","frage":"Welche Aufgaben übernimmt die Privathaftpflichtversicherung?","aussagen":[["Prüfung, ob und in welcher Höhe der Kunde haftet",true],["Abwehr unberechtigter Ansprüche (passiver Rechtsschutz)",true],["Ersatz berechtigter Ansprüche",true],["Ersatz von Schäden, die der Kunde an eigenen Sachen verursacht",false]],"erkl":"Eigenschäden sind nie Gegenstand der Haftpflichtversicherung.","norm":"§ 100 VVG, AHB","id":"5.2-1-2"},{"typ":"mc","frage":"Ein Fünfjähriger zerkratzt beim Spielen das Auto des Nachbarn. Wer haftet?","optionen":["Das Kind haftet grundsätzlich nicht; die Eltern nur bei Verletzung der Aufsichtspflicht.","Die Eltern haften immer, auch wenn sie ihre Aufsichtspflicht erfüllt haben.","Der Nachbar hat keinerlei Ansprüche, weil Kinder unter zehn Jahren nie haften.","Das Kind haftet ab fünf Jahren voll; die Eltern haften zusätzlich als Gesamtschuldner."],"richtig":[0],"erkl":"Kinder unter sieben Jahren sind nicht deliktsfähig; die Eltern haften nur bei Verletzung ihrer Aufsichtspflicht. Viele Privathaftpflicht-Tarife ersetzen solche Schäden trotzdem freiwillig (Deliktunfähigkeit mitversichert).","norm":"§§ 828 Abs. 1, 829, 832 BGB","id":"5.2-1-3"},{"typ":"mc","frage":"Ein Kunde wird von einem Radfahrer verletzt, der keine Haftpflichtversicherung hat und nicht zahlen kann. Welcher Baustein hilft dem Kunden?","optionen":["Die Unfallversicherung des Radfahrers, die für Schäden Dritter aufkommt","Die Hausratversicherung des Kunden, die auch Personenschäden ersetzt","Die Kfz-Haftpflichtversicherung des Kunden als Ausfalldeckung","Die Forderungsausfalldeckung seiner eigenen Privathaftpflichtversicherung"],"richtig":[3],"erkl":"Die Forderungsausfalldeckung zahlt, wenn ein Schädiger einen gerichtlich festgestellten Anspruch nicht erfüllen kann.","norm":"BBR PHV, Forderungsausfall","id":"5.2-1-4"},{"typ":"mc","frage":"Ein Kunde will Schadenersatz von einem Schädiger einklagen. Welche Rechtsschutzleistungsart ist einschlägig?","optionen":["Steuer-Rechtsschutz vor Gerichten","Beratungs-Rechtsschutz im Familienrecht","Schadenersatz-Rechtsschutz","Verwaltungs-Rechtsschutz in Verkehrssachen"],"richtig":[2],"erkl":"Der Schadenersatz-Rechtsschutz deckt die Durchsetzung gesetzlicher, nicht vertraglicher Schadenersatzansprüche; eine Wartezeit gilt in der Regel nicht.","norm":"ARB","id":"5.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Schulte lässt beim Besuch bei Freunden deren Laptop fallen. Außerdem hat sie Streit mit ihrem Arbeitgeber über eine Abmahnung, die sie vor drei Wochen erhalten hat, und möchte einen Anwalt einschalten. Ihre Rechtsschutzversicherung hat sie vor zwei Monaten abgeschlossen.","items":[{"typ":"mc","frage":"Wer reguliert den Schaden am Laptop?","optionen":["Ihre eigene Hausratversicherung, weil der Schaden in einer fremden Wohnung entstand.","Ihre Privathaftpflicht bei Fahrlässigkeit; bei geliehenen Sachen kommt es auf den Tarif an.","Die Hausratversicherung der Freunde, weil der Laptop zu deren Hausrat gehört.","Niemand, weil Schäden bei Besuchen unter Freunden nie versichert sind."],"richtig":[1],"erkl":"Die Privathaftpflicht leistet bei fahrlässiger Beschädigung fremder Sachen. Schäden an geliehenen oder gemieteten Sachen sind oft ausgeschlossen; bei Gefälligkeiten kommt es auf den Tarif an.","norm":"BBR PHV","id":"5.2-2-1"},{"typ":"mc","frage":"Zahlt die Rechtsschutzversicherung den Anwalt wegen der Abmahnung?","optionen":["Nein, weil die Abmahnung in die dreimonatige Wartezeit fällt.","Ja, weil die Wartezeit im Arbeits-Rechtsschutz nur einen Monat beträgt.","Nein, weil Arbeits-Rechtsschutz nur für Selbstständige versicherbar ist.","Ja, weil für den Arbeits-Rechtsschutz keine Wartezeit gilt."],"richtig":[0],"erkl":"Für Arbeits-Rechtsschutz gilt in der Regel eine Wartezeit von drei Monaten.","norm":"ARB","id":"5.2-2-2"},{"typ":"mc","frage":"Wer darf den Anwalt auswählen, wenn die Rechtsschutzversicherung leistet?","optionen":["Der Arbeitgeber bestimmt den Anwalt im Arbeitsrechtsstreit.","Der Anwalt mit dem günstigsten Honorar laut Versicherer.","Der Versicherer bestimmt den Anwalt aus seinem Netzwerk.","Die versicherte Person kann den Anwalt frei wählen."],"richtig":[3],"erkl":"Das Recht auf freie Anwaltswahl ist gesetzlich garantiert.","norm":"§ 127 VVG","id":"5.2-2-3"}]}]},{"nr":"5.3","titel":"Rechtliche Regelungen in Beruf und Freizeit","lf":"LF 5","buch":"S. 239–269","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie dem Grad des Verschuldens die Haftung des Arbeitnehmers gegenüber dem Arbeitgeber zu (innerbetrieblicher Schadensausgleich).","paare":[["leichteste Fahrlässigkeit","keine Haftung"],["mittlere Fahrlässigkeit","anteilige Haftung"],["grobe Fahrlässigkeit und Vorsatz","in der Regel volle Haftung"]],"erkl":"Die Rechtsprechung schützt Arbeitnehmer bei betrieblich veranlassten Tätigkeiten.","norm":"BAG, innerbetrieblicher Schadensausgleich","id":"5.3-1-1"},{"typ":"mc","frage":"Ein Kollege verletzt einen anderen Kollegen fahrlässig bei der Arbeit. Wer leistet für den Personenschaden?","optionen":["Der Kollege über seine Privathaftpflicht, weil er fahrlässig handelte.","Die Krankenkasse des Arbeitgebers; der Kollege haftet überhaupt nicht.","Die gesetzliche Unfallversicherung; der Kollege haftet nur bei Vorsatz.","Der Arbeitgeber über seine Betriebshaftpflicht in voller Höhe."],"richtig":[2],"erkl":"Arbeitskollegen sind für Personenschäden bei betrieblicher Tätigkeit privilegiert.","norm":"§§ 104, 105 SGB VII","id":"5.3-1-2"},{"typ":"wf","frage":"Welche Aussagen zur Tierhalterhaftung treffen zu?","aussagen":[["Der Halter eines privat gehaltenen Hundes haftet auch ohne eigenes Verschulden.",true],["Bei Nutztieren, die dem Beruf dienen, kann sich der Halter entlasten, wenn er die Sorgfalt beachtet hat.",true],["Tierhalter haften nur, wenn sie das Tier absichtlich losgelassen haben.",false]],"erkl":"§ 833 BGB unterscheidet Luxustiere (Gefährdungshaftung) und Nutztiere (vermutetes Verschulden).","norm":"§ 833 BGB","id":"5.3-1-3"},{"typ":"zahl","frage":"Wie viele Jahre beträgt die regelmäßige Verjährungsfrist für Schadenersatzansprüche?","wert":3,"einheit":"Jahre","tol":0,"erkl":"Sie beginnt mit dem Schluss des Jahres, in dem der Anspruch entstanden ist und der Gläubiger davon Kenntnis erlangt hat oder ohne grobe Fahrlässigkeit hätte erlangen müssen.","norm":"§§ 195, 199 BGB","id":"5.3-1-4"},{"typ":"mc","frage":"Ein Geschädigter hat den Schaden selbst mitverursacht (z. B. unachtsam gelaufen). Welche Folge hat das?","optionen":["Der Schädiger haftet trotzdem in voller Höhe für den Schaden.","Sein Anspruch wird entsprechend seinem Mitverschulden gekürzt.","Sein Anspruch wird stets pauschal um die Hälfte gekürzt.","Sein Anspruch entfällt vollständig, auch bei geringem Mitverschulden."],"richtig":[1],"erkl":"Das Mitverschulden des Geschädigten mindert den Ersatzanspruch.","norm":"§ 254 BGB","id":"5.3-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Der Hund von Familie Peters reißt sich im Park los und bringt eine Joggerin zu Fall. Sie bricht sich das Handgelenk und verlangt Behandlungskosten, Verdienstausfall und Schmerzensgeld. Familie Peters hat eine Hundehalterhaftpflicht.","items":[{"typ":"mc","frage":"Muss Familie Peters haften, obwohl sie den Hund gut erzogen hat?","optionen":["Ja, als Halterin eines Luxustieres haftet sie ohne Verschulden.","Nein, Tierhalter haften nur, wenn der Hund tatsächlich zugebissen hat.","Nein, weil ohne eigenes Verschulden der Halter keine Haftung besteht.","Nein, weil die Joggerin das Risiko im Park selbst trägt."],"richtig":[0],"erkl":"Gefährdungshaftung des Tierhalters.","norm":"§ 833 S. 1 BGB","id":"5.3-2-1"},{"typ":"wf","frage":"Welche Forderungen der Joggerin sind grundsätzlich ersatzfähig?","aussagen":[["Behandlungskosten",true],["Verdienstausfall",true],["Schmerzensgeld",true],["ein neues Auto",false]],"erkl":"Ersatzfähig sind Vermögensschäden infolge der Verletzung und ein angemessenes Schmerzensgeld.","norm":"§§ 249, 252, 253 Abs. 2 BGB","id":"5.3-2-2"},{"typ":"mc","frage":"Was muss Familie Peters gegenüber ihrem Versicherer tun?","optionen":["Erst nach einer Einigung mit der Joggerin den Versicherer über den Fall informieren.","Nichts, weil die Joggerin ihren Schaden selbst beim Versicherer anmeldet.","Den Schaden binnen eines Monats melden und die Forderung vorab selbst begleichen.","Den Schaden binnen einer Woche melden und Zahlungen mit dem Versicherer abstimmen."],"richtig":[3],"erkl":"Die Anzeigepflicht innerhalb einer Woche bleibt bestehen. Ein eigenes Anerkenntnis bindet den Versicherer nur, soweit der Anspruch tatsächlich besteht; ein Anerkenntnisverbot wäre unwirksam (§ 105 VVG).","norm":"§ 104 Abs. 1 VVG, § 105 VVG, AHB","id":"5.3-2-3"}]}]}]},{"nr":"6","titel":"Mobilität und Reisen absichern","lf":"LF 6 (2. AJ)","abschnitte":[{"nr":"6.1","titel":"Beratungsanlässe: Straßenverkehr und Reisen","lf":"LF 6","buch":"S. 270","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie dem Fahrzeug die Versicherungspflicht zu.","paare":[["Pedelec bis 25 km/h mit Tretunterstützung","keine Kfz-Versicherungspflicht"],["S-Pedelec bis 45 km/h","Versicherungspflicht mit Versicherungskennzeichen, Führerschein Klasse AM nötig"],["E-Scooter (Elektrokleinstfahrzeug)","Versicherungspflicht mit Versicherungsplakette, kein Führerschein, ab 14 Jahren"],["Pkw","Versicherungspflicht mit amtlichem Kennzeichen"]],"erkl":"Pedelecs bis 25 km/h gelten als Fahrräder.","norm":"PflVG, eKFV, FZV","id":"6.1-1-1"},{"typ":"mc","frage":"Ein Kunde holt seinen neuen Gebrauchtwagen ab und braucht für die Zulassung einen Nachweis über die Kfz-Haftpflicht. Was erhält er vom Versicherer?","optionen":["Eine Zahlungsbestätigung über die erste Prämie","Die Grüne Karte, die bei der Zulassung abgestempelt wird","Eine elektronische Versicherungsbestätigung (eVB-Nummer)","Eine Bestätigung der Zulassungsstelle über die Versicherung"],"richtig":[2],"erkl":"Mit der eVB-Nummer wird vorläufiger Deckungsschutz zugesagt, der mit der Zulassung beginnt.","norm":"AKB B.2, § 49 VVG","id":"6.1-1-2"},{"typ":"wf","frage":"Welche Anlässe sollten Sie für eine Beratung zur Reiseversicherung nutzen?","aussagen":[["Buchung einer teuren Kreuzfahrt",true],["Reise außerhalb Europas",true],["Wechsel der Hausratversicherung",false],["Reise mit kleinen Kindern",true]],"erkl":"Hohe Reisepreise, Fernreisen und Mitreisende erhöhen den Bedarf an Rücktritts- und Auslandsreisekrankenschutz.","norm":"Bedarfsanalyse","id":"6.1-1-3"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Mia Schröder (19) hat den Führerschein bestanden und kauft einen gebrauchten Kleinwagen. Ihre Mutter bietet an, das Auto als Zweitwagen über ihren eigenen Vertrag laufen zu lassen.","items":[{"typ":"mc","frage":"Welcher Vorteil kann sich ergeben, wenn das Auto als Zweitwagen der Mutter versichert wird?","optionen":["Das Auto ist als Zweitwagen der Mutter nicht mehr versicherungspflichtig.","Eine günstigere Einstufung in der Schadenfreiheitsklasse als bei Fahranfängern.","Mias eigene Schadenfreiheitsklasse steigt dadurch jedes Jahr doppelt so schnell.","Mia ist automatisch über die Vollkasko des Erstwagens der Mutter versichert."],"richtig":[1],"erkl":"Viele Versicherer stufen Zweitwagen besser ein als Erstverträge von Fahranfängern; der Fahrerkreis muss korrekt angegeben werden.","norm":"AKB, Tarifbestimmungen","id":"6.1-2-1"},{"typ":"mc","frage":"Was muss bei der Angabe der Fahrer beachtet werden?","optionen":["Mia muss als regelmäßige Fahrerin angegeben werden; sonst drohen Nachzahlungen.","Nur Fahrer ab 25 Jahren dürfen im Vertrag überhaupt angegeben werden.","Die Fahrerangabe zählt nur in der Kaskoversicherung, nicht in der Haftpflicht.","Fahrer müssen nie angegeben werden, weil das Fahrzeug selbst versichert ist."],"richtig":[0],"erkl":"Das Alter der Fahrer ist ein Tarifmerkmal; falsche Angaben können zu Nachzahlung oder Vertragsstrafe führen, Einzelheiten regeln die AKB.","norm":"AKB K","id":"6.1-2-2"},{"typ":"zuo","frage":"Welche Kasko passt zu welchem Wunsch?","paare":[["Schutz bei Diebstahl, Brand und Glasbruch","Teilkasko"],["zusätzlich Schutz bei selbst verschuldetem Unfall","Vollkasko"],["nur Schäden anderer ersetzen","Kfz-Haftpflicht"]],"erkl":"Die Vollkasko umfasst die Teilkasko-Gefahren und zusätzlich Unfall und Vandalismus.","norm":"AKB A.2","id":"6.1-2-3"}]}]},{"nr":"6.2","titel":"Bedarfe analysieren, Risikoprävention und Absicherung","lf":"LF 6","buch":"S. 271–273","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"wf","frage":"Welche Schäden sind in der Teilkasko versichert?","aussagen":[["Diebstahl des Fahrzeugs",true],["Zusammenstoß mit Haarwild",true],["Glasbruch an der Windschutzscheibe",true],["Unfall durch eigenes Verschulden",false],["mutwillige Beschädigung durch Unbekannte (Vandalismus)",false]],"erkl":"Unfall und Vandalismus sind Vollkasko-Gefahren.","norm":"AKB A.2.2","id":"6.2-1-1"},{"typ":"mc","frage":"Was ersetzt die Kfz-Haftpflichtversicherung NICHT?","optionen":["Vermögensschäden des Unfallgegners","Sachschäden am Fahrzeug des Unfallgegners","Personenschäden des Unfallgegners","Schäden am eigenen versicherten Fahrzeug"],"richtig":[3],"erkl":"Eigenschäden am Fahrzeug deckt nur die Kaskoversicherung.","norm":"AKB A.1","id":"6.2-1-2"},{"typ":"mc","frage":"Welchen Nutz const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(seed){let x=0;for(const c of seed)x=(x*31+c.charCodeAt(0))>>>0;return()=>{x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296}}
function shuf(a,seed){const r=rng(seed),b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function items(arr){return arr.reduce((s,x)=>s+x,0)}
function lekItems(l){return l.items}
function stat(list){const t=list.length;let a=0,r=0;list.forEach(q=>{const s=S[q.id];if(s){a++;if(s.ok)r++}});return{t,a,r,pR:t?Math.round(100*r/t):0,pF:t?Math.round(100*a/t):0}}

 app.innerHTML=`<div class="box"><h1>Prüfungsvorbereitung Teil 1</h1><p class="hint">Trainieren Sie die sechs Prüfungsbereiche der GAP 1. Jeder Abschnitt hat eine Lektion „Grundwissen“ und eine „Prüfungssituation“. Ihr Fortschritt bleibt nur in diesem Browser gespeichert.${online?' Ihren Gesamtstand aus Training und Lernzentrale zeigt der <a href="pruefungspass.html">Prüfungspass</a>.':''}</p><div class="bar"><i style="width:${st.pF}%"></i></div>${pills(st)}</div>

 else if(q.typ==='wf'){h+='<div class="hint">Entscheiden Sie bei jeder Aussage: richtig oder falsch.</div>'+q.aussagen.map((a,i)=>`<div class="wf" data-i="${i}"><span>${esc(a[0])}</span><span class="tg"><button data-v="1">richtig</button><button data-v="0">falsch</button></span></div>`).join('')}
 else if(q.typ==='zuo'){const r=shuf(q.paare.map(p=>p[1]),q.id+seed);h+=q.paare.map((p,i)=>`<div class="zu" data-i="${i}"><b>${esc(p[0])}</b><select><option value="">– bitte wählen –</option>${r.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>`).join('')}
 else if(q.typ==='zahl'){h+=`<div class="num"><input inputmode="decimal" aria-label="Ergebnis"><span>${esc(q.einheit)}</span></div><div class="hint">Dezimalzahlen mit Komma eingeben, ohne Tausenderpunkt.</div>`}
 return h}
function read(q){const r=app.querySelector('#qa');

function complete(q,a){if(q.typ==='mc'||q.typ==='mehr')return a.length>0;if(q.typ==='wf')return a.every(x=>x!==null);if(q.typ==='zuo')return a.every(x=>x);return a!==null&&!isNaN(a)}
function check(q,a){if(q.typ==='mc'||q.typ==='mehr'){const s=new Set(a);return s.size===q.richtig.length&&q.richtig.every(x=>s.has(x))}
 if(q.typ==='wf')return q.aussagen.every((x,i)=>(x[1]?1:0)===a[i]);if(q.typ==='zuo')return q.paare.every((p,i)=>p[1]===a[i]);return Math.abs(a-q.wert)<=q.tol+1e-9}
function solution(q){if(q.typ==='mc'||q.typ==='mehr')return'Richtig: '+q.richtig.map(i=>'„'+esc(q.optionen[i])+'“').join(' · ');

 return'Ergebnis: '+String(q.wert).replace('.',',')+' '+esc(q.einheit)}

 app.innerHTML=crumb(c.crumb)+`<div class="box"><div class="meta">${esc(c.titel)} · Seite ${P.pos+1} von ${n}</div><div class="bar" style="margin:6px 0 4px"><i style="width:${Math.round(100*(P.pos)/n)}%"></i></div>
 ${sit?`<div class="sit"><b>Situation:</b> ${esc(sit)}</div>`:''}<div id="qa">${render(q,c.seed)}</div><div id="fb"></div>
 <div class="nav"><button id="back" ${P.pos?'':'disabled'}>Zurück</button><span><button class="btn-p" id="chk" disabled>Prüfen</button> <button class="btn-p" id="nx" style="display:none">${P.pos+1<n?'Weiter':'Auswertung'}</button></span></div></div>`;
 const qa=$('#qa'),chk=$('#chk');
 const upd=()=>{chk.disabled=!complete(q,read(q))};
 qa.addEventListener('change',upd);qa.addEventListener('input',upd);
 qa.querySelectorAll('.tg button').forEach(b=>b.onclick=()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');upd()});
 $('#back').onclick=()=>{P.pos--;show()};
 const fin=(ok,a)=>{mark(q,a);$('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Richtig!':'Noch nicht ganz.'}</b><div>${ok?'':solution(q)+'<br>'}${esc(q.erkl)}</div>${q.norm?`<div class="norm">Fundstelle: ${esc(q.norm)}</div>`:''}</div>`;chk.style.display='none';$('#nx').style.display=''};
 if(P.done[q.id]!==undefined){restore(q,P.ans[q.id]);fin(P.done[q.id],P.ans[q.id])}
 chk.onclick=()=>{const a=read(q),ok=check(q,a);P.ans[q.id]=a;P.done[q.id]=ok;if(!c.sim){S[q.id]={ok,t:Date.now()};lerntag();save()}fin(ok,a)};
 $('#nx').onclick=()=>{if(P.pos+1<n){P.pos++;show()}else result()}}
function restore(q,a){const r=$('#qa');if(q.typ==='mc'||q.typ==='mehr')r.querySelectorAll('input').forEach(x=>x.checked=a.includes(+x.value));
 if(q.typ==='wf')r.querySelectorAll('.wf').forEach((w,i)=>{const b=w.querySelector(`button[data-v="${a[i]}"]`);if(b)b.classList.add('on')});
 if(q.typ==='zuo')r.querySelectorAll('.zu select').forEach((s,i)=>s.value=a[i]);if(q.typ==='zahl')r.querySelector('input').value=String(a).replace('.',',')}
function result(){const c=P.ctx,ok=P.list.filter(q=>P.done[q.id]).length,n=P.list.length,pct=Math.round(100*ok/n);let extra='';
 if(c.sim){const by={};P.list.forEach(q=>{const b=q.id.split('.')[0];by[b]=by[b]||[0,0];by[b][1]++;if(P.done[q.id])by[b][0]++});
  if(c.zaehlt&&!P.gespeichert){P.gespeichert=true;const s=simStand()||{anz:0,summe:{}},e={r:ok,n,d:heute(),by};
   s.anz=(s.anz|0)+1;s.letzte=e;if(!s.beste||e.r>s.beste.r)s.beste=e;s.summe=s.summe&&typeof s.summe==='object'?s.summe:{};
   Object.keys(by).forEach(b=>{const v=Array.isArray(s.summe[b])?s.summe[b]:[0,0];s.summe[b]=[v[0]+by[b][0],v[1]+by[b][1]]});S._sim=s;lerntag();save()}
  extra='<h2>Ergebnis je Prüfungsbereich</h2>'+Object.keys(by).sort().map(b=>{const m=D.module.find(x=>x.nr===b);const p=Math.round(100*by[b][0]/by[b][1]);return `<div style="margin:8px 0"><div class="meta">${b}. ${esc(m.titel)}: ${by[b][0]} von ${by[b][1]} (${p} %) ${p>=80?'· sicher':p>=50?'· teilweise sicher':'· noch üben'}</div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}
 if(c.sim&&c.zaehlt)extra+=`<p class="hint" data-simgespeichert>Ergebnis gespeichert${online?' und im <a href="pruefungspass.html">Prüfungspass</a> sichtbar':''}. Das Wiederholen der Fehler zählt nicht als neue Simulation.</p>`;
 const wrong=P.list.filter(q=>!P.done[q.id]);
 app.innerHTML=crumb(c.crumb)+`<div class="box"><h1>Auswertung</h1><div class="big">${pct} %</div><p>${ok} von ${n} Aufgaben richtig.${pct>=80?' Sehr gut, weiter so!':pct>=50?' Ordentlich – wiederholen Sie die Fehler.':' Arbeiten Sie die Lektion noch einmal durch.'}</p>${extra}
 <div class="nav"><button data-go="${c.back}">Zur Übersicht</button><span>${wrong.length?'<button class="btn-p" id="wr">Fehler wiederholen</button> ':''}<button class="btn-p" id="again">Neu starten</button></span></div></div>`;
 const w=$('#wr');if(w)w.onclick=()=>start(wrong,Object.assign({},c,{seed:c.seed+'f',zaehlt:false}));$('#again').onclick=()=>c.sim?sim():start(c.full||P.list,Object.assign({},c,{seed:c.seed+'n'}))}
function lektion(i,j,k){const m=D.module[i],a=m.abschnitte[j],l=a.lektionen[k],sit={};if(l.situation)l.items.forEach(q=>sit[q.id]=l.situation);
 start(l.items,{titel:`${a.nr} · Lektion ${k+1}: ${l.titel}`,crumb:[['Start','home'],[m.nr+'. '+m.titel,'m'+i],[a.nr+' '+a.titel,'a'+i+'.'+j],['Lektion '+(k+1)]],back:'a'+i+'.'+j,seed:'s',sit,full:l.items})}
function sim(){const all=[],sit={};D.module.forEach(m=>m.abschnitte.forEach(a=>a.lektionen.forEach(l=>l.items.forEach(q=>{all.push(q);if(l.situation)sit[q.id]=l.situation}))));
 const pick=shuf(all,String(Date.now())).slice(0,20);start(pick,{titel:'Prüfungssimulation',crumb:[['Start','home'],['Prüfungssimulation']],back:'home',seed:String(Date.now()),sit,sim:true,zaehlt:true})}
function go(t){$('#menu').classList.remove('on');window.scrollTo(0,0);
 if(t==='home')return home();if(t==='sim')return sim();
 let m;if(m=t.match(/^m(\d+)$/))return modul(+m[1]);if(m=t.match(/^a(\d+)\.(\d+)$/))return abschnitt(+m[1],+m[2]);if(m=t.match(/^l(\d+)\.(\d+)\.(\d+)$/))return lektion(+m[1],+m[2],+m[3])}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
 const a=e.target.closest('[data-a]');if(a){const v=a.dataset.a;if(v==='theme'){const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem(K+'_th',d.dataset.theme)}catch(e){}}
 else if(v==='reset'){if(window.confirm('Gesamten Fortschritt einschließlich der Simulationen löschen?')){S={};save();home()}}else if(v==='pass')location.href='pruefungspass.html';else go(v);$('#menu').classList.remove('on')}});
$('#mbtn').onclick=()=>$('#menu').classList.toggle('on');
try{const th=localStorage.getItem(K+'_th');if(th)document.documentElement.dataset.theme=th}catch(e){}
if(online)$('#menu').insertAdjacentHTML('beforeend','<button data-a="pass">Mein Prüfungspass</button>');
home();
</script>
</body>
</html>
