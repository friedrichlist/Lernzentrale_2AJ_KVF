<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prüfungstraining GAP 1</title>
<style>
:root{--bg:#f3f5f8;--card:#ffffff;--ink:#1d2733;--mute:#5c6b7a;--line:#dde3ea;--acc:#c8102e;--acc2:#0b4f8a;--ok:#1f7a3f;--okbg:#e6f4ea;--bad:#b3261e;--badbg:#fbe9e7;--pill:#eef2f6;--shadow:0 1px 3px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161c;--card:#1a222b;--ink:#e6edf3;--mute:#9aa8b6;--line:#2b3640;--acc:#ff5a6e;--acc2:#6cb4ff;--ok:#5fd38a;--okbg:#17321f;--bad:#ff8a80;--badbg:#3a1d1b;--pill:#24303b;--shadow:none}}
:root[data-theme="dark"]{--bg:#11161c;--card:#1a222b;--ink:#e6edf3;--mute:#9aa8b6;--line:#2b3640;--acc:#ff5a6e;--acc2:#6cb4ff;--ok:#5fd38a;--okbg:#17321f;--bad:#ff8a80;--badbg:#3a1d1b;--pill:#24303b;--shadow:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:3px solid var(--acc);position:sticky;top:0;z-index:5}
.hd{max-width:860px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:50%;border:3px solid var(--acc);display:grid;place-items:center;font-weight:800;color:var(--acc)}
.brand{font-weight:800;letter-spacing:.3px}.brand small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.sp{flex:1}button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px}
.btn-p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}.btn-p:disabled{opacity:.45;cursor:default}
main{max-width:860px;margin:auto;padding:16px}
.crumb{font-size:14px;color:var(--mute);margin:4px 0 12px}.crumb a{color:var(--acc2);text-decoration:none;cursor:pointer}
.box{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px;border:1px solid var(--line)}
h1{font-size:24px;margin:0 0 12px}h2{font-size:19px;margin:0 0 8px}
.card{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;cursor:pointer;background:var(--card)}
.card:hover{border-color:var(--acc2)}.ic{width:34px;height:34px;border-radius:50%;background:var(--acc2);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.ct{font-weight:600}.meta{font-size:13px;color:var(--mute)}.pills{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.pill{font-size:12px;background:var(--pill);border-radius:99px;padding:2px 10px;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}.dot.g{background:var(--ok)}.dot.b{background:var(--acc2)}
.bar{height:8px;background:var(--pill);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc2)}
.sit{background:var(--pill);border-left:4px solid var(--acc2);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:15px}
.q{font-weight:600;margin:12px 0}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;cursor:pointer}
.opt input{margin-top:4px}.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.wf{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.wf .tg{display:flex;gap:6px}.tg button{padding:4px 10px}.tg button.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.wf.ok{background:var(--okbg)}.wf.bad{background:var(--badbg)}
.zu{display:grid;grid-template-columns:1fr;gap:4px;margin:10px 0;padding:8px;border:1px solid var(--line);border-radius:8px}
.zu select{font:inherit;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.zu.ok{background:var(--okbg)}.zu.bad{background:var(--badbg)}
.num{display:flex;gap:8px;align-items:center}.num input{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);width:180px;background:var(--card);color:var(--ink)}
.fb{border-radius:8px;padding:10px 12px;margin-top:12px}.fb.ok{background:var(--okbg);border:1px solid var(--ok)}.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.norm{font-size:13px;color:var(--mute);margin-top:4px}.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mute)}.big{font-size:40px;font-weight:800}
.menu{position:absolute;right:16px;top:58px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:6px;display:none}
.menu.on{display:block}.menu button{display:block;width:100%;text-align:left;border:0;margin:2px 0}
@media (max-width:480px){h1{font-size:20px}.num input{width:130px}}
</style>
</head>
<body>
<header><div class="hd"><div class="logo">✓</div><div class="brand" id="brand"></div><div class="sp"></div><button id="mbtn" aria-label="Menü">☰</button></div>
<div class="menu" id="menu"><button data-a="home">Startseite</button><button data-a="sim">Prüfungssimulation (20 Aufgaben)</button><button data-a="theme">Hell/Dunkel</button><button data-a="reset">Fortschritt zurücksetzen</button></div></header>
<main id="app"></main>
<script>
const D={"titel":"Prüfungstraining GAP 1","untertitel":"Kaufleute für Versicherungen und Finanzanlagen · Teil 1 der Abschlussprüfung","stand":"08.10.2026","module":[{"nr":"1","titel":"Prozesse in der Versicherungswirtschaft einschätzen und berücksichtigen","lf":"LF 1","abschnitte":[{"nr":"1.1","titel":"Bedeutung der Versicherungswirtschaft","lf":"LF 1 / LF 2","buch":"S. 8–12","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Welcher Gedanke steht hinter dem Versicherungsprinzip?","optionen":["Jeder Versicherte spart mit seinen Beiträgen für den eigenen Schaden an und erhält sie am Ende zurück.","Der Staat gleicht über Steuermittel die Schäden aus, die einzelne Bürger nicht selbst tragen können.","Das Versicherungsunternehmen bezahlt alle Schäden aus seinem Eigenkapital, die Beiträge decken nur die Verwaltung.","Viele Versicherte mit gleichartigem Risiko zahlen Beiträge, aus denen die Schäden Einzelner bezahlt werden."],"richtig":[3],"erkl":"Versicherung beruht auf dem Risikoausgleich im Kollektiv: Die Gefahrengemeinschaft verteilt den zufälligen Schaden des Einzelnen auf alle.","norm":"Grundlagen","id":"1.1-1-1"},{"typ":"mc","frage":"Warum braucht ein Versicherer einen möglichst großen Bestand gleichartiger Risiken?","optionen":["Damit er höhere Provisionen an seine Vermittler zahlen und mehr Werbung finanzieren kann.","Damit er die Beiträge jedes Jahr unabhängig vom tatsächlichen Schadenverlauf erhöhen darf.","Damit sich der tatsächliche Schadenverlauf dem erwarteten annähert (Gesetz der großen Zahl).","Weil die Versicherungsaufsicht für jede Sparte eine Mindestzahl von Verträgen vorschreibt."],"richtig":[2],"erkl":"Je größer das Kollektiv, desto genauer lässt sich der Schadenbedarf vorhersagen – die Grundlage jeder Prämienkalkulation.","norm":"Grundlagen","id":"1.1-1-2"},{"typ":"zuo","frage":"Ordnen Sie die Rechtsform des Versicherers dem passenden Merkmal zu.","paare":[["Versicherungsverein auf Gegenseitigkeit (VVaG)","Die Versicherungsnehmer sind zugleich Mitglieder des Unternehmens."],["Aktiengesellschaft","Die Eigentümer sind Aktionäre, die eine Rendite erwarten."],["Öffentlich-rechtlicher Versicherer","Träger sind Länder, Kommunen oder Sparkassenverbände."]],"erkl":"Neben der AG und dem VVaG gibt es öffentlich-rechtliche Versicherer; die Rechtsformen für Versicherer regelt das VAG.","norm":"§ 8 Abs. 2 VAG","id":"1.1-1-3"},{"typ":"wf","frage":"Welche Aussagen zur volkswirtschaftlichen Bedeutung der Versicherungswirtschaft treffen zu?","aussagen":[["Versicherer legen die Beiträge an und sind damit bedeutende Kapitalgeber der Wirtschaft.",true],["Versicherungsschutz ermöglicht es Unternehmen, Risiken einzugehen und zu investieren.",true],["Versicherer entlasten die sozialen Sicherungssysteme, etwa durch private Altersvorsorge.",true],["Versicherungsbeiträge sind für den Staat ohne Bedeutung, weil auf sie keine Steuer anfällt.",false]],"erkl":"Auf die meisten Versicherungsbeiträge fällt Versicherungsteuer an; Versicherer sind Kapitalsammelstellen, Risikoträger und Arbeitgeber.","norm":"VersStG","id":"1.1-1-4"},{"typ":"mc","frage":"Was ist die Aufgabe eines Rückversicherers?","optionen":["Er schließt als Direktversicherer Verträge mit Privatkunden ab.","Er übernimmt einen Teil der Risiken des Erstversicherers.","Er prüft als staatliche Behörde die Zahlungsfähigkeit der Versicherer.","Er vermittelt als Makler Verträge zwischen Kunden und Versicherern."],"richtig":[1],"erkl":"Der Erstversicherer gibt Spitzen- und Großrisiken an Rückversicherer ab und stabilisiert so sein Ergebnis.","norm":"Grundlagen","id":"1.1-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Familie Lindner (zwei Kinder) hat gerade ein Grundstück gekauft und möchte darauf ein Einfamilienhaus bauen. Herr Lindner fragt Sie: „Wozu brauchen wir eigentlich so viele Versicherungen? Das kostet doch nur Geld.“","items":[{"typ":"mc","frage":"Mit welchem Argument erklären Sie Herrn Lindner den Nutzen einer Versicherung für seine Familie am besten?","optionen":["Ein Großschaden wie ein Brand des Rohbaus kann die Familie ruinieren; der Beitrag macht dieses Risiko kalkulierbar.","Ohne Versicherungsschutz für das Grundstück darf das Grundbuchamt die Familie nicht als Eigentümer eintragen.","Versicherungen lohnen sich, weil man über die Laufzeit in der Regel mehr zurückerhält, als man an Beiträgen einzahlt.","Für Bauherren ist der Abschluss aller wichtigen Versicherungen gesetzlich vorgeschrieben; sonst droht ein Bußgeld."],"richtig":[0],"erkl":"Einzelwirtschaftlich schützt Versicherung vor existenzbedrohenden Vermögensschäden (Planungssicherheit).","norm":"Grundlagen","id":"1.1-2-1"},{"typ":"zuo","frage":"Welche Gefahr während der Bauphase wird durch welche Versicherung abgedeckt?","paare":[["Ein Passant verletzt sich auf der ungesicherten Baustelle.","Bauherren-Haftpflichtversicherung"],["Ein Sturm reißt die frisch errichteten Dachsparren herunter.","Bauleistungsversicherung"],["Der Rohbau brennt nach einem Blitzschlag ab.","Feuer-Rohbauversicherung (meist im Wohngebäudevertrag)"]],"erkl":"Bauherren haften für die Verkehrssicherung der Baustelle; Bauleistungs- und Rohbauversicherung schützen das entstehende Gebäude.","norm":"§ 823 BGB","id":"1.1-2-2"},{"typ":"mc","frage":"Die Bank verlangt für die Baufinanzierung einen Nachweis. Welche Versicherung lässt sie sich in der Regel vor Auszahlung bestätigen?","optionen":["Die Rechtsschutzversicherung, weil sie jeden Streit mit der Baufirma abdeckt.","Die Hausratversicherung, weil sie den Neubau gegen Feuer und Sturm absichert.","Die Privathaftpflichtversicherung, weil sie Schäden am eigenen Neubau ersetzt.","Die Gebäudeversicherung mit Feuerrohbauschutz, weil das Haus das Darlehen sichert."],"richtig":[3],"erkl":"Das Gebäude dient als Kreditsicherheit (Grundschuld); die Bank will es gegen Zerstörung abgesichert wissen.","norm":"Grundlagen","id":"1.1-2-3"}]}]},{"nr":"1.2","titel":"Auswirkungen von Entwicklungstrends auf die Versicherungswirtschaft","lf":"LF 1 / LF 2","buch":"S. 13–18","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Trend eine typische Folge für Versicherer zu.","paare":[["Klimawandel","mehr und höhere Schäden durch Starkregen, Hochwasser und Sturm"],["Demografischer Wandel","wachsender Bedarf an privater Alters- und Pflegevorsorge"],["Digitalisierung","Onlineabschluss, digitale Schadenmeldung, neue Wettbewerber (Insurtechs)"],["Inflation","steigende Wiederherstellungskosten und Gefahr der Unterversicherung"]],"erkl":"Trends verändern Produkte, Prämien und Vertriebswege; Berater müssen Bestände daraufhin prüfen.","norm":"Grundlagen","id":"1.2-1-1"},{"typ":"mc","frage":"Ein Kunde möchte eine fondsgebundene Rentenversicherung abschließen. Was müssen Sie seit 2022 im Beratungsgespräch zusätzlich erfragen?","optionen":["Seine Zustimmung zur Datenweitergabe an Vergleichsportale.","Seine Schadenfreiheitsklasse in der Kfz-Versicherung.","Seine Nachhaltigkeitspräferenzen.","Seinen Verzicht auf das Widerrufsrecht."],"richtig":[2],"erkl":"Bei Versicherungsanlageprodukten gehören die Nachhaltigkeitspräferenzen zur Geeignetheitsprüfung.","norm":"Delegierte VO (EU) 2017/2359, geändert durch Delegierte VO (EU) 2021/1257; § 7c VVG","id":"1.2-1-2"},{"typ":"wf","frage":"Welche Aussagen zur Digitalisierung in der Versicherungswirtschaft treffen zu?","aussagen":[["Telematiktarife in der Kfz-Versicherung belohnen ein vorsichtiges Fahrverhalten.",true],["Künstliche Intelligenz kann einfache Schadenfälle automatisch prüfen.",true],["Durch Vergleichsportale wird der Markt für Kunden transparenter.",true],["Bei einem Onlineabschluss gelten keine Informationspflichten.",false]],"erkl":"Auch im Fernabsatz gelten die Informationspflichten; sie müssen in Textform erfüllt werden.","norm":"§ 7 VVG","id":"1.2-1-3"},{"typ":"mc","frage":"Warum steigt durch Cyberkriminalität auch der Beratungsbedarf bei Privatkunden?","optionen":["Weil Privatkunden gesetzlich verpflichtet sind, eine eigene Cyberversicherung abzuschließen.","Weil Schäden durch Identitätsdiebstahl oder Onlinebetrug in klassischen Verträgen oft nicht gedeckt sind.","Weil Banken seit 2020 Schäden aus Onlinebetrug ihrer Kunden grundsätzlich nicht mehr ersetzen dürfen.","Weil Cyberschäden seit 2022 automatisch in jeder Privathaftpflichtversicherung enthalten sind."],"richtig":[1],"erkl":"Viele Versicherer bieten Cyber- oder Internetschutz als Baustein an; die Lücke muss im Gespräch erkannt werden.","norm":"Grundlagen","id":"1.2-1-4"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Ihre Agentur möchte nachhaltiger werden. Die Agenturleiterin bittet Sie, Vorschläge zu sammeln und den Kunden zu erklären, was Nachhaltigkeit für einen Versicherer bedeutet.","items":[{"typ":"mc","frage":"Welche Maßnahme senkt den Ressourcenverbrauch der Agentur am deutlichsten?","optionen":["Policen, Rechnungen und Schadenmeldungen auf digitalen Versand umstellen.","Kundenakten zusätzlich auf Papier archivieren und per Post an die Direktion senden.","Sämtliche Policen und Rechnungen zur Sicherheit doppelt ausdrucken und abheften.","Alle Beratungsgespräche ausschließlich als Präsenztermine in der Agentur durchführen."],"richtig":[0],"erkl":"Papierlose Prozesse sparen Papier, Porto und Transportwege.","norm":"Grundlagen","id":"1.2-2-1"},{"typ":"wf","frage":"Welche Aussagen beschreiben Nachhaltigkeit bei einem Versicherer zutreffend?","aussagen":[["Der Versicherer legt Kapital nach ökologischen und sozialen Kriterien (ESG) an.",true],["Bei Schäden werden Reparatur und gebrauchte Ersatzteile gefördert, wo es sinnvoll ist.",true],["Nachhaltigkeit betrifft nur die Werbung des Versicherers.",false],["Der Versicherer berichtet über seine Nachhaltigkeit nach gesetzlichen Vorgaben.",true]],"erkl":"ESG umfasst Umwelt (Environment), Soziales (Social) und gute Unternehmensführung (Governance).","norm":"Offenlegungs-VO (EU) 2019/2088","id":"1.2-2-2"},{"typ":"mc","frage":"Ein Kunde meint, der Klimawandel betreffe ihn nicht, er wohne ja nicht an einem Fluss. Welche Antwort ist fachlich richtig?","optionen":["Gegen Folgen des Klimawandels kann man sich in Deutschland nicht versichern; hier hilft nur der Staat.","Ohne Fluss in der Nähe sind Überschwemmungsschäden durch Starkregen praktisch ausgeschlossen.","Überschwemmung durch Starkregen ist in jeder Wohngebäudeversicherung automatisch mitversichert.","Starkregen kann überall zu Überschwemmung führen; dagegen hilft der Einschluss weiterer Naturgefahren."],"richtig":[3],"erkl":"Überschwemmung durch Starkregen und Rückstau gehören zu den Elementargefahren und müssen gesondert vereinbart werden.","norm":"VGB/VHB, weitere Naturgefahren","id":"1.2-2-3"}]}]}]},{"nr":"2","titel":"Kundinnen und Kunden ganzheitlich beraten und betreuen","lf":"LF 3 / LF 2","abschnitte":[{"nr":"2.1","titel":"Kundendaten erheben und pflegen, Anlässe zur Bedarfsanalyse nutzen","lf":"LF 3","buch":"S. 19–31","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie den Lebensereignissen einen typischen Versicherungsbedarf zu.","paare":[["Auszug aus dem Elternhaus","eigene Privathaftpflicht- und Hausratversicherung"],["Geburt eines Kindes","Risikolebensversicherung und Prüfung der Familienabsicherung"],["Kauf eines Hauses","Wohngebäudeversicherung und Absicherung des Darlehens"],["Erster Arbeitsvertrag","Absicherung der Arbeitskraft (Berufsunfähigkeit)"]],"erkl":"Lebensereignisse sind die wichtigsten Beratungsanlässe; sie verändern Risiken und Bedarf.","norm":"Bedarfsanalyse","id":"2.1-1-1"},{"typ":"mc","frage":"Auf welcher Rechtsgrundlage darf die Agentur Kundendaten verarbeiten, die für den Abschluss eines Versicherungsvertrags nötig sind?","optionen":["Gar nicht, denn Kundendaten dürfen ausschließlich beim Versicherer liegen.","Nur auf der Grundlage einer notariell beglaubigten Einwilligung des Kunden.","Auf der Grundlage der Vertragserfüllung bzw. vorvertraglicher Maßnahmen.","Nur auf der Grundlage einer Genehmigung der Datenschutzaufsichtsbehörde."],"richtig":[2],"erkl":"Die DSGVO erlaubt die Verarbeitung, wenn sie für einen Vertrag oder vorvertragliche Maßnahmen erforderlich ist.","norm":"Art. 6 Abs. 1 lit. b DSGVO","id":"2.1-1-2"},{"typ":"mc","frage":"Für die Verarbeitung von Gesundheitsdaten (z. B. Vorerkrankungen im Antrag) gilt …","optionen":["… nur die Pflicht, sie spätestens ein Jahr nach Vertragsschluss wieder zu löschen.","… ein besonderer Schutz; sie ist in der Regel nur mit ausdrücklicher Einwilligung zulässig.","… nichts Besonderes; sie werden genauso wie Name und Anschrift behandelt.","… ein generelles Verbot, selbst wenn der Kunde ausdrücklich und schriftlich einwilligt."],"richtig":[1],"erkl":"Gesundheitsdaten gehören zu den besonderen Kategorien personenbezogener Daten.","norm":"Art. 9 DSGVO","id":"2.1-1-3"},{"typ":"wf","frage":"Welche Rechte hat ein Kunde nach der DSGVO?","aussagen":[["Er kann Auskunft über die gespeicherten Daten verlangen.",true],["Er kann die Berichtigung falscher Daten verlangen.",true],["Er kann die Löschung verlangen, wenn die Daten nicht mehr benötigt werden und keine Aufbewahrungspflicht besteht.",true],["Er kann verlangen, dass der Versicherer seine Schadenakte sofort vernichtet, auch wenn der Schaden noch läuft.",false]],"erkl":"Auskunft, Berichtigung und Löschung sind Betroffenenrechte; gesetzliche Aufbewahrungspflichten gehen der Löschung vor.","norm":"Art. 15–17 DSGVO","id":"2.1-1-4"},{"typ":"mc","frage":"Was ist der Zweck eines Kundenbetreuungssystems (CRM) in der Agentur?","optionen":["Kundendaten, Verträge und Kontakte zentral zu pflegen und Beratungsanlässe zu erkennen.","Kundendaten ohne deren Wissen an Adresshändler und andere Unternehmen weiterzugeben.","Die gesamte Finanzbuchhaltung der Agentur einschließlich der Steuererklärung zu ersetzen.","Werbeanrufe automatisch an alle gespeicherten Telefonnummern zu richten."],"richtig":[0],"erkl":"Ein gepflegter Bestand zeigt Lücken und Anlässe (z. B. Geburtstag, Vertragsablauf) und ermöglicht gezielte Ansprache.","norm":"Grundlagen","id":"2.1-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Kessler (28) meldet in der Agentur ihren Umzug in eine größere Wohnung. Sie zieht mit ihrem Partner zusammen und erwähnt beiläufig, dass sie bald heiraten wollen. Bisher hat sie bei Ihnen nur eine Hausratversicherung.","items":[{"typ":"mc","frage":"Was ist Ihr wichtigster nächster Schritt?","optionen":["Nur die neue Adresse ändern, da sich am Versicherungsbedarf dadurch nichts ändert.","Die Hausratversicherung kündigen, weil sie in der neuen Wohnung nicht mehr gilt.","Sofort und ohne Rückfrage ein Angebot für eine Lebensversicherung zusenden.","Den Anlass für eine umfassende Bedarfsanalyse nutzen und einen Termin vorschlagen."],"richtig":[3],"erkl":"Umzug, Zusammenziehen und Heirat verändern den Bedarf; der Kontakt ist ein Beratungsanlass.","norm":"§ 61 VVG","id":"2.1-2-1"},{"typ":"wf","frage":"Welche Punkte sollten Sie im Termin prüfen?","aussagen":[["Versicherungssumme der Hausratversicherung für die größere Wohnung und den gemeinsamen Hausrat",true],["ob beide Partner in einer gemeinsamen Privathaftpflicht abgesichert werden können",true],["eine Kündigung ihrer Hausratversicherung, weil der Partner schon eine hat, ohne dessen Versicherungssumme zu prüfen",false],["bestehende Verträge des Partners, um Doppelversicherungen zu vermeiden",true]],"erkl":"Bei Zusammenzug drohen Unterversicherung im Hausrat und doppelte Verträge.","norm":"Bedarfsanalyse","id":"2.1-2-2"},{"typ":"mc","frage":"Frau Kessler möchte, dass Sie ihre neue Telefonnummer speichern und sie künftig auch telefonisch zu neuen Angeboten anrufen. Was müssen Sie beachten?","optionen":["Eine Einwilligung in Werbeanrufe ist nur wirksam, wenn sie notariell beurkundet wird.","Als Bestandskundin dürfen Sie sie ohne Einwilligung jederzeit zu Werbezwecken anrufen.","Für Werbeanrufe brauchen Sie ihre vorherige ausdrückliche Einwilligung, die Sie dokumentieren.","Eine mutmaßliche Einwilligung genügt, weil sie Ihnen die Nummer selbst gegeben hat."],"richtig":[2],"erkl":"Werbeanrufe bei Verbrauchern ohne vorherige ausdrückliche Einwilligung sind eine unzumutbare Belästigung; die Einwilligung ist zu dokumentieren.","norm":"§ 7 Abs. 2 UWG, § 7a UWG","id":"2.1-2-3"}]}]},{"nr":"2.2","titel":"Kommunikationsformen und -wege kunden- und serviceorientiert wählen","lf":"LF 3","buch":"S. 32–41","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie den Fragetyp dem Beispiel zu.","paare":[["Offene Frage","Wie wohnen Sie zurzeit?"],["Geschlossene Frage","Haben Sie einen Hund?"],["Alternativfrage","Passt Ihnen Dienstag oder Donnerstag besser?"],["Suggestivfrage","Sie wollen doch sicher nicht ohne Schutz dastehen, oder?"]],"erkl":"Offene Fragen erschließen den Bedarf; Suggestivfragen manipulieren und sind in der Beratung zu vermeiden.","norm":"Gesprächsführung","id":"2.2-1-1"},{"typ":"mc","frage":"Ein Kunde sagt: „Das ist mir zu teuer.“ Welche Reaktion entspricht einer guten Einwandbehandlung?","optionen":["Das Thema sofort wechseln und später erneut auf einen Abschluss drängen.","Den Einwand ernst nehmen, nach dem Vergleichsmaßstab fragen und den Nutzen darstellen.","Ohne Rücksprache einen Rabatt aus der eigenen Provision anbieten.","Dem Kunden widersprechen und den Preis mit dem Hinweis auf die Qualität verteidigen."],"richtig":[1],"erkl":"Einwände sind Signale für Informationsbedarf. Provisionsabgaben sind zudem grundsätzlich verboten.","norm":"§ 48b VAG","id":"2.2-1-2"},{"typ":"wf","frage":"Welche Aussagen zu Kommunikationswegen treffen zu?","aussagen":[["Ein Videogespräch eignet sich für Beratungen, wenn der Kunde nicht in die Agentur kommen kann.",true],["Werbe-E-Mails an Verbraucher sind ohne vorherige Einwilligung grundsätzlich unzulässig.",true],["Über einen Messengerdienst dürfen Gesundheitsdaten ohne Weiteres ausgetauscht werden.",false],["Ein Brief eignet sich für förmliche Mitteilungen, die nachweisbar sein sollen.",true]],"erkl":"Bei jedem Kanal sind Datenschutz und Wettbewerbsrecht zu beachten; sensible Daten nur über sichere Wege.","norm":"§ 7 UWG, Art. 32 DSGVO","id":"2.2-1-3"},{"typ":"mc","frage":"Nach dem Vier-Ohren-Modell kann eine Nachricht auf vier Ebenen gehört werden. Welche gehört NICHT dazu?","optionen":["Preisebene","Appellebene","Beziehungsebene","Sachebene"],"richtig":[0],"erkl":"Die vier Seiten sind Sachinhalt, Selbstkundgabe, Beziehung und Appell (Schulz von Thun).","norm":"Kommunikationsmodell","id":"2.2-1-4"},{"typ":"mc","frage":"Was gehört zum aktiven Zuhören?","optionen":["Den Kunden unterbrechen, sobald er vom Thema abweicht.","Nebenbei Notizen und E-Mails bearbeiten, um Zeit zu sparen.","Möglichst früh die passenden Produkte ausführlich erklären.","Das Gesagte mit eigenen Worten zusammenfassen und nachfragen."],"richtig":[3],"erkl":"Paraphrasieren und Nachfragen zeigen Interesse und verhindern Missverständnisse.","norm":"Gesprächsführung","id":"2.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Ihre Agentur plant eine Aktion zum Thema Elementarschutz für alle Hausratkunden. Ihr Kollege schlägt vor, alle Kunden aus dem Bestand unangekündigt anzurufen und zusätzlich einen Newsletter an alle E-Mail-Adressen zu senden.","items":[{"typ":"mc","frage":"Wie beurteilen Sie den Vorschlag der unangekündigten Werbeanrufe?","optionen":["Zulässig, weil bei Bestandskunden eine mutmaßliche Einwilligung ausreicht.","Zulässig, wenn der Anruf nicht mit unterdrückter Rufnummer erfolgt.","Unzulässig bei Kunden ohne vorherige ausdrückliche Einwilligung in Telefonwerbung.","Zulässig, wenn die Kunden in den letzten zwei Jahren einen Vertrag abgeschlossen haben."],"richtig":[2],"erkl":"Auch Bestandskunden dürfen ohne vorherige ausdrückliche Einwilligung nicht zu Werbezwecken angerufen werden.","norm":"§ 7 Abs. 2 UWG","id":"2.2-2-1"},{"typ":"mc","frage":"Unter welcher Voraussetzung darf die Agentur Bestandskunden ohne gesonderte Einwilligung per E-Mail auf ähnliche eigene Produkte hinweisen?","optionen":["Die Adresse stammt aus einem Vertrag, es geht um beliebige Versicherungsprodukte und der Kunde wird einmal im Jahr auf sein Widerspruchsrecht hingewiesen.","Die Adresse stammt aus einem Vertrag, es geht um ähnliche Produkte, der Kunde hat nicht widersprochen und wird stets auf sein Widerspruchsrecht hingewiesen.","Die Adresse ist öffentlich bekannt, es geht um ähnliche Produkte und der Kunde kann sich jederzeit über einen Link in der Mail vom Newsletter abmelden.","Die Adresse stammt aus einem Vertrag, der Kunde ist seit mindestens zwei Jahren Kunde und die Mail wird von der Agentur selbst und nicht vom Versicherer versandt."],"richtig":[1],"erkl":"Das UWG kennt für Bestandskunden eine eng begrenzte Ausnahme mit allen vier Voraussetzungen.","norm":"§ 7 Abs. 3 UWG","id":"2.2-2-2"},{"typ":"zuo","frage":"Welcher Kommunikationsweg passt zu welchem Ziel der Aktion?","paare":[["Kunden ohne jede Werbeeinwilligung informieren","Hinweis bei der nächsten Vertragskorrespondenz oder im persönlichen Gespräch"],["Kunden mit Einwilligung kurzfristig erreichen","E-Mail-Newsletter mit Abmeldelink"],["Kunden mit Beratungsbedarf individuell beraten","persönlicher Termin oder Videogespräch"]],"erkl":"Der Kanal muss zum Ziel und zur rechtlichen Lage passen.","norm":"§ 7 UWG","id":"2.2-2-3"}]}]},{"nr":"2.3","titel":"Informations-, Beratungs- und Dokumentationspflichten einhalten","lf":"LF 2 / LF 3","buch":"S. 42–58","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Wann muss der Versicherungsvertreter dem Kunden seine Statusinformation (u. a. Name, Anschrift, Status, Registernummer) geben?","optionen":["Beim ersten Geschäftskontakt, klar und verständlich in Textform.","Einmal jährlich, zusammen mit der Beitragsrechnung in Textform.","Nur auf ausdrücklichen Wunsch des Kunden, dann in Textform.","Erst bei Vertragsschluss, gemeinsam mit dem Versicherungsschein."],"richtig":[0],"erkl":"Die Erstinformation gehört an den Anfang der Geschäftsbeziehung.","norm":"§ 15 VersVermV","id":"2.3-1-1"},{"typ":"zuo","frage":"Ordnen Sie den Pflichten des Vermittlers den passenden Inhalt zu.","paare":[["Befragungspflicht","nach Wünschen und Bedürfnissen des Kunden fragen"],["Beratungspflicht","auf Grundlage der Angaben einen geeigneten Rat geben"],["Begründungspflicht","die Gründe für den Rat angeben"],["Dokumentationspflicht","Wünsche, Rat und Gründe vor Vertragsschluss in Textform festhalten"]],"erkl":"Die Pflichten richten sich nach der Schwierigkeit des Produkts, der Person und der Situation des Kunden.","norm":"§§ 61, 62 VVG","id":"2.3-1-2"},{"typ":"mc","frage":"Ein Kunde möchte auf die Beratung verzichten. Was ist dafür nötig?","optionen":["Ein angekreuztes Feld im Antrag mit kurzem Hinweis auf mögliche Nachteile.","Eine gesonderte Erklärung in Textform ohne weiteren Hinweis auf Nachteile.","Eine mündliche Erklärung, die der Vermittler im Gesprächsprotokoll vermerkt.","Eine gesonderte schriftliche Erklärung mit Hinweis auf mögliche Nachteile."],"richtig":[3],"erkl":"Der Verzicht muss gesondert, schriftlich und mit Warnhinweis erklärt werden; im Fernabsatz genügt die Textform (§ 61 Abs. 2 Satz 2 VVG).","norm":"§ 61 Abs. 2 VVG, § 6 Abs. 3 VVG","id":"2.3-1-3"},{"typ":"wf","frage":"Welche Aussagen zu den Informationspflichten des Versicherers treffen zu?","aussagen":[["Die Informationen müssen rechtzeitig vor Abgabe der Vertragserklärung in Textform übermittelt werden.",true],["Zu den Informationen gehören die Versicherungsbedingungen.",true],["Verbraucher erhalten zusätzlich ein Produktinformationsblatt.",true],["Die Informationen dürfen immer erst mit der Police verschickt werden.",false]],"erkl":"Wird der Vertrag auf Verlangen des Kunden telefonisch oder über ein anderes Kommunikationsmittel geschlossen, das die vorherige Information nicht erlaubt, oder verzichtet der Kunde durch gesonderte schriftliche Erklärung, ist die Information unverzüglich nachzuholen.","norm":"§ 7 VVG, VVG-InfoV","id":"2.3-1-4"},{"typ":"mc","frage":"Ein Vermittler berät falsch und dokumentiert die Beratung nicht. Der Kunde erleidet dadurch einen Schaden. Welche Folge ist möglich?","optionen":["Der Vertrag gilt automatisch als von Anfang an nicht geschlossen.","Der Vermittler kann lediglich vom Versicherer abgemahnt werden.","Der Vermittler ist dem Kunden zum Schadenersatz verpflichtet.","Der Kunde hat keine Ansprüche, weil er den Antrag unterschrieben hat."],"richtig":[2],"erkl":"Bei schuldhafter Verletzung der Beratungs- oder Dokumentationspflicht haftet der Vermittler; fehlende Dokumentation erschwert ihm den Beweis.","norm":"§ 63 VVG","id":"2.3-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Okafor (45) ruft in der Agentur an und möchte „ganz schnell“ eine Unfallversicherung abschließen, weil er nächste Woche mit dem Mountainbike in die Alpen fährt. Für ein Beratungsgespräch habe er keine Zeit.","items":[{"typ":"mc","frage":"Darf der Vertreter auf die Beratung verzichten, weil der Kunde keine Zeit hat?","optionen":["Ja, weil bei der Unfallversicherung grundsätzlich keine Beratungspflicht besteht.","Nur bei gesondertem Verzicht mit Hinweis auf Nachteile; am Telefon genügt die Textform.","Ja, weil Zeitmangel des Kunden den Vertreter von der Beratungspflicht befreit.","Nein, ein Verzicht auf die Beratung ist gesetzlich in keinem Fall möglich."],"richtig":[1],"erkl":"Zeitdruck ersetzt nicht den förmlichen Verzicht; im Fernabsatz genügt dafür die Textform.","norm":"§ 61 Abs. 2 VVG","id":"2.3-2-1"},{"typ":"mc","frage":"Herr Okafor möchte den Vertrag am Telefon abschließen und die Unterlagen später lesen. Wann müssen die Vertragsinformationen dann übermittelt werden?","optionen":["Unverzüglich nach Vertragsschluss, wenn der telefonische Abschluss auf seinen Wunsch erfolgt.","Erst nach Ablauf der Widerrufsfrist, damit der Vertrag bereits sicher besteht.","Innerhalb von 14 Tagen nach Vertragsschluss, sobald er die erste Prämie gezahlt hat.","Gar nicht mehr, weil er mit dem telefonischen Abschluss auf die Unterlagen verzichtet hat."],"richtig":[0],"erkl":"Bei telefonischem Abschluss auf Verlangen des Kunden darf die Information unverzüglich nachgeholt werden.","norm":"§ 7 Abs. 1 Satz 3 VVG","id":"2.3-2-2"},{"typ":"wf","frage":"Was gehört in die Beratungsdokumentation des Vertreters?","aussagen":[["die geäußerten Wünsche und Bedürfnisse des Kunden",true],["der erteilte Rat und seine Gründe",true],["ein Verzicht des Kunden auf die Beratung mit dem Warnhinweis, falls er verzichtet hat",true],["die private Meinung des Vertreters über den Kunden",false]],"erkl":"Die Dokumentation ist dem Kunden vor Vertragsschluss in Textform zu übermitteln.","norm":"§ 62 VVG","id":"2.3-2-3"}]}]}]},{"nr":"3","titel":"Rechtliche und vertragliche Rahmenbedingungen einhalten","lf":"LF 2 / LF 3","abschnitte":[{"nr":"3.1","titel":"Verbraucherschutz, Wettbewerbsrecht, Geldwäsche, Aufsicht und Vermittlerrecht","lf":"LF 3","buch":"S. 59–72","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Wer braucht für die Versicherungsvermittlung KEINE eigene Erlaubnis der IHK?","optionen":["Der Mehrfachvertreter, der ohne Haftungsübernahme für mehrere Versicherer tätig ist.","Der Versicherungsmakler, der im Auftrag des Kunden mehrere Versicherer vergleicht.","Der Versicherungsberater, der gegen Honorar unabhängig von Versicherern berät.","Der gebundene Vertreter, für den der Versicherer die uneingeschränkte Haftung übernimmt."],"richtig":[3],"erkl":"Der gebundene (Ausschließlichkeits-)Vertreter wird vom Versicherer ins Register gemeldet und braucht keine eigene Erlaubnis.","norm":"§ 34d Abs. 7 GewO","id":"3.1-1-1"},{"typ":"zahl","frage":"Wie viele Stunden Weiterbildung muss ein Versicherungsvermittler mindestens je Kalenderjahr nachweisen?","wert":15,"einheit":"Stunden","tol":0,"erkl":"Vermittler und die an der Vermittlung mitwirkenden Beschäftigten müssen sich jährlich mindestens 15 Stunden weiterbilden.","norm":"§ 34d Abs. 9 GewO, § 7 VersVermV","id":"3.1-1-2"},{"typ":"zuo","frage":"Ordnen Sie den Vermittlertyp seiner Rechtsstellung zu.","paare":[["Versicherungsvertreter","ist vom Versicherer beauftragt und steht in dessen Lager"],["Versicherungsmakler","ist vom Kunden beauftragt und steht in dessen Lager"],["Versicherungsberater","berät gegen Honorar, ohne Provision von Versicherern anzunehmen"]],"erkl":"Die Stellung entscheidet über Pflichten und Haftung.","norm":"§ 59 VVG, § 34d GewO","id":"3.1-1-3"},{"typ":"wf","frage":"Welche Aussagen zum Geldwäschegesetz bei der Vermittlung von Lebensversicherungen treffen zu?","aussagen":[["Ein Versicherungsmakler, der Lebensversicherungen vermittelt, gehört zu den Verpflichteten nach dem Geldwäschegesetz.",true],["Der Vertragspartner ist zu identifizieren, z. B. anhand des Personalausweises; ein gebundener Vertreter tut dies für den Versicherer.",true],["Verdachtsfälle werden an die Zentralstelle für Finanztransaktionsuntersuchungen (FIU) gemeldet.",true],["Der Kunde muss vorab darüber informiert werden, dass eine Verdachtsmeldung abgegeben wird.",false]],"erkl":"Gebundene Vertreter sind wegen der Ausnahme für § 34d Abs. 7 GewO nicht selbst Verpflichtete; sie wirken für den Versicherer mit und melden über dessen Geldwäschebeauftragten. Der Kunde darf über eine Verdachtsmeldung nicht informiert werden.","norm":"§§ 2, 10, 43, 47 GwG","id":"3.1-1-4"},{"typ":"mc","frage":"Ein Vertreter bietet einem Kunden an, ihm einen Teil seiner Provision zurückzugeben, wenn er den Vertrag abschließt. Wie ist das zu beurteilen?","optionen":["Zulässig, weil es sich um einen üblichen Preisnachlass handelt.","Zulässig bei Verträgen mit einer Laufzeit von mehr als zehn Jahren.","Unzulässig, weil es gegen das Provisionsabgabeverbot verstößt.","Zulässig, wenn der Vertreter den Versicherer vorher informiert."],"richtig":[2],"erkl":"Sondervergütungen an Versicherungsnehmer sind grundsätzlich verboten (Ausnahme: geringwertige Zuwendungen); zulässig ist sie außerdem zur dauerhaften Prämiensenkung oder Leistungserhöhung (§ 48c VAG).","norm":"§ 48b VAG","id":"3.1-1-5"},{"typ":"mc","frage":"Welche Behörde beaufsichtigt in Deutschland die Versicherungsunternehmen?","optionen":["Der Versicherungsombudsmann als unabhängige Schlichtungsstelle.","Die Bundesanstalt für Finanzdienstleistungsaufsicht (BaFin).","Die Industrie- und Handelskammer am Sitz des Versicherers.","Das Bundeskartellamt als oberste Wettbewerbsbehörde."],"richtig":[1],"erkl":"Die BaFin übt die Rechts- und Finanzaufsicht aus; die IHK ist für die Erlaubnis und Registrierung der Vermittler zuständig.","norm":"§ 320 Abs. 1 VAG (Zuständigkeit), § 294 VAG (Aufgaben)","id":"3.1-1-6"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Brandt (62) möchte bei Ihnen eine Rentenversicherung gegen Einmalbeitrag von 180.000 € abschließen. Den Betrag will er bar einzahlen. Auf die Frage nach der Herkunft des Geldes reagiert er ausweichend.","items":[{"typ":"mc","frage":"Was muss vor Vertragsschluss in jedem Fall geschehen?","optionen":["Herrn Brandt identifizieren (lassen) und seine Daten aufzeichnen.","Auf die Identifizierung verzichten, weil er bereits älter als 60 Jahre ist.","Nichts, weil Rentenversicherungen nicht unter das Geldwäschegesetz fallen.","Den Betrag annehmen und die Herkunft erst nach Vertragsschluss klären."],"richtig":[0],"erkl":"Bei der Vermittlung von Lebensversicherungen ist der Vertragspartner zu identifizieren; ein gebundener Vertreter erledigt das für den Versicherer, der Verpflichteter nach dem GwG ist.","norm":"§§ 10, 11 GwG","id":"3.1-2-1"},{"typ":"mc","frage":"Welches Verhalten ist richtig, wenn Sie einen Geldwäscheverdacht haben?","optionen":["Den Verdacht der Polizei melden und den Kunden über die Meldung informieren.","Den Kunden auf den Verdacht ansprechen und ihm Gelegenheit zur Erklärung geben.","Den Vertrag abschließen und den Verdacht erst bei der nächsten Jahresprüfung melden.","Den Verdacht unverzüglich melden, ohne den Kunden darüber zu informieren."],"richtig":[3],"erkl":"Verdachtsmeldepflicht und Verbot der Informationsweitergabe gelten nebeneinander. Als gebundener Vertreter melden Sie über den Geldwäschebeauftragten des Versicherers an die FIU.","norm":"§§ 43, 47 GwG","id":"3.1-2-2"},{"typ":"zahl","frage":"Wie viele Jahre müssen die Aufzeichnungen aus der Identifizierung mindestens aufbewahrt werden?","wert":5,"einheit":"Jahre","tol":0,"erkl":"Die Aufzeichnungen sind fünf Jahre aufzubewahren.","norm":"§ 8 Abs. 4 GwG","id":"3.1-2-3"}]}]},{"nr":"3.2","titel":"Über das Zustandekommen von Verträgen informieren","lf":"LF 2","buch":"S. 73–89","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie die Begriffe richtig zu.","paare":[["Antragsmodell","Der Kunde stellt den Antrag, der Versicherer nimmt ihn mit der Police an."],["Invitatiomodell","Der Kunde fordert ein Angebot an, der Versicherer macht es, der Kunde nimmt an."],["Vorläufige Deckung","eigenständiger Vertrag, der Schutz bis zur Entscheidung über den Hauptvertrag gibt"]],"erkl":"Beim Antragsmodell ist der Antrag des Kunden das Angebot im Sinne des BGB.","norm":"§§ 145 ff. BGB, §§ 49 ff. VVG","id":"3.2-1-1"},{"typ":"zahl","frage":"Wie viele Tage beträgt die Widerrufsfrist bei einer Hausratversicherung?","wert":14,"einheit":"Tage","tol":0,"erkl":"Die Frist beginnt, wenn der Kunde Police, Bedingungen, Informationen und die Belehrung in Textform erhalten hat.","norm":"§ 8 Abs. 1 und 2 VVG","id":"3.2-1-2"},{"typ":"zahl","frage":"Wie viele Tage beträgt die Widerrufsfrist bei einer Lebensversicherung?","wert":30,"einheit":"Tage","tol":0,"erkl":"Für Lebensversicherungen gilt eine verlängerte Widerrufsfrist.","norm":"§ 152 Abs. 1 VVG","id":"3.2-1-3"},{"typ":"mc","frage":"Die Police weicht vom Antrag ab, der Versicherer hat auf die Abweichung deutlich hingewiesen. Was gilt, wenn der Kunde nicht reagiert?","optionen":["Der Vertrag ist unwirksam, weil sich Antrag und Police inhaltlich nicht decken.","Die Abweichung gilt als genehmigt, wenn er nicht binnen 14 Tagen nach Zugang widerspricht.","Die Abweichung gilt als genehmigt, wenn er nicht binnen eines Monats nach Zugang widerspricht.","Der Vertrag gilt mit dem Inhalt des Antrags, solange der Kunde der Abweichung nicht zustimmt."],"richtig":[2],"erkl":"Bei deutlichem Hinweis gilt die Abweichung als genehmigt, wenn der Kunde nicht binnen eines Monats in Textform widerspricht; ohne Hinweis gilt der Antragsinhalt.","norm":"§ 5 VVG","id":"3.2-1-4"},{"typ":"zuo","frage":"Ordnen Sie die Begriffe zum Versicherungsbeginn zu.","paare":[["Formeller Beginn","Zeitpunkt des Vertragsschlusses"],["Materieller Beginn","Zeitpunkt, ab dem der Versicherer haftet"],["Technischer Beginn","Zeitpunkt, ab dem die Prämie berechnet wird"]],"erkl":"Die drei Zeitpunkte können auseinanderfallen, z. B. bei einer Rückwärtsversicherung.","norm":"Grundlagen; § 2 VVG (Rückwärtsversicherung)","id":"3.2-1-5"},{"typ":"wf","frage":"Welche Aussagen zur Geschäftsfähigkeit treffen zu?","aussagen":[["Ein Sechsjähriger ist geschäftsunfähig.",true],["Ein 16-Jähriger braucht für einen Versicherungsvertrag grundsätzlich die Zustimmung seiner gesetzlichen Vertreter, es sei denn, er bewirkt die Leistung mit Mitteln, die ihm zur freien Verfügung überlassen wurden.",true],["Ein ohne Zustimmung geschlossener Vertrag eines Minderjährigen ist grundsätzlich schwebend unwirksam, bis die Eltern ihn genehmigen.",true],["Ab 14 Jahren ist man voll geschäftsfähig.",false]],"erkl":"Volle Geschäftsfähigkeit beginnt mit 18; zwischen 7 und 17 ist man beschränkt geschäftsfähig.","norm":"§§ 104, 106, 107, 108, 110 BGB","id":"3.2-1-6"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Leonie (17) hat einen E-Scooter von ihren Großeltern geschenkt bekommen und möchte bei Ihnen eine Versicherungsplakette kaufen. Sie will den Beitrag von ihrem Taschengeld bezahlen. Ihre Eltern wissen noch nichts davon.","items":[{"typ":"mc","frage":"Kann Leonie den Vertrag ohne Zustimmung der Eltern wirksam schließen?","optionen":["Ja, weil ihr der Versicherungsvertrag nur einen rechtlichen Vorteil bringt.","Ja, wenn sie den Beitrag sofort aus ihrem frei verfügbaren Taschengeld bezahlt.","Ja, weil sie mit 17 Jahren für Versicherungsverträge voll geschäftsfähig ist.","Nein, Minderjährige können Verträge nur durch ihre Eltern schließen lassen."],"richtig":[1],"erkl":"Ein Vertrag ist von Anfang an wirksam, wenn der Minderjährige die Leistung mit Taschengeld bewirkt. Ein Versicherungsvertrag bringt wegen der Prämienpflicht nicht nur einen rechtlichen Vorteil.","norm":"§§ 107, 110 BGB","id":"3.2-2-1"},{"typ":"mc","frage":"Welche Angabe ist für die Versicherungsplakette richtig?","optionen":["Sie gilt für ein Verkehrsjahr vom 1. März bis Ende Februar des Folgejahres.","Sie gilt immer genau zwölf Monate ab dem Tag des Kaufs der Plakette.","Sie gilt für ein Kalenderjahr vom 1. Januar bis zum 31. Dezember.","Sie gilt nur in der Saison vom 1. März bis zum 31. Oktober eines jeden Jahres."],"richtig":[0],"erkl":"Versicherungskennzeichen bzw. -plaketten (für E-Scooter) wechseln jährlich zum 1. März die Farbe.","norm":"FZV, eKFV","id":"3.2-2-2"},{"typ":"mc","frage":"Leonie fragt, ob sie den Vertrag widerrufen kann, wenn ihre Eltern dagegen sind. Was ist richtig?","optionen":["Nein, bei Versicherungskennzeichen ist der Widerruf gesetzlich grundsätzlich ausgeschlossen.","Nur mit Zustimmung des Versicherers, weil die Plakette bereits ausgehändigt wurde.","Ja, innerhalb von 30 Tagen ab Zahlung des Beitrags, auch ohne Belehrung in Textform.","Ja, innerhalb von 14 Tagen ab Erhalt aller Vertragsunterlagen und der Belehrung in Textform."],"richtig":[3],"erkl":"Das Widerrufsrecht entfällt nur in gesetzlichen Ausnahmen, z. B. bei Verträgen mit einer Laufzeit von weniger als einem Monat.","norm":"§ 8 VVG","id":"3.2-2-3"}]}]},{"nr":"3.3","titel":"Rechtsgrundlagen bei der Antrags- und Vertragsbearbeitung einhalten","lf":"LF 2","buch":"S. 90–122","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Der Kunde zahlt die erste Prämie nicht. Was gilt für den Versicherer, wenn vor der Zahlung ein Schaden eintritt?","optionen":["Der Vertrag ist rückwirkend nichtig, sodass der Kunde auch keine Prämie mehr schuldet.","Er muss leisten, darf aber die doppelte Erstprämie von der Entschädigung abziehen.","Er ist leistungsfrei, wenn der Kunde die Nichtzahlung zu vertreten hat und darauf hingewiesen wurde.","Er ist erst leistungsfrei, wenn er den Kunden gemahnt und eine Zahlungsfrist von zwei Wochen gesetzt hat."],"richtig":[2],"erkl":"Der Hinweis muss in Textform oder durch auffälligen Hinweis im Versicherungsschein erfolgen. Zusätzlich kann der Versicherer vom Vertrag zurücktreten, solange die Erstprämie nicht gezahlt ist.","norm":"§ 37 VVG","id":"3.3-1-1"},{"typ":"zahl","frage":"Wie viele Wochen muss die Zahlungsfrist bei einer nicht gezahlten Folgeprämie mindestens betragen?","wert":2,"einheit":"Wochen","tol":0,"erkl":"Der Versicherer bestimmt in Textform eine Zahlungsfrist von mindestens zwei Wochen mit Belehrung über die Folgen.","norm":"§ 38 Abs. 1 VVG","id":"3.3-1-2"},{"typ":"wf","frage":"Welche Aussagen zur vorvertraglichen Anzeigepflicht treffen zu?","aussagen":[["Der Kunde muss die ihm bekannten gefahrerheblichen Umstände anzeigen, nach denen der Versicherer in Textform gefragt hat.",true],["Bei vorsätzlicher oder grob fahrlässiger Verletzung kann der Versicherer vom Vertrag zurücktreten.",true],["Bei einfacher Fahrlässigkeit kann der Versicherer kündigen oder den Vertrag anpassen.",true],["Der Kunde muss auch Umstände anzeigen, nach denen nie gefragt wurde, sonst ist der Vertrag nichtig.",false]],"erkl":"Die Rechtsfolgen sind nach dem Verschulden abgestuft; der Versicherer muss sie innerhalb eines Monats nach Kenntnis geltend machen.","norm":"§§ 19, 21 VVG","id":"3.3-1-3"},{"typ":"zuo","frage":"Ordnen Sie dem Verschulden bei einer Obliegenheitsverletzung die Rechtsfolge zu.","paare":[["Vorsatz","Der Versicherer ist leistungsfrei."],["Grobe Fahrlässigkeit","Der Versicherer kann die Leistung entsprechend der Schwere des Verschuldens kürzen."],["Einfache Fahrlässigkeit","Die Leistung bleibt voll erhalten."]],"erkl":"Außer bei Arglist bleibt der Versicherer zur Leistung verpflichtet, wenn die Verletzung weder für den Eintritt noch für den Umfang des Schadens ursächlich war.","norm":"§ 28 Abs. 2 und 3 VVG","id":"3.3-1-4"},{"typ":"mc","frage":"Ein Hausratvertrag läuft fünf Jahre. Wann kann der Kunde ihn nach dem VVG frühestens ordentlich kündigen?","optionen":["Zum Schluss des ersten Versicherungsjahres mit einer Frist von einem Monat.","Zum Schluss des dritten Versicherungsjahres mit einer Frist von drei Monaten.","Zum Ende der fünfjährigen Laufzeit mit einer Frist von drei Monaten.","Zum Schluss des dritten Versicherungsjahres mit einer Frist von einem Monat."],"richtig":[1],"erkl":"Verträge mit einer Laufzeit von mehr als drei Jahren kann der Versicherungsnehmer zum Schluss des dritten oder jedes folgenden Jahres kündigen.","norm":"§ 11 Abs. 4 VVG","id":"3.3-1-5"},{"typ":"mc","frage":"Nach einem Leitungswasserschaden hat der Versicherer gezahlt. Bis wann können beide Vertragspartner den Vertrag kündigen?","optionen":["Innerhalb eines Monats nach Abschluss der Verhandlungen über die Entschädigung.","Innerhalb eines Monats nach dem Schadentag, aber nur durch den Versicherer.","Innerhalb von drei Monaten nach dem Tag, an dem der Schaden eingetreten ist.","Nur zum Ende der laufenden Versicherungsperiode mit einer Frist von drei Monaten."],"richtig":[0],"erkl":"Der Versicherer muss eine Frist von einem Monat einhalten; der Kunde kann sofort oder zum Ende der laufenden Periode kündigen.","norm":"§ 92 VVG","id":"3.3-1-6"},{"typ":"mc","frage":"Ein Kunde lässt in seinem Einfamilienhaus die Einbruchmeldeanlage dauerhaft abschalten, deren Einbau ein Rabattgrund war. Wie nennt man diesen Vorgang?","optionen":["Doppelversicherung","Obliegenheit im Versicherungsfall","Unterversicherung","Gefahrerhöhung"],"richtig":[3],"erkl":"Nach Vertragsschluss darf der Kunde ohne Einwilligung des Versicherers keine Gefahrerhöhung vornehmen; er muss sie anzeigen.","norm":"§§ 23 ff. VVG","id":"3.3-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Albers hat am 3. März eine Hausratversicherung beantragt. Die Police (Versicherungsbeginn 10. März) mit Belehrung und Unterlagen geht ihr am 10. März zu, die Erstprämie wird zum 1. April fällig. Am 25. März wird in ihre Wohnung eingebrochen. Die Prämie hatte sie noch nicht gezahlt.","items":[{"typ":"mc","frage":"Muss der Versicherer für den Einbruch leisten?","optionen":["Nein, denn während der laufenden Widerrufsfrist besteht noch kein Schutz.","Nur anteilig, denn der Versicherungsbeginn liegt vor der Prämienfälligkeit.","Ja, denn die Erstprämie war am Schadentag noch nicht fällig.","Nein, denn ohne gezahlte Erstprämie beginnt der Versicherungsschutz nicht."],"richtig":[2],"erkl":"Leistungsfreiheit setzt voraus, dass die fällige Erstprämie schuldhaft nicht gezahlt wurde. Fällig war sie erst zum 1. April, die Kundin hat die Nichtzahlung am 25. März also nicht zu vertreten.","norm":"§ 37 Abs. 2 VVG","id":"3.3-2-1"},{"typ":"zahl","frage":"An welchem Tag endet die Widerrufsfrist von Frau Albers (Tag im März)?","wert":24,"einheit":". März","tol":0,"erkl":"Fristbeginn mit Zugang am 10. März; 14 Tage → Ende am 24. März (ein Werktag). Der rechtzeitige Versand des Widerrufs genügt.","norm":"§ 8 VVG, §§ 187, 188 BGB","id":"3.3-2-2"},{"typ":"mc","frage":"Frau Albers zahlt im Folgejahr den Beitrag nicht. Nach Ablauf der zweiwöchigen Zahlungsfrist kündigt der Versicherer. Wie kann sie den Vertrag noch retten?","optionen":["Sie zahlt innerhalb von zwei Wochen nach der Kündigung; dann wird die Kündigung unwirksam.","Sie zahlt innerhalb eines Monats nach der Kündigung; dann wird die Kündigung unwirksam.","Sie widerspricht innerhalb eines Monats nach der Kündigung; dann wird die Kündigung unwirksam.","Sie zahlt innerhalb von drei Monaten nach der Kündigung; dann lebt der Vertrag rückwirkend auf."],"richtig":[1],"erkl":"Die Zahlung heilt die Kündigung; für Versicherungsfälle zwischen Fristablauf und Zahlung bleibt der Versicherer leistungsfrei.","norm":"§ 38 Abs. 3 VVG","id":"3.3-2-3"}]}]}]},{"nr":"4","titel":"Wohnen und Wohneigentum absichern","lf":"LF 4","abschnitte":[{"nr":"4.1","titel":"Beratungsanlässe: Hausstandsgründung und veränderte Wohnsituation","lf":"LF 4","buch":"S. 123–124","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Ein Kunde zieht innerhalb Deutschlands um. Was gilt in der Hausratversicherung?","optionen":["Der Schutz geht auf die neue Wohnung über; während des Umzugs gilt er in beiden.","Der Vertrag endet mit dem Umzug; für die neue Wohnung ist ein neuer Antrag nötig.","Der Schutz bleibt in der alten Wohnung, bis der Versicherer der neuen schriftlich zustimmt.","Der Schutz geht erst nach der Anzeige über; bis dahin gilt er nur in der alten Wohnung."],"richtig":[0],"erkl":"Während des Umzugs besteht Schutz in beiden Wohnungen, in der alten längstens zwei Monate nach Umzugsbeginn. Der Umzug ist spätestens bei Beginn des Einzugs anzuzeigen; Wohnfläche und Tarifzone können sich ändern.","norm":"VHB, Wohnungswechsel","id":"4.1-1-1"},{"typ":"wf","frage":"Welche Aussagen zum Umzug ins Ausland treffen zu?","aussagen":[["Der Versicherungsschutz geht bei einem Umzug ins Ausland nicht auf die neue Wohnung über.",true],["Der Versicherungsschutz in der bisherigen Wohnung erlischt spätestens zwei Monate nach Umzugsbeginn.",true],["Der Hausrat ist im Ausland automatisch weiter versichert.",false]],"erkl":"Versicherungsort ist die Wohnung in Deutschland; bei Auslandsumzug endet der Vertrag nach den Bedingungen.","norm":"VHB, Wohnungswechsel","id":"4.1-1-2"},{"typ":"zuo","frage":"Ordnen Sie dem Anlass die wichtigste Prüfung zu.","paare":[["Zwei Haushalte werden zusammengelegt","doppelte Hausratverträge auflösen, Versicherungssumme anpassen"],["Erwerb einer Eigentumswohnung","Gemeinschaftseigentum über die Gemeinschaft, eigene Einbauten prüfen"],["Bau eines Einfamilienhauses","Bauherrenhaftpflicht, Bauleistung, Feuer-Rohbau, später Wohngebäude"]],"erkl":"Jeder Anlass verändert Risiko und Bedarf.","norm":"Bedarfsanalyse","id":"4.1-1-3"},{"typ":"mc","frage":"Eine Kundin zieht von ihrem Haus in ein Pflegeheim und nimmt nur einen Teil ihrer Möbel mit. Was gilt für die Hausratversicherung?","optionen":["Der Vertrag endet mit dem Auszug, weil Hausrat in einem Pflegeheim nicht versicherbar ist.","Der Hausrat im Heim ist als Außenversicherung zeitlich unbegrenzt und voll mitversichert.","Der Hausrat im Heim ist automatisch über die Gebäudeversicherung des Heimträgers versichert.","Der Hausrat im Heim kann je nach Tarif begrenzt versichert sein; der Vertrag ist anzupassen."],"richtig":[3],"erkl":"Viele Bedingungen enthalten Regelungen für den Umzug in ein Heim; Versicherungssumme und Ort sind anzupassen.","norm":"VHB, Wohnungswechsel","id":"4.1-1-4"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Jonas Becker (24) zieht nach seiner Ausbildung aus dem Elternhaus aus in seine erste eigene Mietwohnung (55 m²). Er fragt, ob er über die Verträge seiner Eltern weiter versichert ist.","items":[{"typ":"mc","frage":"Ist Jonas noch über die Privathaftpflicht seiner Eltern versichert?","optionen":["Ja, bis zum Ende des ersten Mietjahres in der neuen Wohnung.","Ja, solange er noch unter der Anschrift seiner Eltern gemeldet ist.","In der Regel nicht mehr, weil die Mitversicherung meist mit der ersten Ausbildung endet.","Ja, weil unverheiratete Kinder bis zum 25. Lebensjahr in jedem Fall mitversichert sind."],"richtig":[2],"erkl":"Unverheiratete Kinder sind in der Familien-Privathaftpflicht meist bis zum Ende der ersten Ausbildung mitversichert; manche Tarife sehen eine begrenzte Nachversicherung vor. Jonas braucht daher eine eigene Privathaftpflicht.","norm":"BBR PHV","id":"4.1-2-1"},{"typ":"zahl","frage":"Für den Unterversicherungsverzicht verlangt der Versicherer eine Versicherungssumme von 650 € je m² Wohnfläche. Wie hoch muss die Summe für Jonas mindestens sein?","wert":35750,"einheit":"€","tol":0,"erkl":"55 m² × 650 €/m² = 35.750 €.","norm":"VHB, Unterversicherungsverzicht","id":"4.1-2-2"},{"typ":"mc","frage":"Jonas fragt, ob sein Fahrrad, das er im Hausflur abschließt, gegen Diebstahl versichert ist. Was ist richtig?","optionen":["Der Diebstahl ist versichert, wenn das Fahrrad abgeschlossen war, auch ohne Zusatzklausel.","Diebstahl ohne Einbruch ist nur versichert, wenn die Fahrraddiebstahl-Klausel vereinbart ist.","Fahrräder sind nur versichert, wenn sie in der Wohnung selbst abgestellt werden.","Fahrräder sind in jeder Hausratversicherung auch gegen einfachen Diebstahl versichert."],"richtig":[1],"erkl":"Einfacher Diebstahl aus dem Hausflur ist kein Einbruchdiebstahl; dafür gibt es eine Zusatzvereinbarung.","norm":"VHB, Klausel Fahrraddiebstahl","id":"4.1-2-3"}]}]},{"nr":"4.2","titel":"Individuelle Bedarfe analysieren, Risikoprävention und -absicherung","lf":"LF 4","buch":"S. 125–140","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"wf","frage":"Welche Gefahren sind in der Hausratversicherung nach den Musterbedingungen versichert?","aussagen":[["Brand, Blitzschlag, Explosion",true],["Einbruchdiebstahl, Raub und Vandalismus nach einem Einbruch",true],["Leitungswasser, Sturm und Hagel",true],["Überschwemmung durch Starkregen ohne besondere Vereinbarung",false]],"erkl":"Weitere Naturgefahren (Elementar) müssen gesondert eingeschlossen werden.","norm":"VHB","id":"4.2-1-1"},{"typ":"zahl","frage":"Ab welcher Windstärke liegt ein Sturm im Sinne der Bedingungen vor?","wert":8,"einheit":"Beaufort","tol":0,"erkl":"Sturm ist eine wetterbedingte Luftbewegung von mindestens Windstärke 8.","norm":"VHB/VGB, Sturm","id":"4.2-1-2"},{"typ":"zuo","frage":"Ordnen Sie der Präventionsmaßnahme das Risiko zu, das sie mindert.","paare":[["Rückstauklappe im Abwasserrohr","Rückstau bei Starkregen"],["Rauchmelder","Personenschäden und Ausbreitung von Bränden"],["einbruchhemmende Fenster und Türen","Einbruchdiebstahl"],["Wasserleitungen im Winter entleeren","Frostschäden an Rohren"]],"erkl":"Prävention verringert Schäden und kann sich auf die Prämie auswirken; manche Maßnahmen sind vertragliche Sicherheitsvorschriften.","norm":"VGB/VHB, Sicherheitsvorschriften","id":"4.2-1-3"},{"typ":"mc","frage":"Wann liegt ein Einbruchdiebstahl im Sinne der Bedingungen vor?","optionen":["Der Dieb bricht die Wohnungstür auf, dringt ein und stiehlt Sachen.","Ein Gast nimmt bei einem Besuch heimlich eine wertvolle Uhr mit.","Einer Kundin wird im Café die Handtasche vom Stuhl gestohlen.","Ein Dieb nimmt ein unverschlossenes Fahrrad vom offenen Hinterhof mit."],"richtig":[0],"erkl":"Kennzeichnend ist das Eindringen in einen Raum eines Gebäudes, z. B. durch Einbrechen, Einsteigen oder mit falschen Schlüsseln.","norm":"VHB, Einbruchdiebstahl","id":"4.2-1-4"},{"typ":"mc","frage":"Welcher Schaden ist in der Hausratversicherung über die Gefahr Leitungswasser versichert?","optionen":["Regenwasser läuft durch ein offen gelassenes Fenster ins Wohnzimmer.","Beim Blumengießen kippt ein Eimer Wasser um und durchnässt den Teppich.","Nach starkem Regen dringt Grundwasser durch die Kellerwand in den Keller ein.","Aus einem geplatzten Waschmaschinenschlauch tritt Wasser aus und beschädigt Möbel."],"richtig":[3],"erkl":"Leitungswasser ist bestimmungswidrig ausgetretenes Wasser aus Rohren und angeschlossenen Einrichtungen.","norm":"VHB, Leitungswasser","id":"4.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Familie Yilmaz wohnt in einem gemieteten Reihenhaus in Flussnähe. Im letzten Sommer lief nach einem Starkregen Wasser über die Kellertreppe in den Keller, in dem Möbel und eine Gefriertruhe standen. Die Hausratversicherung hat nicht gezahlt.","items":[{"typ":"mc","frage":"Warum hat die Hausratversicherung vermutlich nicht gezahlt?","optionen":["Wasser, das über die Kellertreppe eindringt, gilt immer als grob fahrlässig herbeigeführter Schaden.","Möbel und Gefriertruhen im Keller gehören grundsätzlich nicht zum versicherten Hausrat der Familie.","Überschwemmung durch Starkregen ist eine weitere Naturgefahr, die gesondert vereinbart sein muss.","Mieter eines Reihenhauses können eine Hausratversicherung nur über ihren Vermieter abschließen."],"richtig":[2],"erkl":"Leitungswasser deckt keinen Starkregen von außen.","norm":"VHB, weitere Naturgefahren","id":"4.2-2-1"},{"typ":"wf","frage":"Was empfehlen Sie der Familie?","aussagen":[["Einschluss der weiteren Naturgefahren in die Hausratversicherung prüfen",true],["hochwertige Sachen nicht im Keller lagern",true],["den Vermieter auf einen Schutz am Kellerabgang (Schwelle, Abdeckung) ansprechen",true],["die Hausratversicherung kündigen, weil sie nichts bringt",false]],"erkl":"Absicherung und Prävention ergänzen sich; Vorschäden können den Einschluss erschweren.","norm":"Beratung","id":"4.2-2-2"},{"typ":"mc","frage":"Wer versichert das Reihenhaus selbst gegen Elementarschäden?","optionen":["Die Gemeinde, weil sie für den Hochwasserschutz zuständig ist.","Der Vermieter über die Wohngebäudeversicherung mit Elementarschutz.","Die Familie Yilmaz über ihre eigene Hausratversicherung.","Der Vermieter über seine Haus- und Grundbesitzerhaftpflicht."],"richtig":[1],"erkl":"Gebäude und Gebäudebestandteile versichert der Eigentümer; der Mieter versichert seinen Hausrat.","norm":"VGB","id":"4.2-2-3"}]}]},{"nr":"4.3","titel":"Lösungsmöglichkeiten durch private Versicherungen aufzeigen","lf":"LF 4","buch":"S. 141–179","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zahl","frage":"Versicherungssumme 40.000 €, Versicherungswert 50.000 €, Schaden 10.000 €, kein Unterversicherungsverzicht. Wie hoch ist die Entschädigung?","wert":8000,"einheit":"€","tol":0,"erkl":"10.000 € × 40.000 € / 50.000 € = 8.000 € (Proportionalregel).","norm":"§ 75 VVG, VHB","id":"4.3-1-1"},{"typ":"mc","frage":"Was versteht man unter der Außenversicherung in der Hausratversicherung?","optionen":["Hausrat, der sich vorübergehend außerhalb der Wohnung befindet, ist begrenzt mitversichert.","Alle Sachen auf Balkon und Terrasse sind ohne jede Entschädigungsgrenze mitversichert.","Hausrat ist weltweit dauerhaft und ohne Begrenzung der Entschädigung versichert.","Nebengebäude wie Garagen und Gartenhäuser sind als Gebäude mitversichert."],"richtig":[0],"erkl":"Vorübergehend heißt: höchstens drei Monate. Die Entschädigung ist meist auf einen Prozentsatz der Versicherungssumme begrenzt; Einbruchdiebstahl setzt ein Gebäude voraus.","norm":"VHB, Außenversicherung","id":"4.3-1-2"},{"typ":"zuo","frage":"Ordnen Sie die Begriffe der Wohngebäudeversicherung zu.","paare":[["Versicherungssumme 1914","Wert des Gebäudes in Preisen des Jahres 1914 als Rechengrundlage"],["Gleitender Neuwertfaktor","passt die Prämie jährlich an die Entwicklung von Baupreisen und Tariflöhnen an"],["Gleitende Neuwertversicherung","ersetzt den ortsüblichen Neubauwert zum Schadenzeitpunkt"]],"erkl":"Bei korrekt ermittelter Summe 1914 verzichtet der Versicherer auf den Einwand der Unterversicherung.","norm":"VGB, Versicherungswert","id":"4.3-1-3"},{"typ":"wf","frage":"Was gehört nach den Musterbedingungen zum versicherten Hausrat?","aussagen":[["Möbel, Kleidung, Bücher und Haushaltsgeräte",true],["vom Mieter auf eigene Kosten eingebaute Einbauküche",true],["das Auto in der Garage",false],["Bargeld und Schmuck mit Entschädigungsgrenzen",true]],"erkl":"Kraftfahrzeuge sind kein Hausrat (Ausnahmen z. B. Krankenfahrstühle, Rasenmäher); Wertsachen sind begrenzt.","norm":"VHB, versicherte Sachen","id":"4.3-1-4"},{"typ":"mc","frage":"Was ist in der Wohngebäudeversicherung, anders als in der Hausratversicherung, typischerweise versichert?","optionen":["Schäden an Kleidung durch Leitungswasser aus einem Rohrbruch.","Einbruchdiebstahl von Schmuck und Bargeld aus dem Wohnhaus.","Die Möbel und elektrischen Geräte des Mieters im Gebäude.","Frost- und Bruchschäden an Rohren der Wasserversorgung im Gebäude."],"richtig":[3],"erkl":"Rohrbruch und Frostschäden an Rohren gehören zur Gefahr Leitungswasser in der Wohngebäudeversicherung.","norm":"VGB, Leitungswasser","id":"4.3-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr und Frau Hartmann haben ein Einfamilienhaus mit Photovoltaikanlage auf dem Dach, eine Holzgartenhütte und einen Gartenteich. Im Wohnzimmer steht ein wertvolles Klavier, im Schlafzimmer ein Tresor mit Schmuck.","items":[{"typ":"zuo","frage":"Ordnen Sie jede Sache dem passenden Vertrag zu.","paare":[["Photovoltaikanlage auf dem Dach","Wohngebäudeversicherung (oft nur mit Einschluss) oder eigene Photovoltaikversicherung"],["Klavier","Hausratversicherung"],["Schmuck im Tresor","Hausratversicherung mit Entschädigungsgrenzen für Wertsachen"],["fest errichtete Gartenhütte","Wohngebäudeversicherung, wenn sie als Nebengebäude mitversichert ist"]],"erkl":"Gebäude und fest verbundene Sachen gehören in die Wohngebäudeversicherung, bewegliche Sachen in die Hausratversicherung.","norm":"VGB/VHB","id":"4.3-2-1"},{"typ":"mc","frage":"Warum sollte die Versicherungssumme für den Schmuck genau geprüft werden?","optionen":["Schmuck ist in der Hausratversicherung grundsätzlich nicht versichert.","Für Schmuck zahlt der Versicherer nur bei Brand, nicht aber bei einem Einbruch.","Für Wertsachen gelten Entschädigungsgrenzen je nach Art der Aufbewahrung.","Schmuck wird immer zum Neuwert und ohne jede Höchstgrenze ersetzt."],"richtig":[2],"erkl":"Liegen Wertsachen außerhalb eines anerkannten Wertschutzschranks, sinkt die Entschädigungsgrenze deutlich.","norm":"VHB, Wertsachen","id":"4.3-2-2"},{"typ":"mc","frage":"Der Kunde fragt, ob ein Rasensprenger-Schlauch, der im Garten platzt und den Rasen flutet, über Leitungswasser versichert ist. Was ist richtig?","optionen":["Ja, wenn der Schaden am Rasen mehr als 1.000 € beträgt.","Nein, der Rasen gehört als Grund und Boden nicht zu den versicherten Sachen.","Ja, jeder Wasseraustritt auf dem versicherten Grundstück ist versichert.","Ja, aber nur, wenn der Schlauch durch Frost geplatzt ist."],"richtig":[1],"erkl":"Ersetzt werden nur Schäden an versicherten Sachen; Grund und Boden, also auch der Rasen, gehört nicht dazu.","norm":"VGB, Leitungswasser","id":"4.3-2-3"}]}]},{"nr":"4.4","titel":"Kundengerechte Angebote erstellen, Rechtsstreitigkeiten und Ansprüche Dritter, Vertragsschluss","lf":"LF 4 / LF 5","buch":"S. 180–227","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zahl","frage":"Versicherungssumme 1914: 22.000 Mark, gleitender Neuwertfaktor 24,9, Prämiensatz 1,5 ‰ (Promille). Wie hoch ist die Jahresprämie ohne Versicherungsteuer?","wert":821.7,"einheit":"€","tol":0.01,"erkl":"22.000 × 1,5 ‰ = 33 € (Grundbeitrag 1914) × 24,9 = 821,70 €.","norm":"VGB, Prämienberechnung","id":"4.4-1-1"},{"typ":"mc","frage":"Eine Kundin vermietet eine Wohnung in einem Zweifamilienhaus, die andere bewohnt sie selbst. Welche Haftpflichtversicherung braucht sie für die Vermietung?","optionen":["Eine Haus- und Grundbesitzerhaftpflicht, falls die Privathaftpflicht die Vermietung nicht deckt.","Keine, weil die Mieter für alle Schäden auf dem Grundstück selbst haften.","Eine Rechtsschutzversicherung, weil sie die Haftpflichtansprüche der Mieter vollständig bezahlt.","Eine Gewässerschadenhaftpflicht, weil sie das gesamte Vermietungsrisiko vollständig abdeckt."],"richtig":[0],"erkl":"Viele Privathaftpflicht-Tarife schließen die vermietete Wohnung im selbst bewohnten Zweifamilienhaus ein; deckt der Tarif sie nicht, ist eine Haus- und Grundbesitzerhaftpflicht nötig.","norm":"BBR PHV, Haus- und Grundbesitzerhaftpflicht","id":"4.4-1-2"},{"typ":"wf","frage":"Welche Aussagen zur Rechtsschutzversicherung für Wohnungs- und Grundstückseigentum treffen zu?","aussagen":[["Sie hilft z. B. bei Streit mit dem Mieter über Mietzahlungen.",true],["Für sie gilt in der Regel eine Wartezeit von drei Monaten.",true],["Streitigkeiten rund um den Bau eines Hauses sind meist ausgeschlossen.",true],["Sie ersetzt Schäden, die der Kunde Dritten zufügt.",false]],"erkl":"Rechtsschutz trägt Kosten der Rechtsverfolgung; Schadenersatzansprüche Dritter gehören in die Haftpflicht.","norm":"ARB","id":"4.4-1-3"},{"typ":"mc","frage":"Wie verhält sich die Kundin richtig, wenn sie einen Heizöltank im Keller ihres Hauses hat?","optionen":["Sie meldet den Tank ihrem Wohngebäudeversicherer, der dann die Haftung übernimmt.","Sie schließt eine Glasversicherung ab, weil diese auch Schäden am Tank deckt.","Sie braucht nichts, weil Ölschäden immer gesetzlich über die Gemeinde gedeckt sind.","Sie prüft eine Gewässerschadenhaftpflicht für ihren Heizöltank (Anlagenrisiko)."],"richtig":[3],"erkl":"Für Anlagen, die Gewässer verunreinigen können, haftet der Betreiber verschuldensunabhängig.","norm":"§ 89 WHG","id":"4.4-1-4"},{"typ":"mc","frage":"Ein Kunde unterschreibt den Antrag für eine Wohngebäudeversicherung. Was ist der nächste Schritt bis zum Vertragsschluss?","optionen":["Der Vertrag ist bereits mit der Unterschrift des Kunden auf dem Antrag geschlossen.","Der Kunde muss den Antrag nach Ablauf von 14 Tagen erneut unterschreiben.","Der Versicherer prüft den Antrag und nimmt ihn durch Übersendung der Police an.","Der Vertrag muss vom Vermittler notariell beurkundet werden, um wirksam zu sein."],"richtig":[2],"erkl":"Beim Antragsmodell kommt der Vertrag mit Zugang der Annahme (Police) zustande; der Kunde ist bis dahin an seinen Antrag gebunden.","norm":"§§ 145 ff. BGB","id":"4.4-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Lorenz bittet um ein Angebot für die Hausratversicherung seiner neuen 80-m²-Wohnung in Tarifzone 3. Der Tarif kostet 1,20 € je 1.000 € Versicherungssumme im Jahr (inkl. Versicherungsteuer), der Versicherer verlangt 650 € je m² für den Unterversicherungsverzicht.","items":[{"typ":"zahl","frage":"Wie hoch ist die Mindestversicherungssumme für den Unterversicherungsverzicht?","wert":52000,"einheit":"€","tol":0,"erkl":"80 m² × 650 € = 52.000 €.","norm":"VHB, Unterversicherungsverzicht","id":"4.4-2-1"},{"typ":"zahl","frage":"Wie hoch ist die Jahresprämie für diese Versicherungssumme?","wert":62.4,"einheit":"€","tol":0.01,"erkl":"52.000 € / 1.000 × 1,20 € = 62,40 €.","norm":"Tarif","id":"4.4-2-2"},{"typ":"mc","frage":"Herr Lorenz möchte die Prämie monatlich zahlen. Was müssen Sie ihm erklären?","optionen":["Bei monatlicher Zahlung entfällt der Unterversicherungsverzicht.","Bei unterjähriger Zahlung kann ein Ratenzuschlag anfallen.","Bei monatlicher Zahlung sinkt die Jahresprämie um ein Skonto.","Bei monatlicher Zahlung muss er eine Selbstbeteiligung vereinbaren."],"richtig":[1],"erkl":"Viele Tarife berechnen für halb-, viertel- oder monatliche Zahlung Zuschläge.","norm":"Tarif","id":"4.4-2-3"}]}]},{"nr":"4.5","titel":"Ergänzende Serviceleistungen aufzeigen","lf":"LF 4","buch":"S. 228–230","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"wf","frage":"Welche Leistungen werden häufig als Assistance- oder Serviceleistung zur Hausrat- oder Wohngebäudeversicherung angeboten?","aussagen":[["Vermittlung eines Schlüsseldienstes bei ausgesperrter Tür",true],["Vermittlung von Handwerkern nach einem Schaden",true],["Rohrreinigung bei Verstopfung, je nach Tarif",true],["Übernahme aller Handwerkerrechnungen ohne Schaden und ohne Höchstbetrag",false]],"erkl":"Serviceleistungen sind meist Organisations- und Vermittlungsleistungen, teils mit Kostenübernahme bis zu Grenzen.","norm":"Tarifbedingungen","id":"4.5-1-1"},{"typ":"mc","frage":"Welcher Nutzen steht bei Smart-Home-Bausteinen (z. B. Wassermelder mit Absperrventil) für Kunde und Versicherer im Vordergrund?","optionen":["Schäden früh erkennen und begrenzen.","Die Prämie automatisch erhöhen.","Verträge leichter kündigen können.","Kundendaten für Werbung auswerten."],"richtig":[0],"erkl":"Prävention senkt Schadenhöhe und -häufigkeit.","norm":"Prävention","id":"4.5-1-2"},{"typ":"mc","frage":"Nach einem Brand ist die Wohnung eines Kunden unbewohnbar. Welche Kosten übernimmt die Hausratversicherung in der Regel?","optionen":["Die Mehrkosten einer dauerhaft teureren Ersatzwohnung.","Die Miete für eine neue Wohnung für die Dauer von zehn Jahren.","Keine Kosten, ersetzt werden nur die beschädigten Sachen.","Hotelkosten für eine begrenzte Zeit und bis zu einem Höchstbetrag."],"richtig":[3],"erkl":"Versicherte Kosten sind u. a. Hotel-, Transport- und Lagerkosten.","norm":"VHB, versicherte Kosten","id":"4.5-1-3"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Demir ruft an einem Sonntagabend in der Agentur-Hotline an: Im Badezimmer läuft Wasser aus einem Anschluss, sie bekommt den Haupthahn nicht zu. Ihr Vertrag enthält einen Assistance-Baustein.","items":[{"typ":"mc","frage":"Welche Maßnahme hat für Frau Demir sofort Vorrang?","optionen":["Bis Montag warten und den Schaden dann in der Agentur persönlich melden.","Zuerst den Schaden fotografieren und erst danach das Wasser abstellen lassen.","Den Schaden mindern, z. B. das Wasser abstellen lassen und die Assistance anrufen.","Den Schaden schriftlich beim Versicherer melden und dessen Freigabe abwarten."],"richtig":[2],"erkl":"Der Versicherungsnehmer muss den Schaden abwenden und mindern; Kosten dafür ersetzt der Versicherer.","norm":"§§ 82, 83 VVG","id":"4.5-2-1"},{"typ":"mc","frage":"Wer trägt die Kosten für den Notdienst, der den Schaden begrenzt?","optionen":["Frau Demir allein, weil Notdienstkosten vom Versicherer nie übernommen werden.","Der Versicherer, weil er Aufwendungen zur Abwendung und Minderung ersetzt.","Der Versicherer, aber nur, wenn die Maßnahme den Schaden tatsächlich verhindert hat.","Der Notdienst selbst, wenn der Schaden trotz seines Einsatzes eintritt."],"richtig":[1],"erkl":"Rettungskosten werden ersetzt, auch wenn die Maßnahme erfolglos bleibt, soweit die Kundin sie den Umständen nach für geboten halten durfte.","norm":"§ 83 VVG","id":"4.5-2-2"}]}]},{"nr":"4.6","titel":"Versicherungsrelevante rechtliche Regelungen rund ums Wohnen","lf":"LF 4","buch":"S. 231–233","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Ein versichertes Haus wird verkauft. Was geschieht mit der Wohngebäudeversicherung?","optionen":["Der Erwerber tritt mit dem Eigentumsübergang in den Vertrag ein.","Der Verkäufer bleibt bis zum Vertragsende allein Versicherungsnehmer.","Der Vertrag endet automatisch mit Abschluss des Kaufvertrags.","Der Vertrag ruht, bis der Erwerber einen eigenen Antrag stellt."],"richtig":[0],"erkl":"Mit dem Eigentumsübergang (Grundbucheintrag) tritt der Erwerber anstelle des Veräußerers in den Vertrag ein. Für die laufende Versicherungsperiode haften Veräußerer und Erwerber gesamtschuldnerisch für die Prämie.","norm":"§ 95 VVG","id":"4.6-1-1"},{"typ":"zuo","frage":"Wer darf nach der Veräußerung wie kündigen?","paare":[["Erwerber","mit sofortiger Wirkung oder zum Schluss der laufenden Periode, innerhalb eines Monats nach Erwerb bzw. Kenntnis"],["Versicherer","mit einer Frist von einem Monat, innerhalb eines Monats nach Kenntnis"],["Veräußerer","hat nach dem Verkauf kein Kündigungsrecht mehr aus dem übergegangenen Vertrag"]],"erkl":"Die Kündigungsrechte stehen dem Erwerber und dem Versicherer zu.","norm":"§ 96 VVG","id":"4.6-1-2"},{"typ":"wf","frage":"Welche Aussagen zur Haftung von Mietern treffen zu?","aussagen":[["Beschädigt ein Mieter grob fahrlässig das Mietobjekt, kann der Vermieter Schadenersatz verlangen.",true],["Schäden an der gemieteten Wohnung sind in vielen Privathaftpflichttarifen als Mietsachschäden eingeschlossen.",true],["Abnutzung durch normalen Gebrauch muss der Mieter ersetzen.",false],["Der Wohngebäudeversicherer kann den Mieter bei leichter Fahrlässigkeit in der Regel nicht in Regress nehmen.",true]],"erkl":"Normale Abnutzung ist durch die Miete abgegolten; der Regress des Gebäudeversicherers gegen Mieter ist nach der Rechtsprechung auf Vorsatz und grobe Fahrlässigkeit beschränkt.","norm":"§ 538 BGB, § 86 VVG","id":"4.6-1-3"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Kraus hat sein Einfamilienhaus zum 1. Mai verkauft (Eigentumsumschreibung im Grundbuch). Die Wohngebäudeversicherung hat eine Versicherungsperiode vom 1. Januar bis 31. Dezember. Die Käuferin, Frau Neumann, möchte einen eigenen Vertrag bei ihrem Hausversicherer.","items":[{"typ":"mc","frage":"Was gilt für den bisherigen Vertrag ab dem 1. Mai?","optionen":["Der Vertrag endet zum 1. Mai automatisch, ohne dass jemand kündigen muss.","Frau Neumann tritt in den Vertrag ein, kann ihn aber erst zum Ende der Periode kündigen.","Herr Kraus bleibt Versicherungsnehmer und muss bis Jahresende weiterzahlen.","Frau Neumann tritt in den Vertrag ein und kann ihn binnen eines Monats nach Erwerb kündigen."],"richtig":[3],"erkl":"Der Vertrag geht mit dem Eigentum über; danach kann der Erwerber kündigen.","norm":"§§ 95, 96 VVG","id":"4.6-2-1"},{"typ":"mc","frage":"Frau Neumann kündigt den übergegangenen Vertrag fristgerecht. Wer schuldet die Prämie für die laufende Periode?","optionen":["Herr Kraus und Frau Neumann als Gesamtschuldner.","Beide je zur Hälfte.","Nur Herr Kraus.","Nur Frau Neumann."],"richtig":[2],"erkl":"Kündigt der Erwerber, ist er zur Zahlung der Prämie nicht verpflichtet; sie schuldet allein der Veräußerer. Ohne Kündigung hafteten beide als Gesamtschuldner (§ 95 Abs. 2 VVG).","norm":"§ 96 Abs. 3 VVG","id":"4.6-2-2"},{"typ":"mc","frage":"Was ist dem Versicherer mitzuteilen?","optionen":["Die Veräußerung ist ihm binnen drei Monaten anzuzeigen.","Die Veräußerung ist ihm unverzüglich anzuzeigen.","Nichts, weil ihm der Grundbucheintrag automatisch mitgeteilt wird.","Nur die neue Bankverbindung für den Lastschrifteinzug."],"richtig":[1],"erkl":"Unterbleibt die Anzeige, kann der Versicherer unter Umständen leistungsfrei sein.","norm":"§ 97 Abs. 1 VVG","id":"4.6-2-3"}]}]}]},{"nr":"5","titel":"Berufsausübung und Freizeitgestaltung absichern","lf":"LF 5","abschnitte":[{"nr":"5.1","titel":"Beratungsanlässe in Beruf und Freizeit","lf":"LF 5","buch":"S. 234","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie dem Anlass die passende Absicherung zu.","paare":[["Kauf eines Hundes","Tierhalterhaftpflichtversicherung (Hundehalter)"],["Kauf eines eigenen Reitpferdes","Tierhalterhaftpflichtversicherung (Pferdehalter)"],["private Drohne","Haftpflichtversicherung für Drohnen (gesetzliche Versicherungspflicht)"],["Ehrenamt als Trainer im Sportverein","Prüfung der Vereins- bzw. Privathaftpflicht"]],"erkl":"Hunde- und Pferdehalter sind in der normalen Privathaftpflicht nicht versichert; für Drohnen besteht eine Versicherungspflicht.","norm":"§ 833 BGB, § 43 LuftVG","id":"5.1-1-1"},{"typ":"mc","frage":"Welche Haustiere sind in der Privathaftpflicht in der Regel ohne Weiteres mitversichert?","optionen":["Zahme Haustiere wie Katzen oder Kaninchen","Eigene Pferde, die nur gelegentlich geritten werden","Wellensittiche nur, wenn sie in einer Voliere leben","Hunde, sofern sie nicht als gefährlich gelten"],"richtig":[0],"erkl":"Für Hunde und Pferde wird eine eigene Tierhalterhaftpflicht benötigt.","norm":"BBR PHV","id":"5.1-1-2"},{"typ":"wf","frage":"Welche Aussagen zu Beratungsanlässen treffen zu?","aussagen":[["Der Beginn einer Ausbildung kann die Frage nach der eigenen Haftpflichtversicherung auslösen.",true],["Ein neues Hobby wie Segeln kann zusätzliche Haftpflichtrisiken bringen.",true],["Ein Wechsel des Arbeitgebers hat nie Auswirkungen auf Versicherungen.",false],["Bei Streit mit dem Arbeitgeber hilft eine Rechtsschutzversicherung mit Arbeits-Rechtsschutz.",true]],"erkl":"Beruf und Freizeit verändern Haftungs- und Rechtsschutzrisiken.","norm":"Bedarfsanalyse","id":"5.1-1-3"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Wagner ruft an: Er hat sich einen jungen Labrador gekauft, spielt seit Kurzem Fußball im Verein und fliegt am Wochenende mit einer kleinen Kameradrohne über den Feldern. Er hat bei Ihnen eine Privathaftpflichtversicherung.","items":[{"typ":"mc","frage":"Ist der Hund über seine Privathaftpflicht versichert?","optionen":["Ja, aber nur für Schäden innerhalb der eigenen Wohnung.","Ja, solange der Hund jünger als ein Jahr ist.","Ja, weil alle Haustiere in der Privathaftpflicht mitversichert sind.","Nein, er braucht eine eigene Hundehalterhaftpflichtversicherung."],"richtig":[3],"erkl":"Hundehalter haften als Halter eines Luxustieres verschuldensunabhängig; die PHV schließt Hunde regelmäßig aus.","norm":"§ 833 S. 1 BGB","id":"5.1-2-1"},{"typ":"mc","frage":"Wie ist die Drohne zu beurteilen?","optionen":["Für Drohnen besteht keine Versicherungspflicht, solange sie nur über freie Felder fliegen.","Drohnen sind immer über die Kfz-Haftpflichtversicherung des Halters automatisch mitversichert.","Für Drohnen besteht Versicherungspflicht; ob die Privathaftpflicht sie deckt, ist zu prüfen.","Drohnen sind über die Hausratversicherung gegen Haftpflichtschäden gedeckt."],"richtig":[2],"erkl":"Halter von Luftfahrzeugen, auch unbemannten, müssen eine Haftpflichtversicherung haben.","norm":"§ 43 LuftVG","id":"5.1-2-2"},{"typ":"mc","frage":"Herr Wagner verletzt beim Fußball einen Gegenspieler durch ein normales Foul. Was gilt?","optionen":["Der Verein haftet automatisch und zahlt dem Gegenspieler das Schmerzensgeld.","Bei sportüblichem Verhalten haftet er meist nicht; die Privathaftpflicht wehrt Ansprüche ab.","Er haftet voll, aber die Privathaftpflicht schließt Schäden beim Vereinssport grundsätzlich aus.","Er haftet für jede Verletzung voll, auch bei regelgerechtem Spiel im sportlichen Wettkampf."],"richtig":[1],"erkl":"Wer an einem Kampfspiel teilnimmt, nimmt regelgerechte Verletzungen in Kauf; die PHV übernimmt auch den passiven Rechtsschutz.","norm":"§ 823 BGB, AHB/BBR PHV","id":"5.1-2-3"}]}]},{"nr":"5.2","titel":"Haftungsansprüche analysieren und eigene Ansprüche durchsetzen","lf":"LF 5","buch
