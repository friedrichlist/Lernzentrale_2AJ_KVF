Check in drei Merkmalen: Halter + Fahrzeug nach § 1a PflVG + Standort im Inland (Merkkasten TE 2)."},{"id":"t2-03","typ":"stufen","titel":"Rechenfall Mindestdeckung","akte":"Schadenakte","fall":"Ein Kunde hat nur die gesetzliche Mindestdeckung. Bei einem Unfall werden drei Personen verletzt. Der Personenschaden beträgt zusammen 9.600.000 €, dazu kommt ein Sachschaden von 25.000 €.","schritte":[{"typ":"zahl","frage":"Wie viel zahlt der Versicherer für die Personenschäden?","einheit":"€","loesung":7500000,"weg":"Mindestsumme je Schadensfall für alle Verletzten zusammen: höchstens 7.500.000 € (Anlage zu § 4 Abs. 2 PflVG)."},{"typ":"zahl","frage":"Wie viel zahlt er insgesamt?","einheit":"€","loesung":7525000,"weg":"7.500.000 € + 25.000 € Sachschaden (unter 1.300.000 €) = 7.525.000 €."},{"typ":"zahl","frage":"Welchen Betrag muss der Kunde selbst tragen?","einheit":"€","loesung":2100000,"weg":"9.600.000 € − 7.500.000 € = 2.100.000 € (Ziff. A.1.3.3 AKB)."}],"erkl":"„Je Schadensfall“ heißt: Alle Verletzten eines Unfalls teilen sich die 7.500.000 €. Was die Summe übersteigt, trägt der Kunde selbst (Ziff. A.1.3.3 AKB)."},{"id":"t2-04","typ":"mc","titel":"100 Mio. € pauschal","akte":"Kundengespräch","fall":"Sabine liest im Antrag „100 Mio. € pauschal“ und sagt: „Dann ist jeder Verletzte bis 100 Mio. € gedeckt.“","frage":"Was gilt nach dem Antrag zur Kraftfahrtversicherung in Proximus 5?","optionen":["Innerhalb der 100 Mio. € gilt eine Grenze von höchstens 8 Mio. € je verletzter oder getöteter Person.","Jede verletzte Person ist bis 100 Mio. € gedeckt.","Die 100 Mio. € gelten nur für Sachschäden.","Die 100 Mio. € gelten je Person, die 8 Mio. € je Unfall."],"richtig":0,"erkl":"Antrag Kraftfahrt, Deckungsumfang Haftpflicht: 100 Mio. € pauschal für Personen-, Sach- und Vermögensschäden, höchstens 8 Mio. € je getöteter oder verletzter Person."},{"id":"t2-05","typ":"mc","titel":"Verdienstausfall","frage":"Ein Unfallopfer kann drei Monate nicht arbeiten. Zu welcher Schadenart gehört sein Verdienstausfall?","optionen":["zum Personenschaden","zu den reinen Vermögensschäden (50.000 €)","zum Sachschaden","zu keiner; er ist nicht versichert"],"richtig":0,"warum":[null,"Ein reiner Vermögensschaden hängt weder an einem Personen- noch an einem Sachschaden. Der Verdienstausfall folgt aber aus der Verletzung.","Sachschaden ist ein Schaden an einer Sache.","Der Verdienstausfall ist als Teil des Personenschadens gedeckt."],"erkl":"Der Verdienstausfall folgt aus der Verletzung und gehört zum Personenschaden, nicht zu den 50.000 € für reine Vermögensschäden (Anlage zu § 4 Abs. 2 Nr. 1 c PflVG; Ziff. A.1.1.1 c AKB)."},{"id":"t2-06","typ":"mc","titel":"Was ist kein Gebrauch?","frage":"Welche Situation ist kein Gebrauch des Fahrzeugs im Sinne des § 1a Abs. 3 PflVG?","optionen":["Ein seit Jahren außer Betrieb gesetztes Auto lagert in einer Scheune.","Luca steigt auf dem Supermarktparkplatz aus.","Hendrik belädt vor dem Haus den Kofferraum.","Das Auto steht abgestellt auf dem eigenen Hof."],"richtig":0,"erkl":"Gebrauch ist jede Verwendung als Beförderungsmittel, auch Aussteigen, Beladen und Abstellen, auf der Straße wie auf dem eigenen Hof (§ 1a Abs. 3 PflVG). Ein länger außer Betrieb gesetztes, nur gelagertes Fahrzeug ist nicht in Gebrauch (Lehrbuch S. 29)."},{"id":"t2-07","typ":"mc","titel":"Beginn des vorläufigen Schutzes","akte":"Aktennotiz","fall":"Ein Kunde bekommt von der Proximus am 27.10.2026 die eVB-Nummer. Vereinbarter Beginn ist der 01.11.2026. Der Wagen wird am 29.10.2026 zugelassen.","frage":"Ab wann hat er vorläufigen Schutz in der Kfz-Haftpflicht?","optionen":["ab 29.10.2026","ab 27.10.2026","ab 01.11.2026","erst ab Zahlung des ersten Beitrags"],"richtig":0,"warum":[null,"Die Nennung der Nummer allein startet den Schutz nicht; maßgeblich ist der vereinbarte Zeitpunkt, spätestens der Tag der Zulassung.","Der vereinbarte Beginn liegt nach der Zulassung. Spätestens mit der Zulassung beginnt der Schutz.","Regelfall nach den AKB ist vorläufiger Schutz schon vor der Zahlung (Ziff. B.2.1)."],"erkl":"Ziff. B.2.1 AKB: Mit der eVB-Nummer besteht vorläufiger Schutz ab dem vereinbarten Zeitpunkt, spätestens ab dem Tag der Zulassung – hier also ab 29.10.2026."},{"id":"t2-08","typ":"urteil","titel":"Bestätigung und erster Beitrag","sprecher":"Eine Kollegin in der Agentur","aussage":"„Die Proximus kann die Versicherungsbestätigung von der Zahlung des ersten Beitrags abhängig machen.“","urteil":"stimmt","normfrage":"Welche Norm trägt das Urteil?","normoptionen":["§ 5b Abs. 1 S. 2 PflVG","§ 49 Abs. 2 FZV","Ziff. A.1.3.3 AKB","§ 1a Abs. 3 PflVG"],"norm":0,"erkl":"§ 5b Abs. 1 PflVG: Der Versicherer muss die Bestätigung bei Beginn des Schutzes übermitteln, kann sie aber von der Zahlung der ersten Prämie abhängig machen. Regelfall nach Ziff. B.2.1 AKB ist trotzdem vorläufiger Schutz vor der Zahlung."},{"id":"t2-09","typ":"mc","titel":"Nachweis eines Touristen","frage":"Ein Tourist fährt mit seinem in Polen zugelassenen Auto nach Halle. Was genügt in Deutschland als Nachweis seiner Haftpflichtversicherung?","optionen":["das amtliche polnische Kennzeichen","eine an der Grenze abgeschlossene Grenzversicherung; das Kennzeichen genügt nicht","eine eVB-Nummer einer deutschen Versicherung","ein deutscher Versicherungsschein"],"richtig":0,"erkl":"Für Fahrzeuge aus der EU und einigen weiteren Staaten gilt schon das Kennzeichen als Nachweis (Lehrbuch S. 35). Fahrer aus anderen Staaten weisen den Schutz mit der Grünen Karte oder einer Grenzversicherung nach (§ 13 AuslPflVG)."},{"id":"t2-11","typ":"frei","art":"erklaerung","titel":"Warum 100 Mio. € pauschal","akte":"Kundengespräch","frage":"Erklären Sie Hendrik in zwei Sätzen, warum Sie ihm 100 Mio. € pauschal statt der gesetzlichen Mindestdeckung empfehlen.","zuordnung":{"frage":"Gehört der Satz in eine richtige Erklärung für Hendrik?","kategorien":["richtig","falsch"],"zeilen":[{"text":"Die 7.500.000 € Mindestdeckung gelten für alle Verletzten eines Unfalls zusammen.","kat":0,"erkl":"Die Mindestsumme gilt je Schadensfall, nicht je Person (Anlage zu § 4 Abs. 2 PflVG)."},{"text":"Mit der Mindestdeckung bekommt jede verletzte Person bis zu 7.500.000 €.","kat":1,"erkl":"Häufiger Irrtum: 7.500.000 € je Schadensfall für alle Verletzten zusammen (Anlage zu § 4 Abs. 2 PflVG)."},{"text":"Was über die Versicherungssumme hinausgeht, zahlen Sie selbst.","kat":0,"erkl":"Der Versicherer zahlt nur bis zur vereinbarten Summe; den Rest trägt der Kunde (Ziff. A.1.3.3 AKB)."},{"text":"Mit 100 Mio. € pauschal ist jede verletzte Person bis 8 Mio. € gedeckt.","kat":0,"erkl":"So steht es im Antrag der Proximus: 8 Mio. € je Person innerhalb der 100 Mio. €."}]},"kernpunkte":["Die Mindestsumme für Personenschäden gilt für alle Verletzten eines Unfalls zusammen","Was die Versicherungssumme übersteigt, trägt er selbst (Ziff. A.1.3.3 AKB)","Bei 100 Mio. € pauschal ist jede verletzte Person bis 8 Mio. € gedeckt (Antrag Proximus)"],"muster":"Mit der Mindestdeckung stehen für alle Verletzten eines Unfalls zusammen nur 7.500.000 € bereit; was darüber liegt, müssen Sie selbst zahlen (Ziff. A.1.3.3 AKB). Mit 100 Mio. € pauschal ist jede verletzte Person bis 8 Mio. € gedeckt.","erkl":"Je Schadensfall heißt: Mehrere Verletzte teilen sich die Mindestsumme. Den Rest trägt der Kunde (Ziff. A.1.3.3 AKB)."}]},"3":{"titel":"Wer zahlt dem Opfer?","untertitel":"Direktanspruch, krankes Versicherungsverhältnis, Nachhaftung und Entschädigungsfonds.","items":[{"id":"t3-11","typ":"frei","art":"abruf","titel":"Nach dem Vertragsende","akte":"Kurzantwort","frage":"Ein Kfz-Vertrag ist beendet. Wie lange muss der Versicherer dem Opfer noch leisten, ab wann läuft diese Frist, und wer hilft danach?","zuordnung":{"frage":"Prüfen Sie Ihr Wissen: Was gilt, wenn ein Kfz-Vertrag beendet ist?","kategorien":["einen Monat","ab der Anzeige an die Zulassungsstelle","ab dem Vertragsende","der Entschädigungsfonds, nachrangig"],"zeilen":[{"text":"Wie lange haftet der Versicherer dem Opfer noch?","kat":0,"erkl":"§ 117 Abs. 2 S. 1 VVG: Nachhaftung von einem Monat."},{"text":"Ab wann läuft die Frist der Nachhaftung?","kat":1,"erkl":"Die Frist beginnt mit der Anzeige des Versicherers an die Zulassungsstelle, nicht mit dem Vertragsende (§ 117 Abs. 2 S. 1 VVG)."},{"text":"Wer hilft dem Opfer, wenn das Auto nach dem Ende der Nachhaftung unversichert einen Unfall verursacht?","kat":3,"erkl":"§ 12 Abs. 1 S. 1 Nr. 2 PflVG: Der Fonds zahlt, aber nur, was sonst niemand zahlt (§ 12 Abs. 1 S. 2 und 3 PflVG)."}]},"kernpunkte":["noch einen Monat (§ 117 Abs. 2 S. 1 VVG)","ab der Anzeige an die Zulassungsstelle, nicht ab dem Vertragsende","danach, wenn das Auto nicht versichert ist, nachrangig der Entschädigungsfonds (§ 12 Abs. 1 S. 1 Nr. 2 PflVG)"],"muster":"Der Versicherer haftet dem Opfer noch einen Monat, gerechnet ab seiner Anzeige an die Zulassungsstelle, nicht ab dem Vertragsende (§ 117 Abs. 2 S. 1 VVG). Ist das Auto danach nicht versichert, hilft nachrangig der Entschädigungsfonds (§ 12 Abs. 1 S. 1 Nr. 2 PflVG).","erkl":"Merkkasten TE 3: Nach Vertragsende Nachhaftung bis einen Monat nach der Anzeige (§ 117 Abs. 2 VVG); der Fonds zahlt nur, was sonst niemand zahlt."},{"id":"t3-01","typ":"zuordnung","titel":"Drei Ansprüche","fall":"Luca ist selbst Versicherungsnehmer bei der Proximus und fährt eine Radfahrerin an.","frage":"Ordnen Sie jedem Anspruch seinen Namen zu.","kategorien":["Haftungsanspruch","Deckungsanspruch","Direktanspruch"],"zeilen":[{"text":"Radfahrerin gegen Luca","kat":0,"erkl":"Das Opfer hat gegen den Schädiger einen Haftungsanspruch."},{"text":"Luca gegen die Proximus","kat":1,"erkl":"Der Versicherungsnehmer hat gegen seinen Versicherer einen Deckungsanspruch."},{"text":"Radfahrerin gegen die Proximus","kat":2,"erkl":"Das Opfer kann sich direkt an den Versicherer wenden (§ 115 Abs. 1 S. 1 Nr. 1 VVG)."}],"erkl":"Schaubild Lehrbuch S. 37: Haftungsanspruch Opfer gegen Schädiger, Deckungsanspruch Versicherungsnehmer gegen Versicherer, Direktanspruch Opfer gegen Versicherer."},{"id":"t3-02","typ":"mc","titel":"Gesamtschuldner","frage":"Versicherer und Schädiger haften dem Opfer als Gesamtschuldner. Was heißt das?","optionen":["Jeder schuldet den ganzen Schaden, das Opfer bekommt ihn aber nur einmal.","Jeder zahlt die Hälfte des Schadens.","Das Opfer muss zuerst den Schädiger verklagen.","Das Opfer bekommt den Schaden von beiden, also doppelt."],"richtig":0,"erkl":"§ 115 Abs. 1 S. 4 VVG: Versicherer und Versicherungsnehmer haften als Gesamtschuldner. Jeder schuldet den ganzen Schaden, ersetzt wird er nur einmal."},{"id":"t3-03","typ":"stufen","titel":"Hendrik im Beitragsrückstand","akte":"Schadenakte","fall":"Hendrik hat seinen Folgebeitrag nicht gezahlt. Die Proximus hat ihn qualifiziert gemahnt, die Zahlungsfrist ist abgelaufen. Hendrik hat die Mahnung gelesen und nichts unternommen; gekündigt hat die Proximus nicht. Danach fährt Hendrik einem Motorradfahrer auf. Dessen Schaden: Motorrad 4.000 € (dafür keine eigene Versicherung), Heilbehandlung 3.000 € (seine Krankenkasse übernimmt sie), Schmerzensgeld 2.000 €. Hendrik hat eine gültige Fahrerlaubnis, der Golf ist verkehrssicher.","schritte":[{"typ":"mc","frage":"Hat Hendrik für diesen Unfall Versicherungsschutz?","optionen":["Nein, die Proximus ist ihm gegenüber leistungsfrei.","Ja, weil der Vertrag nicht gekündigt ist.","Ja, aber nur für Personenschäden."],"richtig":0,"erkl":"Offener Beitrag nach Ablauf der Zahlungsfrist aus der qualifizierten Mahnung: kein Versicherungsschutz (Ziff. C.2.3 AKB; § 38 Abs. 2 VVG)."},{"typ":"mc","frage":"Muss die Proximus dem Motorradfahrer trotzdem zahlen?","optionen":["Ja, die Leistungspflicht gegenüber dem Opfer bleibt bestehen.","Nein, ohne Schutz für Hendrik zahlt sie niemandem.","Nein, der Motorradfahrer muss sich an den Entschädigungsfonds wenden."],"richtig":0,"erkl":"Krankes Versicherungsverhältnis: innen leistungsfrei, außen leistungspflichtig (§ 117 Abs. 1 VVG)."},{"typ":"zahl","frage":"Welchen Betrag zahlt die Proximus dem Motorradfahrer?","einheit":"€","loesung":6000,"weg":"Sie zahlt nur nachrangig (§ 117 Abs. 3 S. 2 VVG): Die Heilbehandlung trägt die Krankenkasse; ein Fall des § 3 PflVG liegt nicht vor. Motorrad 4.000 € + Schmerzensgeld 2.000 € = 6.000 €."},{"typ":"mc","frage":"Wie viel holt sich die Proximus danach von Hendrik zurück?","optionen":["die vollen 6.000 € und ihre Aufwendungen, ohne Obergrenze","höchstens 5.000 €","höchstens 2.500 €","nichts, sie haftet ja als Gesamtschuldnerin"],"richtig":0,"erkl":"Rückgriff nach § 116 Abs. 1 VVG. Die Grenzen von 5.000 € und 2.500 € gelten nur für Pflichtverletzungen, nicht beim Zahlungsverzug."}],"erkl":"Merkkasten TE 3: Außen zahlt der Versicherer, innen holt er zurück – beim Zahlungsverzug in voller Höhe."},{"id":"t3-04","typ":"mc","titel":"Rückgriff nach Alkoholfahrt","akte":"Schadenakte","fall":"Hendrik hat pünktlich gezahlt, war aber nach Alkohol nicht in der Lage, sicher zu fahren. Die Proximus zahlt dem Opfer 12.000 €.","frage":"Bis zu welchem Betrag kann sie Hendrik höchstens in Rückgriff nehmen?","optionen":["5.000 €","12.000 €","2.500 €","nichts"],"richtig":0,"warum":[null,"Volle Höhe gilt beim Zahlungsverzug, nicht bei einer Pflichtverletzung.","2.500 € gelten für Pflichtverletzungen im Schadenfall (Ziff. E.7.3).","Die Proximus ist wegen der Pflichtverletzung teilweise leistungsfrei und darf Rückgriff nehmen."],"erkl":"Pflichtverletzung beim Gebrauch (Ziff. D.2.1): Leistungsfreiheit höchstens 5.000 € (Ziff. D.5.3 AKB; § 5 KfzPflVV). Den Rest trägt die Proximus endgültig."},{"id":"t3-05","typ":"mc","titel":"Pflichtverletzung im Schadenfall","frage":"Ein Kunde verletzt nach einem Unfall eine Pflicht im Schadenfall; ein besonders schwerer Fall liegt nicht vor. Wie viel kann die Proximus höchstens zurückverlangen?","optionen":["2.500 €","5.000 €","die volle Leistung","500 €"],"richtig":0,"erkl":"Ziff. E.7.3 AKB: höchstens 2.500 €. Bei vorsätzlicher, besonders schwerer Verletzung der Aufklärungs- oder Schadenminderungspflicht höchstens 5.000 € (Ziff. E.7.4)."},{"id":"t3-06","typ":"stufen","titel":"Nachhaftung","akte":"Aktennotiz","fall":"Ein Kfz-Vertrag endet am 18.01.2027. Die Proximus zeigt das Vertragsende am 21.01.2027 der Zulassungsstelle an. Das Auto wird nicht neu versichert.","schritte":[{"typ":"datum","frage":"Mit Ablauf welches Tages endet die Nachhaftung?","loesung":"21.02.2027","pruef":{"art":"monat","anzeige":"21.01.2027"},"weg":"Ein Monat ab der Anzeige an die Zulassungsstelle, nicht ab dem Vertragsende (§ 117 Abs. 2 S. 1 VVG): Ablauf des 21.02.2027."},{"typ":"mc","frage":"Der frühere Kunde verursacht am 15.02.2027 einen Unfall. Was gilt?","optionen":["Die Proximus zahlt dem Opfer bis zu den Mindestversicherungssummen und holt sich das Geld beim früheren Kunden zurück.","Die Proximus zahlt nicht, weil der Vertrag beendet ist.","Die Proximus zahlt bis zur früher vereinbarten Summe und verzichtet auf den Rückgriff.","Nur der Entschädigungsfonds zahlt."],"richtig":0,"erkl":"Nachhaftung im Rahmen des § 117 Abs. 3 VVG, danach Rückgriff (§ 116 Abs. 1 VVG). Für die Zeit der Nachhaftung verlangt die Proximus die Prämie (Ziff. C.5 AKB)."},{"typ":"mc","frage":"Und bei einem Unfall am 25.02.2027?","optionen":["Die Proximus muss nicht mehr leisten; das Opfer kann sich nachrangig an den Entschädigungsfonds wenden.","Die Proximus zahlt noch bis zum Monatsende.","Die Proximus zahlt wie während der Nachhaftung."],"richtig":0,"erkl":"Die Nachhaftung ist abgelaufen. Für das nicht versicherte Auto springt der Fonds ein, soweit beim Schädiger nichts zu holen ist (§ 12 Abs. 1 S. 1 Nr. 2, S. 2 PflVG)."}],"erkl":"Nachhaftung: noch einen Monat nach der Anzeige an die Zulassungsstelle (§ 117 Abs. 2 VVG)."},{"id":"t3-07","typ":"zahl","titel":"Fahrerflucht am Garagentor","akte":"Schadenmeldung","fall":"In der Nacht beschädigt ein Unbekannter das Garagentor der Brehmers und flüchtet. Schaden 2.150 €. Verletzt wird niemand; keine andere Versicherung zahlt.","frage":"Welchen Betrag zahlt der Entschädigungsfonds?","einheit":"€","loesung":1650,"pruef":{"art":"fonds","schaden":2150},"weg":"Fahrerflucht (§ 12 Abs. 1 S. 1 Nr. 1 PflVG): Sachschäden nur, soweit sie 500 € übersteigen (§ 12 Abs. 2 S. 2 PflVG). 2.150 € − 500 € = 1.650 €.","erkl":"Die 500 € sind ein Abzug, keine Schwelle. Ein Garagentor ist weder ein Fahrzeug noch eine Einrichtung des Verkehrs oder der Versorgung."},{"id":"t3-08","typ":"mc","titel":"Auto bei Fahrerflucht","fall":"Derselbe Unbekannte hat auch Lucas geparkten Kleinwagen beschädigt (1.800 €). Luca hat keine Vollkasko.","frage":"Was zahlt der Fonds für den Kleinwagen?","optionen":["nichts","1.300 €","1.800 €","500 €"],"richtig":0,"warum":[null,"Der Abzug von 500 € gilt für Sachen wie Zäune oder Tore. Fahrzeuge ersetzt der Fonds bei Fahrerflucht nur, wenn ein Mensch getötet oder erheblich verletzt wurde.","Bei Fahrerflucht ersetzt der Fonds Fahrzeugschäden nicht in voller Höhe und hier gar nicht.","500 € sind der Abzug, kein Mindestbetrag."],"erkl":"§ 12 Abs. 2 S. 3 Nr. 1 PflVG: Schäden an Fahrzeugen nur, wenn beim selben Unfall ein Mensch getötet oder erheblich verletzt wurde. Ohne Vollkasko trägt Luca den Schaden selbst."},{"id":"t3-09","typ":"mc","titel":"Der Fonds zahlt subsidiär","frage":"Der Entschädigungsfonds zahlt „subsidiär“. Was bedeutet das?","optionen":["Er zahlt nur, soweit das Opfer weder von Halter, Eigentümer oder Fahrer noch von einem Schadensversicherer oder Sozialversicherungsträger Ersatz bekommt.","Er zahlt immer zuerst; die anderen Stellen danach.","Er zahlt nur Personenschäden.","Er zahlt nur bei Unfällen im Ausland."],"richtig":0,"erkl":"§ 12 Abs. 1 S. 2 und 3 PflVG: Der Fonds zahlt zuletzt. Wer von einer eigenen Vollkasko oder der Krankenkasse Ersatz bekommt, muss sich zuerst dorthin wenden."},{"id":"t3-10","typ":"urteil","titel":"Vorsatz","sprecher":"Hendrik Brehmer","aussage":"„Wenn jemand absichtlich ein Auto rammt, zahlt seine Versicherung nicht. Dann geht das Opfer leer aus.“","urteil":"stimmt nicht","normfrage":"Welche Norm hilft dem Opfer?","normoptionen":["§ 12 Abs. 1 S. 1 Nr. 3 PflVG","§ 117 Abs. 1 VVG","§ 115 Abs. 1 S. 1 Nr. 1 VVG","Ziff. A.1.5.1 AKB"],"norm":0,"erkl":"Der erste Satz stimmt: Bei Vorsatz besteht kein Versicherungsschutz (§ 103 VVG, Ziff. A.1.5.1 AKB), und § 117 VVG hilft nicht. Leer geht das Opfer aber nicht aus: Der Entschädigungsfonds springt ein (§ 12 Abs. 1 S. 1 Nr. 3 PflVG), soweit vom Schädiger nichts zu holen ist."},{"id":"t3-12","typ":"frei","art":"erklaerung","titel":"Außen zahlen, innen zurückholen","akte":"Kundengespräch","frage":"Erklären Sie Hendrik in zwei Sätzen, warum die Proximus einem Unfallopfer zahlt, obwohl er seinen Folgebeitrag trotz qualifizierter Mahnung bis zum Fristablauf nicht bezahlt hat, und was das für ihn bedeutet.","zuordnung":{"frage":"Gehört der Satz in eine richtige Erklärung für Hendrik?","kategorien":["richtig","falsch"],"zeilen":[{"text":"Dem Opfer gegenüber bleibt die Proximus zur Leistung verpflichtet, obwohl sie Ihnen gegenüber leistungsfrei ist.","kat":0,"erkl":"§ 117 Abs. 1 VVG: Leistungsfrei gegenüber dem Kunden heißt nicht leistungsfrei gegenüber dem Opfer."},{"text":"Weil Sie nicht gezahlt haben, muss sich das Opfer an den Entschädigungsfonds wenden.","kat":1,"erkl":"Der Fonds zahlt nur, was sonst niemand zahlt; hier zahlt die Proximus nach § 117 Abs. 1 VVG (Merkkasten TE 3)."},{"text":"Das Geld, das die Proximus dem Opfer zahlt, holt sie sich bei Ihnen zurück.","kat":0,"erkl":"§ 116 Abs. 1 VVG: Im Verhältnis zum Kunden trägt er den Schaden; die Proximus nimmt Rückgriff."},{"text":"Der Rückgriff ist auf 5.000 € begrenzt.","kat":1,"erkl":"Die Grenzen von 5.000 € und 2.500 € gelten nur für Pflichtverletzungen; beim Zahlungsverzug holt sich der Versicherer alles zurück (§ 116 Abs. 1 VVG; Ziff. D.5.3, E.7.3, E.7.4 AKB)."}]},"kernpunkte":["Gegenüber dem Opfer bleibt die Proximus zur Leistung verpflichtet (§ 117 Abs. 1 VVG)","Grund ist der Schutz des Verkehrsopfers","Ihm gegenüber ist sie leistungsfrei und holt sich das Geld bei ihm zurück (§ 116 Abs. 1 VVG)","Beim Zahlungsverzug ohne Obergrenze"],"muster":"Das Gesetz schützt das Verkehrsopfer: Die Proximus muss ihm zahlen, auch wenn sie Ihnen gegenüber leistungsfrei ist (§ 117 Abs. 1 VVG). Das Geld holt sie sich danach von Ihnen zurück, beim Zahlungsverzug in voller Höhe (§ 116 Abs. 1 VVG).","erkl":"Merkkasten TE 3: Außen zahlt der Versicherer, innen holt er zurück – beim Zahlungsverzug ohne die Grenzen von 5.000 € und 2.500 €."}]},"4":{"titel":"Unfall über die Grenze","untertitel":"Welche Stelle hilft den Brehmers – und wer zahlt?","items":[{"id":"t4-09","typ":"frei","art":"abruf","titel":"Drei Fälle, drei Wege","akte":"Kurzantwort","frage":"Nennen Sie für jeden Fall die zuständige Stelle mit Norm oder Ziffer, für Fall (3) auch den Umfang des Schutzes: (1) Ein ausländisches Auto verursacht einen Unfall in Deutschland. (2) Unfall im EU-Ausland, der Geschädigte wohnt in Deutschland. (3) Sie verursachen selbst einen Unfall im Ausland.","zuordnung":{"frage":"Prüfen Sie Ihr Wissen: Wer ist zuständig?","kategorien":["Deutsches Büro Grüne Karte","SRB des fremden Versicherers in Deutschland","die eigene Kfz-Haftpflicht"],"zeilen":[{"text":"Ein ausländisches Auto verursacht einen Unfall in Deutschland.","kat":0,"erkl":"§ 10 Abs. 1 AuslPflVG: Sie machen Ihren Anspruch gegen das Büro wie gegen einen Haftpflichtversicherer geltend."},{"text":"Unfall im EU-Ausland, der Geschädigte wohnt in Deutschland.","kat":1,"erkl":"§ 163 Abs. 1 VAG: Der SRB des fremden Versicherers reguliert in Deutschland und auf Deutsch."},{"text":"Sie verursachen selbst einen Unfall im Ausland.","kat":2,"erkl":"Ziff. A.1.4.1 AKB: Ihre Kfz-Haftpflicht zahlt, mindestens im Umfang Ihres Vertrags."},{"text":"Ein Auto mit polnischem Kennzeichen fährt in Halle auf den stehenden Familien-Pkw der Brehmers auf.","kat":0,"erkl":"Ausländisches Auto, Unfall in Deutschland: Deutsches Büro Grüne Karte (§ 10 Abs. 1 AuslPflVG)."}]},"kernpunkte":["(1) Deutsches Büro Grüne Karte (§ 10 Abs. 1 AuslPflVG)","(2) Schadenregulierungsbeauftragter des fremden Versicherers in Deutschland (§ 163 Abs. 1 VAG)","(3) die eigene Kfz-Haftpflicht, mindestens im Umfang des Vertrags (Ziff. A.1.4.1 AKB)"],"muster":"(1) Das Deutsche Büro Grüne Karte (§ 10 Abs. 1 AuslPflVG). (2) Der Schadenregulierungsbeauftragte des fremden Versicherers in Deutschland (§ 163 Abs. 1 VAG). (3) Die eigene Kfz-Haftpflicht, mindestens im Umfang des eigenen Vertrags (Ziff. A.1.4.1 AKB).","erkl":"Merkkasten TE 4: Drei Fälle, drei Wege. Versicherer und SRB nennt der Zentralruf (§ 8a PflVG)."},{"id":"t4-01","typ":"reihe","titel":"Drei Prüffragen","frage":"Bringen Sie die Prüffragen zur Tabelle auf S. 46 in die Reihenfolge, in der das Skript sie stellt.","schritte":["Wo ist der Unfall passiert?","Woher kommt der Schädiger?","Ist seine Versicherung bekannt?","Daraus folgt die zuständige Stelle."],"erkl":"Skript TE 4: Die Tabelle auf S. 46 folgt immer denselben drei Fragen; aus den Antworten ergibt sich die Stelle. Sie geht von einem Geschädigten aus, der in Deutschland wohnt."},{"id":"t4-02","typ":"mc","titel":"Gegen wen klagen?","akte":"Schadenakte","fall":"Ein Auto mit polnischem Kennzeichen beschädigt in Halle den Familien-Pkw der Brehmers. Das Deutsche Büro Grüne Karte beauftragt einen deutschen Versicherer mit der Regulierung.","frage":"Gegen wen richten die Brehmers notfalls ihre Klage?","optionen":["gegen das Deutsche Büro Grüne Karte","gegen den beauftragten deutschen Versicherer","gegen die Verkehrsopferhilfe","gegen den Zentralruf der Autoversicherer"],"richtig":0,"erkl":"Das Büro ist passivlegitimiert: Es kann wie ein Haftpflichtversicherer in Anspruch genommen und verklagt werden (§ 10 Abs. 1 AuslPflVG), auch wenn es die Regulierung überträgt (§ 10 Abs. 4 AuslPflVG)."},{"id":"t4-03","typ":"mc","titel":"Versicherer unbekannt","akte":"Kundengespräch","fall":"In Spanien fährt ein Einheimischer auf Sabines Auto auf. Sie hat nur sein Kennzeichen notiert.","frage":"Wo erfährt Sabine, wer sein Versicherer und dessen Schadenregulierungsbeauftragter in Deutschland ist?","optionen":["beim Zentralruf der Autoversicherer","beim Deutschen Büro Grüne Karte","bei der spanischen Zulassungsbehörde","bei ihrer eigenen Kfz-Haftpflicht"],"richtig":0,"erkl":"Der Zentralruf der Autoversicherer ist die Auskunftsstelle (§ 8a Abs. 1 und 3 PflVG). Deshalb immer das Kennzeichen notieren."},{"id":"t4-04","typ":"mc","titel":"Keine Antwort vom SRB","frage":"Sabine hat den Schaden beim SRB angemeldet, bekommt aber keine begründete Antwort. Wann kann sie sich an die Verkehrsopferhilfe als Entschädigungsstelle wenden?","optionen":["wenn binnen drei Monaten keine begründete Antwort kommt","schon nach zwei Wochen","sofort nach der Anmeldung","gar nicht, Auslandsunfälle sind ausgeschlossen"],"richtig":0,"erkl":"§ 15 Abs. 1 PflVG: Die Entschädigungsstelle hilft, wenn Versicherer oder SRB nicht binnen drei Monaten mit Gründen antworten oder der Versicherer binnen zwei Monaten nicht zu ermitteln ist."},{"id":"t4-05","typ":"mc","titel":"Welches Recht?","frage":"Sabine verursacht in Ungarn einen Unfall mit einem ungarischen Auto. Nach welchem Recht wird in der Regel reguliert?","optionen":["nach ungarischem Recht, dem Recht des Unfalllandes","nach deutschem Recht, weil Sabine bei der Proximus versichert ist","nach dem Recht, das der Geschädigte wählt","nach dem Recht des Landes, in dem der Schädiger wohnt"],"richtig":0,"erkl":"Im Grüne-Karte-System gilt die Regel: Reguliert wird nach dem Recht des Landes, in dem der Unfall geschah (Skript TE 4)."},{"id":"t4-06","typ":"urteil","titel":"Umfang im Ausland","sprecher":"Sabine Brehmer","aussage":"„Verursache ich in Serbien einen Unfall, zahlt die Proximus höchstens das, was Serbien als Mindestsumme vorschreibt.“","urteil":"stimmt nicht","normfrage":"Welche Ziffer regelt den Umfang im Besuchsland?","normoptionen":["Ziff. A.1.4.1 S. 2 AKB","Ziff. A.1.4.2 AKB","Ziff. A.1.5.3 AKB","§ 163 Abs. 1 VAG"],"norm":0,"erkl":"Es gilt der im Besuchsland vorgeschriebene Umfang, mindestens aber der Umfang des eigenen Vertrags (Ziff. A.1.4.1 S. 2 AKB). Serbien liegt in Europa (Ziff. A.1.4.1 S. 1)."},{"id":"t4-07","typ":"zuordnung","titel":"Wer ist zuständig?","frage":"Ordnen Sie jedem Fall zu, wer zuständig ist bzw. wer den Schaden ersetzt.","kategorien":["Deutsches Büro Grüne Karte","SRB des fremden Versicherers in Deutschland","selbst beim ausländischen Versicherer","eigene Kfz-Haftpflicht (Proximus)"],"zeilen":[{"text":"Ein Auto mit dänischem Kennzeichen fährt in Halle auf den Familien-Pkw auf.","kat":0,"erkl":"Ausländisches Auto verursacht Unfall in Deutschland: Deutsches Büro Grüne Karte (§ 10 Abs. 1 AuslPflVG)."},{"text":"In Wien beschädigt ein Österreicher mit seinem in Österreich zugelassenen Auto Sabines geparktes Auto.","kat":1,"erkl":"Unfall im EU-Ausland, Geschädigte wohnt in Deutschland: SRB in Deutschland (§ 163 Abs. 1 VAG)."},{"text":"In Anatolien fährt ein Einheimischer mit seinem dort zugelassenen Auto auf Sabines Auto auf.","kat":2,"erkl":"Türkei: weder EU noch EWR. Kein SRB, keine Entschädigungsstelle; Sabine wendet sich selbst an den türkischen Versicherer."},{"text":"Sabine fährt in Bulgarien einem Einheimischen auf. Wer ersetzt dessen Schaden?","kat":3,"erkl":"Wer im Ausland schädigt, ist über die eigene Kfz-Haftpflicht geschützt (Ziff. A.1.1.1, A.1.4.1)."}],"erkl":"Merkkasten TE 4: Ausländisches Auto in Deutschland → Büro Grüne Karte. Unfall im EU-Ausland → SRB zu Hause. Selbst verursacht → eigene Kfz-Haftpflicht."},{"id":"t4-08","typ":"mc","titel":"Das eigene Auto im Ausland","fall":"Sabine fährt in Serbien einem Einheimischen auf. Ihr eigenes Auto ist vorn beschädigt.","frage":"Wer zahlt den Schaden an Sabines Auto?","optionen":["nur eine Vollkasko, falls Sabine eine hat","ihre Kfz-Haftpflicht bei der Proximus","das serbische Grüne-Karte-Büro","der Versicherer des Serben"],"richtig":0,"erkl":"Die Kfz-Haftpflicht zahlt nicht für das versicherte Fahrzeug selbst (Ziff. A.1.5.3). Ein selbst verschuldeter Unfallschaden ist Sache der Vollkasko (Ziff. A.2.3.2)."},{"id":"t4-10","typ":"frei","art":"erklaerung","titel":"Kein SRB für die Türkei","akte":"Kundengespräch","frage":"Erklären Sie Sabine in zwei Sätzen, warum ihr nach einem Unfall mit einem türkischen Auto in der Türkei kein Schadenregulierungsbeauftragter in Deutschland hilft und an wen sie sich stattdessen wenden muss.","zuordnung":{"frage":"Gehört der Satz in eine richtige Erklärung für Sabine?","kategorien":["richtig","falsch"],"zeilen":[{"text":"Die Türkei gehört weder zur EU noch zum EWR.","kat":0,"erkl":"Deshalb gelten die Regeln für EU und EWR hier nicht (Übung 1 c TE 4)."},{"text":"Einen SRB in Deutschland gibt es nur für Fahrzeuge aus der EU und dem EWR.","kat":0,"erkl":"§ 163 Abs. 1 und 4 VAG."},{"text":"Sie melden den Schaden beim Deutschen Büro Grüne Karte.","kat":1,"erkl":"Das Büro ist zuständig, wenn ein ausländisches Auto in Deutschland einen Unfall verursacht (§ 10 Abs. 1 AuslPflVG), nicht für einen Unfall in der Türkei."},{"text":"Ihre eigene Kfz-Haftpflicht zahlt Ihren Schaden.","kat":1,"erkl":"Die eigene Haftpflicht zahlt nur, was Sabine anderen zufügt (Ziff. A.1.1.1 AKB), nicht ihren eigenen Schaden."},{"text":"Sie wenden sich selbst an den türkischen Versicherer.","kat":0,"erkl":"Außerhalb von EU und EWR fehlt diese Hilfe meist; dann wendet sich die Geschädigte selbst an den ausländischen Versicherer (Skript TE 4; Tabelle S. 46)."}]},"kernpunkte":["Die Türkei gehört weder zur EU noch zum EWR","Einen SRB gibt es nur für Fahrzeuge aus EU und EWR (§ 163 Abs. 1 und 4 VAG)","Sie muss sich selbst an den türkischen Versicherer wenden"],"muster":"Einen Schadenregulierungsbeauftragten in Deutschland gibt es nur für Fahrzeuge aus der EU und dem EWR; die Türkei gehört zu keinem von beiden (§ 163 Abs. 1 und 4 VAG). Sie müssen Ihre Ansprüche deshalb selbst beim türkischen Versicherer geltend machen.","erkl":"Übung 1 c TE 4: Die Türkei gehört weder zur EU noch zum EWR; Sabine macht ihre Ansprüche selbst beim türkischen Versicherer geltend (Tabelle S. 46)."}]},"5":{"titel":"Tarif und SF-Klasse","untertitel":"Von der Tarifprämie zum Beitrag – und welche Klasse ein neuer Vertrag bekommt.","items":[{"id":"t5-10","typ":"frei","art":"abruf","titel":"Besserstufung","akte":"Kurzantwort","frage":"Nennen Sie die drei Regeln, nach denen ein neuer Vertrag aus Klasse 0 zum 1. Januar besser gestuft wird.","zuordnung":{"frage":"Prüfen Sie Ihr Wissen: In welcher Klasse steht der Vertrag am nächsten 1. Januar?","kategorien":["SF 1","SF ½","Klasse 0 bleibt"],"zeilen":[{"text":"Neuer Vertrag in Klasse 0, Beginn 1. März, bis 31. Dezember schadenfrei","kat":1,"erkl":"Beginn zwischen 2. Januar und 1. Juli, mindestens sechs Monate: Halbjahresregelung nach SF ½ (Ziff. I.3.4.2)."},{"text":"Neuer Vertrag in Klasse 0, Beginn 1. September, bis 31. Dezember schadenfrei","kat":2,"erkl":"Beginn nach dem 1. Juli: keine Halbjahresregelung, das angefangene Jahr zählt nicht (Ziff. I.3.4.2)."},{"text":"Vertrag in Klasse 0, ein volles Kalenderjahr schadenfrei","kat":0,"erkl":"Aus Klasse 0 führt ein volles schadenfreies Kalenderjahr direkt in SF 1 (Ziff. I.3.4.1)."},{"text":"Lucas eigener Vertrag, Beginn 01.11.2026 in Klasse 0, bis 31. Dezember schadenfrei: Klasse am 01.01.2027","kat":2,"erkl":"Beginn nach dem 1. Juli: Das angefangene Jahr zählt nicht (Ziff. I.3.4.2); SF 1 frühestens am 01.01.2028 nach dem ersten vollen schadenfreien Kalenderjahr (Ziff. I.3.4.1)."}]},"kernpunkte":["Ein volles schadenfreies Kalenderjahr führt zum 1. Januar direkt in SF 1 (Ziff. I.3.2, I.3.4.1)","Beginn vom 2. Januar bis 1. Juli: Sechs Monate im ersten Jahr genügen für SF ½ zum 1. Januar (Ziff. I.3.4.2)","Beginn nach dem 1. Juli: keine Halbjahresregelung, das angefangene Jahr zählt nicht; zum nächsten 1. Januar bleibt Klasse 0 (Ziff. I.3.4.2)"],"muster":"Ein volles schadenfreies Kalenderjahr führt den Vertrag zum 1. Januar direkt in SF 1 (Ziff. I.3.2, I.3.4.1). Beginnt er zwischen dem 2. Januar und dem 1. Juli, genügen im ersten Jahr sechs Monate für SF ½ zum 1. Januar (Ziff. I.3.4.2). Beginnt er nach dem 1. Juli, zählt das angefangene Jahr nicht; zum nächsten 1. Januar bleibt er in Klasse 0.","erkl":"Skript TE 5, „Und im nächsten Jahr?“: Beginn 01.03. → SF ½ am 1. Januar; Beginn 01.09. → Klasse 0 bleibt, SF 1 erst nach dem ersten vollen schadenfreien Kalenderjahr."},{"id":"t5-01","typ":"reihe","titel":"Rechenreihenfolge","frage":"Bringen Sie die Rechenschritte für den Kfz-Beitrag in die richtige Reihenfolge.","schritte":["Tarifprämie (100 %) aus dem Tarifrechner","× Beitragssatz der SF-Klasse (Anhang 1)","Nachlässe und Zuschläge nacheinander, in der Reihenfolge des Tarifs","Abschlag für die Zahlungsweise","+ 19 % Versicherungsteuer"],"erkl":"Merkkasten TE 5: Erst der Beitragssatz, dann die Nachlässe, dann die Zahlungsweise, zuletzt die Versicherungsteuer. Jedes Zwischenergebnis auf den Cent runden."},{"id":"t5-02","typ":"mc","titel":"Was steckt in der Tarifprämie?","frage":"Was steckt bereits in der Tarifprämie aus dem Tarifrechner?","optionen":["Wagniskennziffer, Regionalklasse und Typklasse","SF-Klasse und Beitragssatz","alle Nachlässe und Zuschläge","Zahlungsweise und Versicherungsteuer"],"richtig":0,"erkl":"Proximus 5 enthält keine Grundprämien (Lehrbuch S. 59). In der Tarifprämie (100 %) stecken WKZ, Regional- und Typklasse; den Rest rechnen Sie mit dem Bedingungswerk."},{"id":"t5-03","typ":"urteil","titel":"Regionalklasse für Halle","sprecher":"Eine Kollegin in der Agentur","aussage":"„HAL fehlt im Kennzeichenverzeichnis. Dann nehme ich für die Brehmers eben SK, den Saalekreis.“","urteil":"stimmt nicht","normfrage":"Woher kommt die Regionalklasse für Halle?","normoptionen":["aus dem Tarifrechner; sie steckt in der Tarifprämie","vom Nachbarbezirk mit der höchsten Klasse","aus dem Typklassenverzeichnis","aus Anhang 1 der AKB"],"norm":0,"erkl":"Die Regionalklasse richtet sich nach dem Zulassungsbezirk am Wohnsitz. Das Verzeichnis in Proximus 5 ist ein Auszug; fehlt ein Bezirk, gilt der Wert aus dem Tarifrechner, nie der Nachbarbezirk (Lehrbuch S. 60–61)."},{"id":"t5-04","typ":"mc","titel":"HSN und TSN","frage":"Warum suchen Sie die Typklasse immer mit HSN und TSN zusammen?","optionen":["Dieselbe TSN kann bei zwei Herstellern vorkommen.","Die HSN gibt die Regionalklasse an.","Die TSN allein nennt nur das Baujahr.","Das Typklassenverzeichnis ist nach Kennzeichen sortiert."],"richtig":0,"erkl":"Die Typklasse finden Sie über Herstellerschlüsselnummer (HSN) und Typschlüsselnummer (TSN) aus der Zulassungsbescheinigung (Lehrbuch S. 61)."},{"id":"t5-05","typ":"zuordnung","titel":"Ersteinstufung","frage":"In welche Klasse stuft die Proximus den neuen Pkw-Vertrag in der Kfz-Haftpflicht ein?","kategorien":["Klasse 0 (85 %)","SF ½ (65 %)","SF 1 (52 %)","SF 3 (46 %)"],"zeilen":[{"text":"Luca (18), Fahrerlaubnis seit Juli 2026, eigener Vertrag für seinen ersten Pkw.","kat":0,"erkl":"Keine Sondereinstufung erfüllt: Klasse 0 (Ziff. I.2.1)."},{"text":"Eine Kundin (30), Fahrerlaubnis seit fünf Jahren, erster eigener Pkw; weder sie noch ein Partner hat einen weiteren Pkw.","kat":1,"erkl":"Mindestens drei Jahre Fahrerlaubnis: SF ½ (Ziff. I.2.2.1)."},{"text":"Ein Kunde (21), Fahrerlaubnis seit zwei Jahren, Zweitwagen; sein Erstwagen läuft in SF 1.","kat":2,"erkl":"Zweitwagen, Erstwagen mindestens SF 1, ein Jahr Fahrerlaubnis: SF 1 (Ziff. I.2.2.2). SF 3 scheitert am Alter, SF ½ an der Dauer der Fahrerlaubnis."},{"text":"Hendrik (49), Fahrerlaubnis seit 1996, Zweitwagen; Sabines Pkw läuft in SF 18; nur Hendrik und Sabine fahren.","kat":3,"erkl":"Erstwagen mindestens SF 3, mindestens ein Jahr Fahrerlaubnis, nur Kunde und Partner fahren, beide über 23: SF 3 (Ziff. I.2.2.3)."},{"text":"Eine Kundin (40), Fahrerlaubnis seit zwei Jahren, Zweitwagen; der Pkw ihres Ehemanns läuft in SF 10. Auch die 19-jährige Tochter fährt.","kat":2,"erkl":"SF 3 scheitert, weil die Tochter fährt und jünger als 23 ist; SF ½ an der Dauer der Fahrerlaubnis. Es bleibt SF 1 (Ziff. I.2.2.2)."}],"erkl":"Neuer Vertrag: Klasse 0 mit 85 % – es sei denn, jede Voraussetzung einer Sondereinstufung nach Ziff. I.2.2 ist erfüllt (Merkkasten TE 5)."},{"id":"t5-06","typ":"mc","titel":"Prozent mal Prozent","frage":"Beitragssatz 46 %, dazu ein Nachlass von 10 %. Welcher Anteil der Tarifprämie ist zu zahlen?","optionen":["41,4 %","36 %","46 %","56 %"],"richtig":0,"warum":[null,"Hier wurden Prozentpunkte abgezogen. Der Nachlass bezieht sich auf den errechneten Betrag.","Der Nachlass fehlt.","Nachlass und Zuschlag verwechselt."],"erkl":"46 % × 0,9 = 41,4 %. Nachlässe rechnen Sie nacheinander vom zuletzt errechneten Betrag (Skript TE 5)."},{"id":"t5-07","typ":"stufen","titel":"Rechenfall Beitrag","akte":"Tarifberechnung","fall":"Tarifprämie (100 %) für einen Neuwagen: 720,00 €. Der Vertrag steht in SF 3 (46 %). Nachlässe laut Antrag: Neuwagen −10 %, Garage −10 %. Der Kunde zahlt jährlich (−5 %). Runden Sie jedes Zwischenergebnis auf den Cent.","pruef":{"art":"beitrag","praemie":720.0,"prozente":[46,-10,-10,-5,19]},"schritte":[{"typ":"zahl","frage":"Beitrag nach dem Beitragssatz der SF-Klasse?","einheit":"€","loesung":331.2,"weg":"720,00 € × 46 % = 331,20 €"},{"typ":"zahl","frage":"Nach dem Neuwagen-Nachlass (−10 %)?","einheit":"€","loesung":298.08,"weg":"331,20 € − 33,12 € = 298,08 €"},{"typ":"zahl","frage":"Nach dem Garagen-Nachlass (−10 %)?","einheit":"€","loesung":268.27,"weg":"298,08 € − 29,81 € = 268,27 €"},{"typ":"zahl","frage":"Nach dem Abschlag für jährliche Zahlung (−5 %)?","einheit":"€","loesung":254.86,"weg":"268,27 € − 13,41 € = 254,86 €"},{"typ":"zahl","frage":"Jahresbeitrag mit 19 % Versicherungsteuer?","einheit":"€","loesung":303.28,"weg":"254,86 € + 48,42 € = 303,28 €"}],"erkl":"Erst der Beitragssatz, dann jeder Nachlass vom zuletzt errechneten Betrag, dann die Zahlungsweise, zuletzt 19 % Versicherungsteuer (Skript TE 5, Schritte 2 bis 4)."},{"id":"t5-08","typ":"stufen","titel":"Lucas nächste Klassen","fall":"Lucas eigener Vertrag beginnt am 01.11.2026 in Klasse 0 und bleibt schadenfrei.","schritte":[{"typ":"mc","frage":"In welcher Klasse steht er am 01.01.2027?","optionen":["Klasse 0","SF ½","SF 1"],"richtig":0,"erkl":"Beginn nach dem 1. Juli: Die Halbjahresregelung greift nicht (Ziff. I.3.4.2)."},{"typ":"mc","frage":"Und am 01.01.2028?","optionen":["SF 1","SF ½","SF 2"],"richtig":0,"erkl":"Aus Klasse 0 führt ein volles schadenfreies Kalenderjahr direkt in SF 1 (Ziff. I.3.4.1)."}],"erkl":"Besserstufung zum 1. Januar nach einem ganzen schadenfreien Kalenderjahr (Ziff. I.3.2); die Halbjahresregelung gilt nur bei Beginn vom 2. Januar bis 1. Juli."},{"id":"t5-09","typ":"mc","titel":"Familien-Nachlass?","frage":"Bekommen die Brehmers für den Golf den Familien-Nachlass?","optionen":["Nein, das Antragsfeld verlangt ein Kind unter 16 Jahren; Luca ist 18.","Ja, weil mehrere Familienmitglieder fahren.","Ja, weil sie zwei Autos bei der Proximus versichern.","Nur, wenn Luca den Kleinwagen selbst versichert."],"richtig":0,"erkl":"Im Antrag zur Kraftfahrtversicherung in Proximus 5 heißt das Feld „Familie mit Kind unter 16 Jahre“. Luca ist 18, der Nachlass entfällt (Tarif: Nachlässe und Zuschläge)."},{"id":"t5-11","typ":"frei","art":"erklaerung","titel":"Warum Luca nicht in SF ½ kommt","akte":"Kundengespräch","frage":"Erklären Sie Luca in zwei Sätzen, warum er mit einem eigenen Vertrag nicht in SF ½ kommt, obwohl er einen gültigen Führerschein hat, und in welcher Klasse sein Vertrag stattdessen beginnt.","zuordnung":{"frage":"Gehört der Satz in eine richtige Erklärung für Luca?","kategorien":["richtig","falsch"],"zeilen":[{"text":"Für SF ½ brauchen Sie die Fahrerlaubnis seit mindestens drei Jahren.","kat":0,"erkl":"Ziff. I.2.2.1 verlangt mindestens drei Jahre Fahrerlaubnis."},{"text":"Sie haben die Fahrerlaubnis erst seit Juli 2026.","kat":0,"erkl":"So steht es in Lucas Daten (Übung 2 TE 5); die drei Jahre sind nicht erfüllt (Ziff. I.2.2.1)."},{"text":"Weil Ihre Eltern schon Autos versichert haben, bekommen Sie die Einstufung für einen Zweitwagen.","kat":1,"erkl":"Ziff. I.2.2.2 zählt nur Pkw des Versicherungsnehmers oder seines Ehe- oder Lebenspartners; die Autos der Eltern zählen nicht."},{"text":"Ohne Sondereinstufung beginnt Ihr eigener Vertrag in Klasse 0 mit 85 %.","kat":0,"erkl":"Ziff. I.2.1: Ohne Sondereinstufung beginnt ein neuer Vertrag in Klasse 0 mit 85 %."}]},"kernpunkte":["SF ½ verlangt mindestens drei Jahre Fahrerlaubnis (Ziff. I.2.2.1)","Luca hat die Fahrerlaubnis erst seit Juli 2026","Ohne Sondereinstufung beginnt der Vertrag in Klasse 0 mit 85 % (Ziff. I.2.1)"],"muster":"Für SF ½ brauchen Sie die Fahrerlaubnis seit mindestens drei Jahren (Ziff. I.2.2.1); Sie haben sie erst seit Juli 2026. Ohne Sondereinstufung beginnt Ihr Vertrag deshalb in Klasse 0 mit 85 % (Ziff. I.2.1).","erkl":"Merkkasten TE 5: Klasse 0 mit 85 % – es sei denn, jede Voraussetzung einer Sondereinstufung nach Ziff. I.2.2 ist erfüllt."}]}},"karten":[{"te":1,"vorn":"Kfz-Haftpflicht (A.1)","hinten":"Zahlt Schäden, die Sie mit dem Fahrzeug anderen zufügen. Einzige Pflichtsparte der Kfz-Versicherung (§ 1 PflVG)."},{"te":1,"vorn":"Kasko (A.2)","hinten":"Schäden am eigenen Fahrzeug: Teilkasko z. B. Diebstahl oder Hagel, Vollkasko zusätzlich Unfall, auch selbst verschuldet."},{"te":1,"vorn":"Autoschutzbrief (A.3)","hinten":"Hilft unterwegs, z. B. mit Pannenhilfe und Abschleppen."},{"te":1,"vorn":"Fahrerschutz-Versicherung (A.4)","hinten":"Zahlt für den verletzten Fahrer selbst."},{"te":1,"vorn":"Kfz-Umweltschadenversicherung (A.5)","hinten":"Teil des Haftpflichtvertrags. Zahlt, wenn eine Behörde verlangt, dass ein Umweltschaden beseitigt wird."},{"te":1,"vorn":"Geltungsbereich ohne Vereinbarung","hinten":"Geografische Grenzen Europas und außereuropäische Gebiete der EU (Ziff. A.1.4.1, A.2.5.1, A.3.4, A.4.3)."},{"te":1,"vorn":"Internationale Versicherungskarte (IVK)","hinten":"Erweitert nur die Kfz-Haftpflicht auf die genannten, nicht durchgestrichenen Länder (Ziff. A.1.4.2)."},{"te":1,"vorn":"Kasko außerhalb von Europa und B","hinten":"Vorläufiger Schutz in der Kfz-Haftpflicht ab dem vereinbarten Zeitpunkt, spätestens ab dem Tag der Zulassung."},{"te":2,"vorn":"Grüne Karte in Europa und der EU","hinten":"Dort nur Nachweis; der Schutz besteht ohnehin (Ziff. A.1.4.1). In der EU genügt schon das Kennzeichen."},{"te":3,"vorn":"Direktanspruch","hinten":"Das Opfer kann sich direkt an den Kfz-Haftpflichtversicherer des Schädigers wenden (§ 115 Abs. 1 S. 1 Nr. 1 VVG)."},{"te":3,"vorn":"Gesamtschuldner","hinten":"Versicherer und Schädiger schulden je den ganzen Schaden; das Opfer erhält ihn nur einmal (§ 115 Abs. 1 S. 4 VVG)."},{"te":3,"vorn":"„Krankes“ Versicherungsverhältnis","hinten":"Innen leistungsfrei gegenüber dem Kunden, außen leistungspflichtig gegenüber dem Opfer (§ 117 Abs. 1 VVG)."},{"te":3,"vorn":"§ 117 Abs. 3 VVG","hinten":"Wer nur nach § 117 zahlt, zahlt bis zu den Mindestsummen und nachrangig gegenüber anderen Schadensversicherern und Sozialversicherungsträgern."},{"te":3,"vorn":"§ 3 PflVG","hinten":"Keine Verweisung, wenn das Fahrzeug nicht den Bau- und Betriebsvorschriften entsprach oder ein unberechtigter Fahrer bzw. ein Fahrer ohne Fahrerlaubnis fuhr."},{"te":3,"vorn":"Rückgriff beim Zahlungsverzug","hinten":"In voller Höhe (§ 116 Abs. 1 VVG)."},{"te":3,"vorn":"Rückgriffsgrenzen bei Pflichtverletzungen","hinten":"Beim Gebrauch (z. B. Alkohol) höchstens 5.000 € (Ziff. D.5.3); im Schadenfall 2.500 €, besonders schwer 5.000 € (Ziff. E.7.3, E.7.4)."},{"te":3,"vorn":"Nachhaftung","hinten":"Noch einen Monat ab der Anzeige an die Zulassungsstelle (§ 117 Abs. 2 VVG; Anzeige nach § 51 Abs. 1 FZV)."},{"te":3,"vorn":"Entschädigungsfonds – drei Fälle","hinten":"Fahrerflucht (Nr. 1), keine Versicherung (Nr. 2), Vorsatz (Nr. 3) – § 12 Abs. 1 S. 1 PflVG. Die Aufgaben erfüllt die Verkehrsopferhilfe e. V."},{"te":3,"vorn":"Fonds bei Fahrerflucht","hinten":"Sachschaden: nur der Teil über 500 € (Abzug). Fahrzeuge und Einrichtungen nur bei Tötung oder erheblicher Verletzung. Schmerzensgeld nur ,"intro":"Vor der Unfallstelle staut es sich. Bringen Sie den Rettungswagen nach rechts zur Unfallstelle. Ziehen Sie ein Fahrzeug oder tippen Sie es an und schieben Sie es mit den Pfeilen. Der Knopf „Tipp“ zeigt jederzeit den nächsten Zug.","fahrzeuge":[{"s":"RTW","h":true,"l":2,"r":2,"c":0},{"s":"MD","h":true,"l":3,"r":3,"c":0,"f":5},{"s":"HAL","h":false,"l":3,"r":2,"c":4,"f":1},{"s":"SK","h":false,"l":2,"r":1,"c":3,"f":2},{"s":"L","h":false,"l":2,"r":1,"c":2,"f":4},{"s":"MER","h":false,"l":2,"r":3,"c":3,"f":6},{"s":"WB","h":true,"l":3,"r":0,"c":0,"f":3},{"s":"ABI","h":false,"l":2,"r":4,"c":0,"f":2},{"s":"B","h":false,"l":2,"r":3,"c":5,"f":4},{"s":"PL","h":false,"l":2,"r":1,"c":5,"f":6},{"s":"DE","h":true,"l":2,"r":1,"c":0,"f":1}],"kuerzest":10,"abschluss":"Der Rettungswagen ist durch. Und wer zahlt dem Opfer den Schaden? Es kann sich direkt an den Kfz-Haftpflichtversicherer des Verursachers wenden (§ 115 Abs. 1 S. 1 Nr. 1 VVG). Hilft kein Versicherer – bei Fahrerflucht, fehlender Versicherung oder Vorsatz –, zahlt zuletzt der Entschädigungsfonds (§ 12 Abs. 1 S. 1 Nr. 1 bis 3 PflVG)."},"4":{"typ":"wortsuche","titel":"Wortsuche Ausland","intro":"Sechs Begriffe zum Unfall mit Auslandsbezug verstecken sich im Gitter: waagerecht, senkrecht oder schräg. Tippen Sie den ersten und dann den letzten Buchstaben eines Begriffs an.","gitter":["GZZFTVGLÜE","RFEIRGLGGM","ÜTNWTÜRKEI","NBTLRCKNTU","EÜRTUENOTT","KRATLHGUEC","AOLNSWFSME","RRRAUEESRB","TSUÜHANRPÖ","EIFDMIGLFN"],"woerter":[{"wort":"GRÜNEKARTE","anzeige":"Grüne Karte","erkl":"In Europa und der EU nur Nachweis; außerhalb erweitert erst sie den Schutz der Kfz-Haftpflicht (Ziff. A.1.4.2 AKB)."},{"wort":"BÜRO","anzeige":"Büro","erkl":"Deutsches Büro Grüne Karte: zuständig, wenn ein ausländisches Auto in Deutschland einen Unfall verursacht (§ 10 Abs. 1 AuslPflVG)."},{"wort":"SRB","anzeige":"SRB","erkl":"Schadenregulierungsbeauftragter: bearbeitet und reguliert den Schaden in Deutschland im Auftrag des ausländischen Versiche     return () => { clearTimeout(uhr); laeuft = false; document.removeEventListener('visibilitychange', verdeckt); };
  }

  // ------------------------------------------------------------ Hinweise
  function zeigeHilfe() {
    let sicher = false;
    const loesch = el('button', { class: 'btn', 'data-act': 'reset' }, 'Fortschritt löschen');
    const nein = el('button', { class: 'btn', hidden: true }, 'Abbrechen');
    loesch.addEventListener('click', () => {
      if (!sicher) { sicher = true; loesch.textContent = 'Ja, alles löschen'; loesch.classList.add('prim'); nein.hidden = false; return; }
      S = {}; try { localStorage.removeItem(KEY); } catch (e) { /* nichts */ }
      anwendenAnsicht(); geh('kompass');
    });
    nein.addEventListener('click', () => { sicher = false; loesch.textContent = 'Fortschritt löschen'; loesch.classList.remove('prim'); nein.hidden = true; });
    const thema = S.theme || '';
    anhaengen(view, [
      el('section', { class: 'karte' }, [el('p', { class: 'abschnitt-titel' }, 'So arbeiten Sie hier'), el('h2', { class: 'titel' }, 'Lernzentrale ' + D.ls.nr),
        el('ul', { style: 'margin:0;padding-left:1.2rem;display:grid;gap:.4rem' }, [
          el('li', {}, 'Kompass: Ihr Weg durch die Lernsituation. Je TE finden Sie Buchseiten, Proximus-Ziffern, Schritte zum Abhaken, den Merkkasten und die Musterzeile der Kundenakte.'),
          el('li', {}, 'Stationen: je TE ' + spanne() + ' Aufgaben mit Begründung und Fundstelle. Ab 80 % gibt es den Stempel. ' + (D.sperre_stationen ? 'Station, Blitzrunde und die Lösungen der Verständnisfragen einer TE öffnen sich, wenn Sie das Minigame der TE gelöst haben: Memory, Puzzle, Rettungsgasse, Wortsuche oder Fahrspiel.' : '')),
          el('li', {}, 'Vor jeder Station schätzen Sie sich ein, am Ende sehen Sie, ob es gepasst hat. Vor jedem „Prüfen“ sagen Sie, wie sicher Sie sind. Was Sie sicher und trotzdem falsch beantwortet haben, wiederholen Sie zuerst – dort sitzt ein Irrtum fest.'),
          el('li', {}, 'Kurzantworten und Erklärungen gehen in drei Schritten: Erst schreiben Sie frei. Dann prüft eine Zuordnung Ihr Wissen – nur sie zählt für Prozent und Stempel. Zuletzt vergleichen Sie Ihre Antwort mit der Musterantwort und haken ab, welche Kernpunkte Sie getroffen haben.'),
          el('li', {}, 'Karteikarten kommen mit wachsendem Abstand wieder (Fach 1 nach ' + tage(IV[0]) + ', Fach 2 nach ' + tage(IV[1]) + ', Fach 3 nach ' + tage(IV[2]) + '). Die Übersicht zeigt, was heute fällig ist.'),
          el('li', {}, 'Blitzrunden, Rechentrainer und „Akte schließen“: zum Wiederholen zwischen den Blockwochen.'),
          el('li', {}, 'Entry- und Exit-Quizze bleiben in Forms. Die Lernzentrale ersetzt sie nicht und wird nicht bewertet.')
        ])]),
      el('section', { class: 'karte' }, [el('p', { class: 'abschnitt-titel' }, 'Datenschutz'),
        el('p', {}, 'Keine Anmeldung, keine Namen, keine Übertragung. Ihr Fortschritt wird nur in diesem Browser auf diesem Gerät gespeichert. Die Lehrkraft sieht ihn nicht. In einem privaten Fenster ist er nach dem Schließen weg.'),
        el('div', { class: 'aktionen' }, [loesch, nein])]),
      el('section', { class: 'karte' }, [el('p', { class: 'abschnitt-titel' }, 'Ansicht'),
        el('div', { class: 'aktionen' }, [
          el('button', { class: 'btn', 'aria-pressed': String(!!S.gross), onclick: () => { S.gross = !S.gross; speichere(); anwendenAnsicht(); zeichne(); } }, S.gross ? 'Großansicht aus' : 'Großansicht für den Fernseher'),
          el('div', { class: 'seg', role: 'group', 'aria-label': 'Farbschema' }, [['', 'wie Gerät'], ['light', 'hell'], ['dark', 'dunkel']].map(o => el('button', { 'aria-pressed': String(thema === o[0]), onclick: () => { S.theme = o[0]; speichere(); anwendenAnsicht(); zeichne(); } }, o[1])))
        ])]),
      el('section', { class: 'karte' }, [el('p', { class: 'abschnitt-titel' }, 'Stand'), el('p', { class: 'leise klein' }, 'Stand ' + D.stand + ' · gebaut aus dem Datensatz der ' + D.ls.nr + ' (Stand ' + D.quelle_stand + ', Prüfwert ' + D.quelle_md5.slice(0, 8) + '). Rahmenhandlung: Proximus Versicherung AG, Agentur Wendler, Familie Brehmer – alle erfunden.')])
    ]);
  }
  function anwendenAnsicht() {
    document.documentElement.classList.toggle('gross', !!S.gross);
    if (S.theme) document.documentElement.setAttribute('data-theme', S.theme); else if (document.documentElement.dataset.lzTheme) document.documentElement.removeAttribute('data-theme');
    if (S.theme) document.documentElement.dataset.lzTheme = '1'; else delete document.documentElement.dataset.lzTheme;
  }

  // ------------------------------------------------------------ Start
  document.getElementById('k-eyebrow').textContent = 'Lernzentrale · ' + D.ls.nr + ' · LF 6';
  document.getElementById('k-titel').textContent = D.ls.titel;
  document.getElementById('k-meta').textContent = D.klasse + ' · Agentur Wendler, Halle-Neustadt · Stand ' + D.stand;
  document.getElementById('fuss').textContent = 'Lernzentrale ' + D.ls.nr + ' · Übungsangebot ohne Bewertung · Fortschritt nur in diesem Browser · Stand ' + D.stand;
  const reiter = document.getElementById('reiter');
  BEREICHE.forEach(b => reiter.appendChild(el('button', { type: 'button', data: { b: b[0] }, onclick: () => geh(b[0]) }, b[1])));
  anwendenAnsicht();
  const anker = (location.hash || '').slice(1);
  const mt = anker.match(/^te(\d+)$/);
  if (mt && TE[Number(mt[1])] && TE[Number(mt[1])].verfuegbar) geh('te', Number(mt[1]), true);
  else if (BEREICHE.some(b => b[0] === anker)) geh(anker, null, true);
  else geh('kompass', null, true);
})();
</script>
