<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
</head>
<body>
<title>Lernzentrale LS 06.1</title>
<style>
/* Layout: eine Kundenakte mit Registern – Kopfband in Petrol mit Stempeln je TE, Register darunter,
   Inhalt in einer Spalte (max. 54rem); Fälle als Aktennotizen auf Papier, Ziffern als Aktenzeichen. */
:root {
  --ground: #F1F4F3; --surface: #FFFFFF; --sunk: #E7ECEB; --ink: #172124; --ink2: #43565A; --muted: #637579;
  --line: #D2DBDA; --petrol: #223D42; --on-petrol: #F2F6F5; --petrol-soft: #A9C3C0;
  --mint: #3B7069; --on-mint: #FFFFFF; --mint-soft: #DCEAE7;
  --sand: #94763F; --paper: #FBF7EE; --paper-line: #E6DAC0;
  --ok: #276B4F; --ok-soft: #DCEEE5; --bad: #A0372A; --bad-soft: #F7E2DE; --warn: #7E6310; --warn-soft: #F4ECD1;
  --focus: #1F6670; --schatten: 0 1px 2px rgba(23,33,36,.06), 0 4px 14px rgba(23,33,36,.06);
  --f-ui: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif;
  --f-akte: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --f-mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Roboto Mono", "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0F1517; --surface: #172024; --sunk: #0B1012; --ink: #E3EAE9; --ink2: #B3C2C2; --muted: #8E9FA1;
    --line: #2A363A; --petrol: #132A2D; --on-petrol: #E3EAE9; --petrol-soft: #7FA6A1;
    --mint: #7BC0B4; --on-mint: #0C1A18; --mint-soft: #193532;
    --sand: #CFB27A; --paper: #1D211D; --paper-line: #3A3527;
    --ok: #74CDA2; --ok-soft: #14301F; --bad: #F2907E; --bad-soft: #3A1C17; --warn: #E3C35F; --warn-soft: #302810;
    --focus: #7BC0B4; --schatten: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0F1517; --surface: #172024; --sunk: #0B1012; --ink: #E3EAE9; --ink2: #B3C2C2; --muted: #8E9FA1;
  --line: #2A363A; --petrol: #132A2D; --on-petrol: #E3EAE9; --petrol-soft: #7FA6A1;
  --mint: #7BC0B4; --on-mint: #0C1A18; --mint-soft: #193532;
  --sand: #CFB27A; --paper: #1D211D; --paper-line: #3A3527;
  --ok: #74CDA2; --ok-soft: #14301F; --bad: #F2907E; --bad-soft: #3A1C17; --warn: #E3C35F; --warn-soft: #302810;
  --focus: #7BC0B4; --schatten: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
html.gross { font-size: 125%; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-ui); font-size: 1rem; line-height: 1.55; margin: 0; }
.lz *, .lz *::before, .lz *::after { box-sizing: border-box; }
.lz [hidden] { display: none !important; }
.wrap { max-width: 54rem; margin-inline: auto; padding-inline: 16px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.25; margin: 0; }
p { margin: 0; }
a { color: var(--mint); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Kopf */
.kopf { background: var(--petrol); color: var(--on-petrol); }
.kopf-in { padding-block: 1.25rem 1rem; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .75rem 1.25rem; align-items: end; }
.eyebrow { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--petrol-soft); font-weight: 600; }
.kopf h1 { font-size: clamp(1.35rem, 3.6vw, 1.9rem); font-weight: 750; letter-spacing: -.01em; margin-top: .2rem; }
.kopf-meta { color: var(--petrol-soft); font-size: .875rem; margin-top: .3rem; }
.stempelreihe { display: flex; gap: .35rem; flex-wrap: wrap; justify-content: flex-end; }
.stempel { width: 2.6rem; height: 2.6rem; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono);
  font-size: .62rem; line-height: 1.05; text-align: center; font-weight: 700; letter-spacing: .02em;
  border: 2px dashed color-mix(in srgb, var(--on-petrol) 30%, transparent); color: color-mix(in srgb, var(--on-petrol) 45%, transparent); }
.stempel.an { border: 2px solid var(--sand); color: var(--sand); background: color-mix(in srgb, var(--sand) 14%, transparent); transform: rotate(-9deg); }
.stempel.akte.an { border-radius: 8px; transform: rotate(6deg); }
@media (max-width: 560px) { .kopf-in { grid-template-columns: 1fr; } .stempelreihe { justify-content: flex-start; } }

/* Register */
.reiter { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.reiter-in { display: flex; gap: .25rem; overflow-x: auto; scrollbar-width: thin; padding-block: .4rem; }
.reiter button { flex: 0 0 auto; border: 0; background: transparent; padding: .5rem .75rem; border-radius: 8px; font-weight: 600; font-size: .9rem; color: var(--ink2); cursor: pointer; white-space: nowrap; }
.reiter button:hover { background: var(--sunk); }
.reiter button[aria-current="page"] { background: var(--mint-soft); color: var(--ink); box-shadow: inset 0 -3px 0 var(--mint); }

main.wrap { padding-block: 1.5rem 3rem; display: grid; gap: 1.25rem; outline: none; }
.fuss { padding-block: 1.25rem 2rem; color: var(--muted); font-size: .8rem; border-top: 1px solid var(--line); }

/* Bausteine */
.karte { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1.1rem 1.15rem; box-shadow: var(--schatten); min-width: 0; }
.karte > * + * { margin-top: .75rem; }
.abschnitt-titel { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
h2.titel { font-size: 1.35rem; font-weight: 750; letter-spacing: -.005em; }
h3 { font-size: 1.05rem; font-weight: 700; }
.leise { color: var(--ink2); }
.klein { font-size: .875rem; }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; }
.chip { display: inline-flex; align-items: center; gap: .3rem; padding: .15rem .55rem; border-radius: 999px; background: var(--sunk); color: var(--ink2); font-size: .78rem; font-weight: 600; }
.chip.te { background: var(--petrol); color: var(--on-petrol); }
.ziffer { font-family: var(--f-mono); font-size: .8rem; background: var(--paper); border: 1px solid var(--paper-line); color: var(--ink); padding: .1rem .45rem; border-radius: 4px; font-weight: 600; }
.notiz { background: var(--paper); border: 1px solid var(--paper-line); border-radius: 6px; padding: .85rem 1rem; font-family: var(--f-akte); font-size: 1.02rem; line-height: 1.5;
  background-image: repeating-linear-gradient(transparent 0 1.47rem, color-mix(in srgb, var(--paper-line) 55%, transparent) 1.47rem 1.53rem); }
.notiz .notiz-kopf { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--sand); margin-bottom: .35rem; font-weight: 700; }
details.situation { padding: .9rem 1.15rem; }
details.situation > summary { font-size: 1.02rem; }
.merke { border-left: 4px solid var(--mint); background: var(--mint-soft); padding: .8rem 1rem; border-radius: 0 8px 8px 0; }
.merke h3 { font-size: .95rem; }
.merke ul { margin: .4rem 0 0; padding-left: 1.1rem; }
.merke li + li { margin-top: .25rem; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: .6rem 1rem; border-radius: 9px; font-weight: 650; cursor: pointer; min-height: 2.75rem; display: inline-flex; align-items: center; justify-content: center; gap: .4rem; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--sunk); }
.btn.prim { background: var(--mint); color: var(--on-mint); border-color: var(--mint); }
.btn.prim:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.btn.klein { min-height: 2.2rem; padding: .35rem .7rem; font-size: .875rem; }
.aktionen { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.zurueck { background: none; border: 0; color: var(--mint); font-weight: 650; cursor: pointer; padding: .25rem 0; }

/* Lernpfad */
.pfad { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.pfad-woche { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-top: .75rem; }
.pfad-zeile { display: grid; grid-template-columns: 4.2rem minmax(0, 1fr) auto; gap: .75rem; align-items: center; padding: .7rem .85rem; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.pfad-zeile .std { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); }
.pfad-zeile.te { cursor: pointer; }
.pfad-zeile.te:hover { border-color: var(--mint); }
.pfad-zeile.gesperrt { opacity: .62; }
.pfad-zeile.leistung { border-color: var(--sand); background: var(--paper); }
.pfad-zeile.zwischen { border-style: dashed; background: transparent; }
.status { display: flex; gap: .35rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.punkt { font-size: .75rem; font-weight: 700; padding: .1rem .45rem; border-radius: 999px; background: var(--sunk); color: var(--ink2); white-space: nowrap; }
.punkt.ok { background: var(--ok-soft); color: var(--ok); }
.punkt.mittel { background: var(--warn-soft); color: var(--warn); }
.punkt.schwach { background: var(--bad-soft); color: var(--bad); }
@media (max-width: 520px) { .pfad-zeile { grid-template-columns: 3.2rem minmax(0, 1fr); } .pfad-zeile .status { grid-column: 2; justify-content: flex-start; } }

.raster { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: .75rem; }
.kachel { display: grid; gap: .45rem; align-content: start; text-align: left; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 1rem; min-width: 0; color: var(--ink); }
.kachel:hover { border-color: var(--mint); }
.kachel h3 { font-size: 1rem; }
.kachel .fuss-zeile { display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }

.liste-check { list-style: none; padding: 0; margin: 0; display: grid; gap: .3rem; }
.liste-check label { display: flex; gap: .6rem; align-items: flex-start; padding: .35rem .2rem; cursor: pointer; }
.liste-check label > span { min-width: 0; }
.frei-loesung, .liste-check, .fb, .frage, .zrow, .opt { hyphens: auto; -webkit-hyphens: auto; overflow-wrap: anywhere; }
.liste-check input { width: 1.15rem; height: 1.15rem; margin-top: .2rem; accent-color: var(--mint); flex: 0 0 auto; }
.liste-check .teil { font-weight: 700; color: var(--muted); font-size: .85rem; padding: .4rem .2rem 0; }
details { border: 1px solid var(--line); border-radius: 10px; padding: .6rem .9rem; background: var(--surface); }
details > summary { cursor: pointer; font-weight: 650; }
details[open] > summary { margin-bottom: .6rem; }
details p + p { margin-top: .6rem; }
.tabelle-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; vertical-align: top; padding: .45rem .55rem; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; }
td.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

/* Aufgaben */
.quiz-kopf { display: grid; gap: .5rem; }
.leiste { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.leiste > span { display: block; height: 100%; background: var(--mint); width: 0; transition: width .3s ease; }
.zaehler { display: flex; justify-content: space-between; gap: .75rem; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.frage { font-size: 1.08rem; font-weight: 650; }
.optionen { display: grid; gap: .45rem; border: 0; padding: 0; margin: 0; min-width: 0; }
.optionen legend { padding: 0; margin-bottom: .45rem; font-weight: 650; }
.opt { display: flex; gap: .65rem; align-items: flex-start; padding: .65rem .8rem; border: 1px solid var(--line); border-radius: 9px; cursor: pointer; background: var(--surface); }
.opt:hover { border-color: var(--mint); }
.opt input { margin-top: .25rem; accent-color: var(--mint); width: 1.05rem; height: 1.05rem; flex: 0 0 auto; }
.opt:has(input:checked) { border-color: var(--mint); background: var(--mint-soft); }
.opt.richtig { border-color: var(--ok); background: var(--ok-soft); }
.opt.falsch { border-color: var(--bad); background: var(--bad-soft); }
.opt.gesperrt { cursor: default; }
.zrow { border: 1px solid var(--line); border-radius: 10px; padding: .65rem .75rem; margin: 0; min-width: 0; }
.zrow legend { font-weight: 600; padding: 0; float: left; width: 100%; }
.zrow .wahl, .zrow .zfb { clear: both; }
.zrow .wahl { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .4rem; }
.zrow .wahl label { display: inline-flex; align-items: center; gap: .35rem; padding: .35rem .6rem; border: 1px solid var(--line); border-radius: 999px; font-size: .86rem; cursor: pointer; background: var(--surface); }
.zrow .wahl label:has(input:checked) { border-color: var(--mint); background: var(--mint-soft); font-weight: 650; }
.zrow .wahl input { accent-color: var(--mint); margin: 0; }
.zrow.richtig { border-color: var(--ok); background: var(--ok-soft); }
.zrow.falsch { border-color: var(--bad); background: var(--bad-soft); }
.zrow .zfb { font-size: .86rem; margin-top: .4rem; }
.eingabe { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.eingabe input[type="text"] { width: 12rem; max-width: 100%; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.eingabe input.richtig { border-color: var(--ok); background: var(--ok-soft); }
.eingabe input.falsch { border-color: var(--bad); background: var(--bad-soft); }
.eingabe input.halb { border-color: var(--warn); background: var(--warn-soft); }
.reihe { list-style: none; margin: 0; padding: 0; display: grid; gap: .4rem; }
.reihe li { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: .5rem; align-items: center; padding: .5rem .6rem; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
.reihe li .nr { font-family: var(--f-mono); color: var(--muted); font-weight: 700; }
.reihe li .pfeile { display: flex; gap: .25rem; }
.reihe li .pfeile button { width: 2.3rem; height: 2.3rem; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; cursor: pointer; }
.reihe li .pfeile button:hover { background: var(--sunk); }
.reihe.richtig li { border-color: var(--ok); }
.reihe.falsch li { border-color: var(--bad); }
.aussage { display: grid; gap: .3rem; }
.aussage .sprecher { font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--sand); font-weight: 700; }
.aussage blockquote { margin: 0; font-family: var(--f-akte); font-size: 1.12rem; }
.stufe { border-top: 1px dashed var(--line); padding-top: .9rem; }
.stufe-nr { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); font-weight: 700; letter-spacing: .06em; }
.fb { border-radius: 10px; padding: .85rem 1rem; display: grid; gap: .45rem; }
.fb.ok { background: var(--ok-soft); }
.fb.halb { background: var(--warn-soft); }
.fb.nein { background: var(--bad-soft); }
.fb .urteil { font-weight: 750; }
.fb.ok .urteil { color: var(--ok); }
.fb.halb .urteil { color: var(--warn); }
.fb.nein .urteil { color: var(--bad); }
.fb .weg { font-family: var(--f-mono); font-size: .86rem; }
.fb .ref { font-size: .82rem; color: var(--ink2); }
.fb .kalib { font-weight: 650; }
textarea { font: inherit; color: inherit; width: 100%; min-height: 6.5rem; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); resize: vertical; line-height: 1.5; }
textarea.kurz { min-height: 3.6rem; }
textarea[readonly] { background: var(--sunk); }
.sicherheit { border: 0; padding: 0; margin: .9rem 0 0; min-width: 0; }
.sicherheit legend { padding: 0; font-size: .9rem; font-weight: 650; color: var(--ink2); }
.sicherheit .wahl { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .4rem; }
.sicherheit .wahl label { display: inline-flex; align-items: center; gap: .35rem; padding: .35rem .7rem; border: 1px solid var(--line); border-radius: 999px; font-size: .86rem; cursor: pointer; background: var(--surface); }
.sicherheit .wahl label:has(input:checked) { border-color: var(--mint); background: var(--mint-soft); font-weight: 650; }
.sicherheit .wahl input { accent-color: var(--mint); margin: 0; }
.frei-loesung { margin-top: .35rem; border: 1px solid var(--paper-line); background: var(--paper); border-radius: 10px; padding: .85rem 1rem; display: grid; gap: .6rem; }
.frei-loesung .muster { font-family: var(--f-akte); font-size: 1.02rem; }
td.warn { background: var(--bad-soft); color: var(--bad); font-weight: 750; }
.faellig { padding: .55rem .8rem; border-radius: 8px; background: var(--mint-soft); }

/* Ergebnis */
.ergebnis-kopf { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1rem; align-items: center; }
.prozent { font-size: 2.6rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stufe-chip { display: inline-block; padding: .2rem .65rem; border-radius: 999px; font-weight: 700; font-size: .85rem; }
.stufe-chip.ok { background: var(--ok-soft); color: var(--ok); }
.stufe-chip.mittel { background: var(--warn-soft); color: var(--warn); }
.stufe-chip.schwach { background: var(--bad-soft); color: var(--bad); }
.auswertung { list-style: none; padding: 0; margin: 0; display: grid; gap: .3rem; }
.auswertung li { display: grid; grid-template-columns: 1.5rem minmax(0, 1fr) auto; gap: .5rem; font-size: .92rem; }
.auswertung .z { font-variant-numeric: tabular-nums; color: var(--muted); }
.i-ok { color: var(--ok); font-weight: 800; }
.i-no { color: var(--bad); font-weight: 800; }

/* Karteikarten */
.karteikarte { min-height: 13rem; display: grid; align-content: center; gap: .75rem; text-align: center; padding: 1.5rem; border-radius: 14px; border: 1px solid var(--paper-line); background: var(--paper); }
.karteikarte .vorn { font-size: 1.35rem; font-weight: 750; font-family: var(--f-akte); }
.karteikarte .hinten { font-size: 1.05rem; text-align: left; border-top: 1px dashed var(--paper-line); padding-top: .9rem; }
.faecher { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
.fach { border: 1px solid var(--line); border-radius: 10px; padding: .6rem; text-align: center; background: var(--surface); }
.fach b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.fach span { font-size: .78rem; color: var(--muted); }
.filter { display: flex; flex-wrap: wrap; gap: .35rem; }
.filter button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: .3rem .75rem; cursor: pointer; font-weight: 600; font-size: .85rem; }
.filter button[aria-pressed="true"] { background: var(--petrol); color: var(--on-petrol); border-color: var(--petrol); }

/* Blitzrunde */
.blitz-buehne { display: grid; gap: 1rem; }
.blitz-karte { min-height: 9rem; display: grid; place-content: center; gap: .55rem; text-align: center; padding: 1.25rem; border-radius: 14px; background: var(--paper); border: 1px solid var(--paper-line); }
.blitz-karte .ort { font-family: var(--f-akte); font-size: clamp(1.3rem, 4.5vw, 1.8rem); font-weight: 700; }
.blitz-opt { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .5rem; }
.blitz-opt .btn { min-height: 3.4rem; justify-content: flex-start; text-align: left; }
.blitz-opt .btn kbd { font-family: var(--f-mono); font-size: .75rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 .3rem; color: var(--muted); }
.uhr { font-family: var(--f-mono); font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.uhr.knapp { color: var(--bad); }
.letzte { font-size: .9rem; padding: .55rem .8rem; border-radius: 8px; min-height: 2.6rem; }
.letzte.ok { background: var(--ok-soft); }
.letzte.nein { background: var(--bad-soft); }

/* Rechner, Akte */
.seg { display: flex; flex-wrap: wrap; gap: .35rem; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: .45rem .8rem; cursor: pointer; font-weight: 650; }
.seg button[aria-pressed="true"] { background: var(--mint); color: var(--on-mint); border-color: var(--mint); }
.schritte-tab { display: grid; gap: .55rem; }

<script id="lz-daten" type="application/json">{"id":"ls061","stand":"05.10.2026","datei":"KVF_LF06_LS06.1_Lernzentrale","klasse":"KVF25 · 2. Ausbildungsjahr","sperre_stationen":true,"quelle_md5":"f649f24b1f4a2ccc54154eb2ca741068","quelle_stand":"05.10.2026","ls":{"nr":"LS 06.1","titel":"Kfz versichern – die Kundenakte Brehmer","situation":["Sie sind Auszubildende oder Auszubildender der Proximus Versicherung AG und in der Agentur Katrin Wendler in Halle-Neustadt eingesetzt. Frau Wendler betreut vor allem Kunden in der Kraftfahrtversicherung.","Familie Brehmer aus Halle ist seit Jahren Kunde der Agentur. Hendrik Brehmer kauft zum 1. November ein neues Auto und fährt im Winter sein Motorrad nicht. Sabine Brehmer plant eine Autoreise ins Ausland. Sohn Luca ist 18 und hat seit Juli den Führerschein; er soll den Kleinwagen seiner Großmutter Ingrid übernehmen, die nicht mehr fahren will.","Frau Wendler legt für die Familie eine Kundenakte an. Sie soll zeigen, was gesetzlich vorgeschrieben ist, wie die Proximus die Fahrzeuge einstuft und was passiert, wenn trotzdem ein Unfall geschieht.","Am Ende der Lernsituation beraten Sie die Brehmers selbst: mit Ziffern aus Proximus 5, mit Beträgen und mit einer Empfehlung."],"produkt":"Ihre Kundenakte (die Seite nach dem Fahrplan): eine Zeile je TE mit Prüffrage, Ziffer oder Norm, Ergebnis für die Brehmers und Merksatz. In Woche 4 wird daraus ein Beratungsvermerk, den das Nachbartandem an neuen Fällen abnimmt.","leitfragen":["Welche Kraftfahrtversicherungen gibt es, und wo gilt der Schutz? (TE 1)","Wer muss sein Fahrzeug versichern, mit welcher Summe, und wie weist man den Schutz nach? (TE 2)","Wie schützt das Gesetz einen Geschädigten – auch wenn der Versicherer nicht zahlen müsste oder der Schädiger flüchtet? (TE 3)","Wer hilft nach einem Unfall im Ausland? (TE 4)","Wie berechnet die Proximus den Beitrag für ein Auto? (TE 5)","Was geschieht mit dem Schadenfreiheitsrabatt, wenn Luca den Vertrag der Großmutter übernimmt oder einen Unfall baut? (TE 6)","Ab wann besteht Schutz, und was gilt, wenn ein Fahrzeug vorübergehend stillgelegt wird? (TE 7)"],"wochen":{"3":"05.–09.10.2026","4":"09.–13.11.2026"},"zeitplan":[{"woche":3,"std":"1","block":"TE 1 Kraftfahrtversicherung im Überblick (mit Einstieg in die Lernsituation)","art":"Phase I"},{"woche":3,"std":"2–3","block":"TE 2 Versicherungspflicht, Deckungssummen und Nachweis","art":"Phase I"},{"woche":3,"std":"4–6","block":"TE 3 Schutz des Verkehrsopfers","art":"Phase I"},{"woche":3,"std":"7","block":"TE 4 Unfall im Ausland","art":"Phase I"},{"woche":3,"std":"8–9","block":"TE 5 Tarif und Schadenfreiheitsrabatt; danach zu Hause: Selbstlernpaket, PUB 1 und Abschlussquiz","art":"Phase I"},{"woche":4,"std":"10–11","block":"TE 6 Schadenverlauf übernehmen und Rückstufung","art":"Phase I"},{"woche":4,"std":"12–13","block":"TE 7 Vorläufige Deckung und Stilllegung","art":"Phase I"},{"woche":4,"std":"14","block":"Wiederholungsquiz, dann Kundenakte Brehmer im Tandem","art":"Phase II"},{"woche":4,"std":"15","block":"Fragen zur PUB 1 (15 Min.), dann UB 1 (30 Min.) über TE 1 bis TE 5","art":"Leistung"},{"woche":4,"std":"16","block":"Beratungsvermerk fertigstellen, Kreuzabnahme","art":"Phase II"},{"woche":4,"std":"17","block":"Abnahme durch das Nachbartandem an drei neuen Fällen, Rückblick","art":"Phase III"}],"leistung":{"art":"UB 1","woche":"4","lage":"UB 1 in Woche 4 (KW 46), Std. 15: 15 Min. Fragen zur PUB 1, dann UB 1 (30 Min.) über TE 1 bis TE 5"},"kundenakte_seite":"S. 6"},"te":[{"nr":1,"titel":"Kraftfahrtversicherung im Überblick","zyklus":"kurz","minuten":45,"std":"1","woche":3,"verfuegbar":true,"leitfrage":"Welche Kraftfahrtversicherungen gibt es, und wo gilt der Schutz?","anlass":"Frau Wendler legt heute die Kundenakte Brehmer an. Bevor Sie über Pflicht, Preis und Schadenfall sprechen, brauchen Sie den Überblick: Welche Sparten der Kfz-Versicherung gibt es, wessen Schaden trägt jede – und gilt der Schutz auch dort, wohin Sabine Brehmer im nächsten Sommer mit dem Auto fahren will?","ziel":"Sie ordnen einem Schaden die Sparte der Kfz-Versicherung mit der Ziffer der AKB 2021 zu und prüfen für ein Reiseziel in zwei Schritten, welche Sparten dort gelten und wie sich der Schutz erweitern lässt.","lehrbuch":"S. 21–22 oben, S. 24 unten–25 (8. Aufl.: S. 448–449, 451–452)","abschnitt":"A 1.2.1 „Versicherungsarten“ und A 1.3 „Geltungsbereich der Kraftfahrtversicherung“","skriptseiten":"S. 8–11","proximus":["Einleitung (Versicherungsarten)","Ziff. A.1.4.1, A.1.4.2","Ziff. A.2.5.1, A.2.5.2","Ziff. A.3.4","Ziff. A.4.3","Ziff. A.5.4","in Übung 1: Ziff. A.1.1.1, A.1.5.3, A.2.3.2, A.3.5.3, A.4.1"],"schritte":["Einstieg in die Lernsituation","Entry-Quiz in der Stunde (einmal, zählt nicht)","Lehrbuch lesen: S. 21–22, 24–25 (8. Aufl.: S. 448–452)","Skripttext: Zwei Fragen an jeden Fall: Welche Sparte? Welches Land?","Verständnisfragen beantworten","Mit Proximus 5 arbeiten","Übung 1 · Kundenakte Brehmer · Welche Sparte? Welches Land?","Lehrbuchaufgabe · Lernkontrolle zu A 1, Aufgabe 2 (Pflichtkern)","Exit-Quiz (wiederholbar)","Kundenakte: Zeile TE 1 eintragen"],"merke":[{"kopf":"Erst die Sparte, dann das Land","zeilen":["Wessen Schaden? Der eines anderen: Haftpflicht. Das eigene Auto: Kasko. Hilfe unterwegs: Schutzbrief. Der verletzte Fahrer: Fahrerschutz.","Europa und die außereuropäischen Gebiete der EU: Alle Sparten gelten.","Außerhalb: Haftpflicht nur mit IVK, Kasko nur mit Vereinbarung, Schutzbrief und Fahrerschutz gar nicht."]}],"skript":[{"titel":"Zwei Fragen an jeden Fall: Welche Sparte? Welches Land?","absaetze":["Die AKB 2021 fassen fünf Versicherungsarten unter dem Namen Kfz-Versicherung zusammen. Ordnen Sie jede nach der Frage, wessen Schaden sie trägt. Die Kfz-Haftpflicht (A.1) zahlt Schäden, die Sie mit dem Fahrzeug anderen zufügen. Die Kasko (A.2) zahlt Schäden am eigenen Fahrzeug: die Teilkasko etwa bei Diebstahl oder Hagel, die Vollkasko zusätzlich bei einem Unfall, auch einem selbst verschuldeten. Der Autoschutzbrief (A.3) hilft unterwegs, zum Beispiel mit Pannenhilfe und Abschleppen. Die Fahrerschutz-Versicherung (A.4) zahlt für den verletzten Fahrer selbst. Die Kfz-Umweltschadenversicherung (A.5) gehört zum Haftpflichtvertrag. Sie zahlt, wenn eine Behörde verlangt, dass ein Umweltschaden beseitigt wird.","Pflicht ist nur die Kfz-Haftpflicht (§ 1 PflVG). Alle anderen Sparten wählt der Kunde. Jede Sparte ist ein rechtlich selbstständiger Vertrag. Kündigt ein Kunde die Teilkasko, bleibt die Haftpflicht bestehen (Ziff. G.4.1).","Den Geltungsbereich prüfen Sie in zwei Schritten. Erstens: Liegt der Ort in den geografischen Grenzen Europas oder in einem außereuropäischen Gebiet der EU, etwa auf den Kanaren oder auf Madeira? Dann gelten Haftpflicht, Kasko, Schutzbrief und Fahrerschutz (Ziff. A.1.4.1, A.2.5.1, A.3.4, A.4.3). Wo Europa endet, ist nicht überall klar; im Zweifel fragt die Agentur bei der Proximus nach. Zweitens: Liegt der Ort außerhalb, fragen Sie je Sparte nach einer Erweiterung. Die Haftpflicht gilt dann nur, wenn der Kunde eine Internationale Versicherungskarte (IVK) erhalten hat und das Land darauf nicht durchgestrichen ist (Ziff. A.1.4.2). Die Kasko gilt nur mit einer gesonderten Vereinbarung (Ziff. A.2.5.2). Für Schutzbrief und Fahrerschutz sehen die AKB keine Erweiterung vor.","Im Besuchsland richtet sich die Haftpflicht nach dem Umfang, den das Land vorschreibt, mindestens aber nach dem eigenen Vertrag (Ziff. A.1.4.1 Satz 2). Die KfzPflVV verlangt als Untergrenze nur den in Deutschland vorgeschriebenen Umfang (§ 1 Abs. 1 KfzPflVV). Die AKB geben also mehr: Ihre Untergrenze ist der eigene Vertrag."]}],"vf":[{"frage":"Welche fünf Versicherungsarten nennen die AKB 2021, und wessen Schaden trägt jede?","loesung":"Kfz-Haftpflicht (A.1): Schäden, die mit dem Fahrzeug anderen zugefügt werden. Kasko (A.2), als Teil- oder Vollkasko: Schäden am eigenen Fahrzeug. Autoschutzbrief (A.3): Hilfe unterwegs als Service oder Kostenerstattung. Fahrerschutz-Versicherung (A.4): Personenschaden des berechtigten Fahrers. Kfz-Umweltschadenversicherung (A.5): öffentlich-rechtliche Ansprüche auf Sanierung eines Umweltschadens; sie ist Teil des Haftpflichtvertrags."},{"frage":"Frau Brehmer will die Teilkasko für ihr Auto kündigen. Ist das Auto danach noch haftpflichtversichert? Begründen Sie.","loesung":"Ja. Die Sparten sind jeweils rechtlich selbstständige Verträge (Einleitung der AKB 2021, S. 22 oben). Die Kündigung eines Vertrags berührt die anderen nicht (Ziff. G.4.1)."},{"frage":"Nennen Sie die beiden Gebiete, in denen alle Sparten ohne besondere Vereinbarung gelten, und je ein Beispiel für ein außereuropäisches Gebiet der EU (S. 25; 8. Aufl.: S. 451–452).","loesung":"Die geografischen Grenzen Europas und die außereuropäischen Gebiete, die zur EU gehören (Ziff. A.1.4.1, A.2.5.1, A.3.4, A.4.3). Beispiele: die Kanarischen Inseln, Madeira, die Azoren, Martinique, Guadeloupe, Französisch-Guayana, Réunion, Mayotte, Saint-Martin."},{"frage":"Ein Kunde hat eine IVK. Für welche Sparte erweitert sie den Geltungsbereich, und für welche nicht?","loesung":"Die IVK erweitert nur die Kfz-Haftpflicht auf die dort genannten, nicht durchgestrichenen Länder (Ziff. A.1.4.2). Die Kasko braucht eine gesonderte Vereinbarung (Ziff. A.2.5.2). Für Schutzbrief und Fahrerschutz sehen die AKB keine Erweiterung vor (Ziff. A.3.4, A.4.3)."}],"akte":{"pruef":"Wessen Schaden trägt welche Sparte – und gilt sie am Reiseziel?","ergebnis":"Pflicht ist nur die Kfz-Haftpflicht. Für Kappadokien braucht Sabine eine IVK (A.1.4.2) und eine Kasko-Vereinbarung (A.2.5.2); ihr Schutzbrief gilt dort nicht.","norm":"§ 1 PflVG; Ziff. A.1.4, A.2.5, A.3.4 AKB","merksatz":"Erst die Sparte, dann das Land: Europa und EU-Gebiete sind gedeckt, alles andere nur mit IVK oder Vereinbarung."},"exit":{"code":"LF6_LS061_TE1X","url":"https://forms.cloud.microsoft/e/kgiSGP3NQb"}},{"nr":2,"titel":"Versicherungspflicht, Deckungssummen und Nachweis","zyklus":"voll","minuten":90,"std":"2–3","woche":3,"verfuegbar":true,"leitfrage":"Wer muss sein Fahrzeug versichern, mit welcher Summe, und wie weist man den Schutz nach?","anlass":"Hendrik Brehmer holt seinen neuen Pkw ab. Weil die Zulassungsstelle am Wochenende geschlossen ist, will er ihn am Freitag, 30.10.2026, zulassen und ab Sonntag, 01.11.2026, fahren. Er fragt Frau Wendler: „Was braucht die Zulassungsstelle von Ihnen, und reicht die gesetzliche Mindestdeckung?“ Luca sitzt dabei. Er soll bald den Kleinwagen seiner Großmutter fahren und hat eigene Fragen. Heute klären Sie, wer versichern muss, welche Summen gelten und wie der Schutz nachgewiesen wird.","ziel":"Sie prüfen die Versicherungspflicht nach § 1 PflVG an drei Merkmalen, nennen die Mindestversicherungssummen je Schadensfall, vergleichen sie mit der Deckung der Proximus und erklären, wie der Schutz bei der Zulassung (eVB) und im Ausland (Grüne Karte) nachgewiesen wird – jeweils mit Norm oder Ziffer.","lehrbuch":"S. 27–29 und S. 34 unten bis S. 36 oben (8. Aufl.: S. 453, 457–458)","abschnitt":"A 2.1 „Bedeutung und Umfang der Versicherungspflicht“: A 2.1.1, A 2.1.6 und A 2.1.7","skriptseiten":"S. 12–17","proximus":["Ziff. A.1.1.1","Ziff. A.1.2","Ziff. A.1.3.1 bis A.1.3.3","Ziff. A.1.4","Ziff. B.2.1","Antrag Kraftfahrt: Deckungsumfang Haftpflicht"],"schritte":["Entry-Quiz in der Stunde (einmal, zählt nicht)","Lehrbuch lesen: S. 27–29 und S. 34 unten bis S. 36 oben (8. Aufl.: S. 453, 457–458)","Skripttext: Drei Prüffragen: Muss versichert werden? Mit welcher Summe? Wie wird es nachgewiesen?","Verständnisfragen beantworten","Mit Proximus 5 arbeiten","Lehrbuchaufgaben · Lernkontrollen zu A 2, Nr. 1 bis 3 (Pflichtkern)","Lehrbuchaufgaben · Lernkontrollen zu A 2, Nr. 11 und 12 (Pflichtkern)","Übung 1 · Hendriks Neuwagen zum 01.11.2026","Übung 2 · Wer hat recht? Fünf Sätze bei den Brehmers","Exit-Quiz (wiederholbar)","Kundenakte: Zeile TE 2 eintragen"],"merke":[{"kopf":"Pflicht – Summe – Nachweis","zeilen":["Pflicht: Halter + Fahrzeug nach § 1a PflVG + Standort im Inland (§ 1 PflVG).","Summe: 7.500.000 € · 1.300.000 € · 50.000 € je Schadensfall, nicht je Person.","Nachweis: bei der Zulassung die eVB-Nummer. Die Grüne Karte ist in Europa und der EU nur Nachweis; außerhalb erweitert erst sie den Schutz (Ziff. A.1.4.2 AKB)."]}],"skript":[{"titel":"Drei Prüffragen: Muss versichert werden? Mit welcher Summe? Wie wird es nachgewiesen?","absaetze":["In der Agentur prüfen Sie die Versicherungspflicht in drei Fragen, immer in derselben Reihenfolge. Frage 1: Besteht eine Pflicht? § 1 PflVG verlangt drei Merkmale. Es gibt einen Halter, also die Person, die das Fahrzeug auf eigene Rechnung nutzt und darüber bestimmt. Das ist meist, aber nicht immer, der Eigentümer. Das Fahrzeug fällt unter § 1a Abs. 1 Nr. 1 PflVG, zum Beispiel ein Pkw, ein E-Scooter oder ein Anhänger. Und es hat seinen Standort im Inland. Liegen alle drei Merkmale vor, muss der Halter eine Haftpflichtversicherung abschließen und aufrechterhalten. Geschützt ist dann nicht nur er, sondern auch der Eigentümer und der Fahrer (§ 4 Abs. 3 PflVG, Ziff. A.1.2 AKB).","Den Gebrauch versteht das Gesetz weit (§ 1a Abs. 3 PflVG). Auch wer aussteigt, auslädt oder das Auto nur abstellt, gebraucht es, auf der Straße ebenso wie auf dem eigenen Hof.","Frage 2: Mit welcher Summe? Die Anlage zu § 4 Abs. 2 PflVG schreibt Mindestsummen je Schadensfall vor: 7.500.000 € für Personenschäden, 1.300.000 € für Sachschäden und 50.000 € für reine Vermögensschäden. „Je Schadensfall“ heißt: Alle Verletzten eines Unfalls teilen sich die 7.500.000 €. Ein reiner Vermögensschaden hängt weder an einem Personen- noch an einem Sachschaden. Der Verdienstausfall eines Verletzten gehört deshalb zum Personenschaden. Im Antrag zur Kraftfahrtversicherung in Proximus 5 wählt der Kunde zwischen der gesetzlichen Mindestdeckung und 100 Mio. € pauschal, dabei höchstens 8 Mio. € je verletzter oder getöteter Person. Reicht die Summe nicht, muss der Kunde für den Rest selbst einstehen (Ziff. A.1.3.3 AKB).","Frage 3: Wie wird der Schutz nachgewiesen? Ohne Kfz-Haftpflicht lässt die Zulassungsbehörde kein Fahrzeug zu (§ 3 Abs. 1 S. 2 Nr. 2 FZV). Den Nachweis erbringt eine Versicherungsbestätigung (§ 49 Abs. 1 FZV). Die Proximus übermittelt sie elektronisch über eine Gemeinschaftseinrichtung der Versicherer (§ 49 Abs. 2 FZV); der Kunde nennt bei der Zulassung nur die eVB-Nummer. Die Proximus muss die Bestätigung bei Beginn des Schutzes übermitteln, darf sie aber von der Zahlung der ersten Prämie abhängig machen (§ 5b Abs. 1 PflVG). Nennt sie die eVB-Nummer, besteht in der Kfz-Haftpflicht vorläufiger Schutz ab dem vereinbarten Zeitpunkt, spätestens ab dem Tag der Zulassung (Ziff. B.2.1 AKB). Mehr zur vorläufigen Deckung folgt in TE 7.","Im Ausland weist die Internationale Versicherungskarte, die Grüne Karte, den Schutz nach. In Europa und der EU ist sie nur Nachweis: Dort gilt der Schutz ohnehin (Ziff. A.1.4.1 AKB), und in der EU und einigen weiteren Staaten gilt schon das Kennzeichen als Nachweis. Für die nichteuropäischen Länder auf der Karte erweitert erst die ausgehändigte Karte den Schutz (Ziff. A.1.4.2 AKB). Ausländische Fahrer in Deutschland weisen den Schutz sonst mit der Grünen Karte oder einer Grenzversicherung nach (§ 13 AuslPflVG)."]}],"vf":[{"frage":"Nennen Sie die drei Merkmale des § 1 PflVG und die Pflicht, die daraus folgt.","loesung":"Halter eines Fahrzeugs im Sinne des § 1a Abs. 1 Nr. 1 PflVG mit regelmäßigem oder gewöhnlichem Standort im Inland. Er muss eine Haftpflichtversicherung für sich, den Eigentümer, den Fahrer und weitere Personen nach § 4 Abs. 3 PflVG abschließen und aufrechterhalten."},{"frage":"Luca parkt auf dem Parkplatz eines Supermarkts. Beim Aussteigen schlägt seine Tür gegen ein anderes Auto. Ist das ein Schaden durch den Gebrauch des Fahrzeugs? Begründen Sie mit Norm.","loesung":"Ja. Gebrauch ist jede Verwendung als Beförderungsmittel, unabhängig vom Gelände und davon, ob sich das Fahrzeug bewegt (§ 1a Abs. 3 PflVG). Das Aussteigen gehört ausdrücklich dazu (Ziff. A.1.1.1 AKB; Lehrbuch S. 29)."},{"frage":"Erklären Sie „je Schadensfall“ an einem Unfall mit drei Verletzten und gesetzlicher Mindestdeckung.","loesung":"Für alle drei Verletzten zusammen stehen höchstens 7.500.000 € zur Verfügung, nicht 7.500.000 € für jeden (Anlage zu § 4 Abs. 2 Nr. 1 a PflVG)."},{"frage":"Was ist ein reiner Vermögensschaden? Ist der Verdienstausfall eines Verletzten ein reiner Vermögensschaden?","loesung":"Ein Vermögensschaden, der weder mittelbar noch unmittelbar mit einem Personen- oder Sachschaden zusammenhängt (Anlage zu § 4 Abs. 2 Nr. 1 c PflVG; Ziff. A.1.1.1 c AKB). Der Verdienstausfall folgt aus der Verletzung; er gehört zum Personenschaden, nicht zu den 50.000 €."},{"frage":"Was ist die eVB-Nummer, und wer übermittelt die Versicherungsbestätigung an die Zulassungsbehörde?","loesung":"Die Nummer der elektronischen Versicherungsbestätigung. Die Bestätigung selbst übermittelt der Versicherer über eine Gemeinschaftseinrichtung der Versicherer elektronisch oder hält sie zum Abruf bereit (§ 49 Abs. 2 FZV); der Kunde nennt nur die Nummer (Lehrbuch S. 35)."}],"akte":{"pruef":"Muss das Fahrzeug versichert werden, mit welcher Summe, und wie wird der Schutz nachgewiesen?","ergebnis":"Hendriks Neuwagen: versicherungspflichtig, Schutz spätestens ab der Zulassung am 30.10.2026, eVB-Nummer an die Zulassungsstelle; Empfehlung 100 Mio. € pauschal statt Mindestdeckung.","norm":"§ 1, § 1a PflVG · Anlage zu § 4 Abs. 2 PflVG · § 49 FZV · Ziff. A.1.3, B.2.1 AKB","merksatz":"Der Halter muss versichern; die Mindestsumme gilt je Unfall, nicht je Person."},"exit":{"code":"LF6_LS061_TE2X","url":"https://forms.cloud.microsoft/e/uwAqwfw3vB"}},{"nr":3,"titel":"Schutz des Verkehrsopfers","zyklus":"voll","minuten":135,"std":"4–6","woche":3,"verfuegbar":true,"leitfrage":"Wie schützt das Gesetz einen Geschädigten – auch wenn der Versicherer nicht zahlen müsste oder der Schädiger flüchtet?","anlass":"Frau Wendler bespricht mit Hendrik Brehmer die Kundenakte. Er fragt: „Was passiert eigentlich, wenn Luca einen Unfall baut und mit dem Beitrag im Rückstand ist? Und wer zahlt, wenn uns nachts jemand das Auto anfährt und verschwindet?“ Bevor Sie antworten, brauchen Sie drei Dinge: wann sich ein Opfer direkt an den Versicherer wenden kann, wann der Versicherer trotzdem zahlen muss und was er sich danach zurückholt – und wann der Entschädigungsfonds einspringt.","ziel":"Sie prüfen in drei Schritten, wer einem Unfallopfer zahlt: Direktanspruch gegen den Versicherer, Leistungspflicht trotz Leistungsfreiheit oder nach Vertragsende mit Rückgriff beim Kunden, Entschädigungsfonds mit seinen Grenzen – jeweils mit Norm oder Ziffer.","lehrbuch":"S. 36 unten bis S. 45 (8. Aufl.: S. 459–467)","abschnitt":"A 2.2 „Vorschriften zum Schutz des Verkehrsopfers“, A 2.2.1 bis A 2.2.4, dazu „Auf einen Blick zu A 2.2“","skriptseiten":"S. 18–26","proximus":["Ziff. A.1.5.1","Ziff. A.2.2 und A.2.3.2","Ziff. C.2.3 und C.2.4","Ziff. C.5","Ziff. D.2.1 und D.5.3","Ziff. E.1.1, E.7.3 und E.7.4"],"schritte":["Entry-Quiz in der Stunde (einmal, zählt nicht)","— Teil A · Außen zahlt der Versicherer, innen holt er zurück","Lehrbuch lesen: S. 36 unten bis S. 40 (8. Aufl.: S. 459–463)","Skripttext: Drei Ansprüche, zwei Verhältnisse, eine Frist","Verständnisfragen beantworten","Mit Proximus 5 arbeiten","Lehrbuchaufgaben · Lernkontrollen zu A 2, Nr. 14 bis 16 (Pflichtkern)","Übung 1 · Luca ist mit dem Beitrag im Rückstand","— Teil B · Wenn kein Versicherer zahlt: der Entschädigungsfonds","Lehrbuch lesen: S. 41 bis S. 45 (8. Aufl.: S. 463–467)","Skripttext: Der Entschädigungsfonds zahlt zuletzt","Verständnisfragen beantworten","Übung 2 · Wer hat recht? Fahrerflucht vor dem Haus der Brehmers","Lehrbuchaufgaben · Lernkontrollen zu A 2, Nr. 17 bis 20 (Pflichtkern)","Exit-Quiz (wiederholbar)","Kundenakte: Zeile TE 3 eintragen"],"merke":[{"kopf":"Außen zahlt der Versicherer, innen holt er zurück","zeilen":["Direktanspruch: § 115 Abs. 1 S. 1 Nr. 1 VVG.","Leistungsfrei gegenüber dem Kunden heißt nicht leistungsfrei gegenüber dem Opfer (§ 117 Abs. 1 VVG) – aber nur bis zu den Mindestsummen und nachrangig (§ 117 Abs. 3 VVG).","Rückgriff beim Zahlungsverzug in voller Höhe, bei Pflichtverletzungen höchstens 5.000 € oder 2.500 € (Ziff. D.5.3, E.7.3, E.7.4 AKB).","Nach Vertragsende: Nachhaftung bis einen Monat nach der Anzeige (§ 117 Abs. 2 VVG)."]},{"kopf":"Kein Versicherer? Dann der Fonds – aber zuletzt","zeilen":["Fahrerflucht, keine Versicherung, Vorsatz: § 12 Abs. 1 S. 1 Nr. 1 bis 3 PflVG.","Der Fonds zahlt nur, was sonst niemand zahlt.","Bei Fahrerflucht: Sachschaden nur über 500 €; Auto und Einrichtungen nur, wenn ein Mensch getötet oder erheblich verletzt wurde."]}],"skript":[{"titel":"Drei Ansprüche, zwei Verhältnisse, eine Frist","absaetze":["Nach einem Unfall stehen sich drei Beteiligte gegenüber: das Opfer, der Schädiger und dessen Kfz-Haftpflichtversicherer. Das Opfer hat einen Haftungsanspruch gegen den Schädiger. Der Schädiger hat als Versicherungsnehmer einen Deckungsanspruch gegen seinen Versicherer. Und das Opfer darf sich direkt an diesen Versicherer wenden: Das ist der Direktanspruch nach § 115 Abs. 1 S. 1 Nr. 1 VVG. Versicherer und Schädiger haften als Gesamtschuldner. Jeder schuldet den ganzen Schaden, das Opfer bekommt ihn aber nur einmal.","Trennen Sie immer innen und außen. Innen steht der Vertrag zwischen der Proximus und ihrem Kunden, außen steht das Opfer. Zahlt ein Kunde seinen Folgebeitrag trotz qualifizierter Mahnung nicht, hat er keinen Versicherungsschutz (Ziff. C.2.3 AKB). Das Opfer bekommt trotzdem Geld, denn die Leistungspflicht ihm gegenüber bleibt bestehen (§ 117 Abs. 1 VVG). Dann zahlt die Proximus aber nur bis zu den Mindestversicherungssummen und nur, soweit kein anderer Schadensversicherer oder Sozialversicherungsträger zahlt (§ 117 Abs. 3 VVG). Danach holt sie sich das Geld beim Kunden zurück (§ 116 Abs. 1 VVG). Das heißt Rückgriff oder Regress.","Wie weit der Rückgriff reicht, hängt vom Grund ab. Beim Zahlungsverzug gibt es keine Obergrenze. Bei Pflichtverletzungen setzt die KfzPflVV Grenzen: bei Pflichten beim Gebrauch, etwa einer Fahrt nach Alkohol, höchstens 5.000 € (Ziff. D.5.3 AKB), bei Pflichten im Schadenfall höchstens 2.500 €, in besonders schweren Fällen 5.000 € (Ziff. E.7.3 und E.7.4 AKB).","Endet der Vertrag, haftet die Proximus dem Opfer noch einen Monat, gerechnet ab ihrer Anzeige an die Zulassungsstelle (§ 117 Abs. 2 VVG). Das ist die Nachhaftung. Die Anzeige regelt heute § 51 Abs. 1 FZV; das Buch nennt noch die alte Nummer."]},{"titel":"Der Entschädigungsfonds zahlt zuletzt","absaetze":["Manchmal gibt es keinen Versicherer, an den sich das Opfer wenden kann: Der Schädiger flüchtet unerkannt, sein Fahrzeug ist nicht versichert, oder er hat den Schaden vorsätzlich herbeigeführt. Bei Vorsatz zahlt auch sein Versicherer nicht (§ 103 VVG, Ziff. A.1.5.1 AKB). Für diese Fälle gibt es den Entschädigungsfonds (§ 12 Abs. 1 S. 1 Nr. 1 bis 3 PflVG). Seine Aufgaben erfüllt die Verkehrsopferhilfe e. V.","Der Fonds zahlt immer zuletzt. Wer von Halter, Eigentümer oder Fahrer, von einer eigenen Versicherung wie der Vollkasko oder von der Krankenkasse Ersatz bekommt, muss sich zuerst dorthin wenden (§ 12 Abs. 1 S. 2 und 3 PflVG).","Bei Fahrerflucht ist der Fonds strenger, damit niemand einen Unfall erfindet. Schmerzensgeld zahlt er nur bei besonders schweren Verletzungen. Bei Sachschäden zahlt er nur den Teil über 500 €: Bei 1.200 € Schaden sind das 700 €. Das Buch formuliert das ungenau; maßgeblich ist § 12 Abs. 2 S. 2 PflVG. Schäden an Fahrzeugen und an Einrichtungen etwa der Energieversorgung ersetzt er nur, wenn beim selben Unfall ein Mensch getötet oder erheblich verletzt wurde (§ 12 Abs. 2 S. 3 PflVG). Diese Grenzen gelten nur bei Fahrerflucht, nicht beim unversicherten Fahrzeug.","Zahlt der Fonds, gehen die Ansprüche des Opfers auf ihn über (§ 13 Abs. 2 PflVG). Wird der Schädiger gefunden, holt der Fonds sich das Geld bei ihm zurück."]}],"vf":[{"frage":"Das Schaubild auf S. 37 (8. Aufl.: S. 460) zeigt drei Ansprüche. Wer hat gegen wen welchen Anspruch?","loesung":"Opfer gegen Schädiger: Haftungsanspruch. Versicherungsnehmer gegen seinen Versicherer: Deckungsanspruch. Opfer gegen den Kfz-Haftpflichtversicherer des Schädigers: Direktanspruch (§ 115 Abs. 1 S. 1 Nr. 1 VVG)."},{"frage":"Was ist ein „krankes“ Versicherungsverhältnis? Trennen Sie Innen- und Außenverhältnis.","loesung":"Innen ist der Versicherer gegenüber seinem Versicherungsnehmer ganz oder teilweise leistungsfrei, z. B. wegen Zahlungsverzugs oder einer Pflichtverletzung. Außen bleibt er gegenüber dem Opfer zur Leistung verpflichtet (§ 117 Abs. 1 VVG)."},{"frage":"Welche zwei Einschränkungen gelten, wenn der Versicherer nur wegen § 117 VVG zahlt – und wann entfällt eine davon?","loesung":"Er zahlt nur bis zu den Mindestversicherungssummen (§ 117 Abs. 3 S. 1 VVG) und nur nachrangig: Er darf das Opfer an einen anderen Schadensversicherer oder einen Sozialversicherungsträger verweisen (§ 117 Abs. 3 S. 2 VVG). Die Verweisung entfällt, wenn das Fahrzeug nicht den Bau- und Betriebsvorschriften entsprach oder ein unberechtigter Fahrer oder ein Fahrer ohne Fahrerlaubnis fuhr (§ 3 PflVG)."},{"frage":"Ein Vertrag endet am 02.10.2026. Die Proximus zeigt das am 05.10.2026 der Zulassungsstelle an. Am 28.10.2026 verursacht der frühere Kunde einen Unfall. Muss die Proximus dem Opfer zahlen, und was verlangt sie danach vom früheren Kunden?","loesung":"Ja. Die Nachhaftung läuft bis zum Ablauf des 05.11.2026 (§ 117 Abs. 2 S. 1 VVG), im Rahmen des § 117 Abs. 3 VVG. Vom früheren Kunden verlangt sie Ersatz ihrer Leistung (§ 116 Abs. 1 VVG) und die Prämie für die Zeit der Nachhaftung (Ziff. C.5 AKB)."},{"frage":"Nennen Sie drei Fälle, in denen der Entschädigungsfonds einspringt, jeweils mit Nummer.","loesung":"Das Fahrzeug kann nicht ermittelt werden, z. B. Fahrerflucht (§ 12 Abs. 1 S. 1 Nr. 1 PflVG); die vorgeschriebene Haftpflichtversicherung besteht nicht (Nr. 2); der Versicherer leistet nicht, weil der Schädiger vorsätzlich gehandelt hat (Nr. 3). Weitere: Nr. 4 bis 6 (von der Versicherungspflicht befreite Fahrzeuge)."},{"frage":"Warum zahlt der Fonds „subsidiär“? Nennen Sie zwei Stellen, an die er das Opfer zuerst verweist.","loesung":"Er zahlt nur, soweit das Opfer weder von Halter, Eigentümer oder Fahrer noch von einem Schadensversicherer Ersatz erlangt (§ 12 Abs. 1 S. 2 PflVG) und soweit kein Sozialversicherungsträger und keine Lohnfortzahlung den Schaden ausgleicht (§ 12 Abs. 1 S. 3 PflVG). Beispiele: eigene Vollkasko, gesetzliche Krankenkasse, Arbeitgeber."},{"frage":"Bei Fahrerflucht gelten drei Grenzen. Welche? Rechnen Sie: Was zahlt der Fonds bei einem Sachschaden von 1.200 € an einem Gartenzaun?","loesung":"Schmerzensgeld nur bei besonders schwerer Verletzung zur Vermeidung grober Unbilligkeit (§ 12 Abs. 2 S. 1 PflVG); bei Sachschäden nur der Teil über 500 € (§ 12 Abs. 2 S. 2 PflVG); Schäden an Fahrzeugen und an Einrichtungen des Verkehrs, der Energieversorgung und der Telekommunikation nur, wenn beim selben Unfall ein Mensch getötet oder erheblich verletzt wurde (§ 12 Abs. 2 S. 3 PflVG). Zaun: 1.200 € − 500 € = 700 €."},{"frage":"Der Fonds hat einem Opfer 4.000 € gezahlt. Später wird der unversicherte Fahrer gefunden. Was geschieht?","loesung":"Die Ansprüche des Opfers gegen den Fahrer sind auf den Fonds übergegangen (§ 13 Abs. 2 PflVG). Der Fonds holt sich die 4.000 € beim Fahrer zurück."}],"akte":{"pruef":"Wer zahlt dem Opfer: der Versicherer trotz Leistungsfreiheit oder nach Vertragsende – oder der Entschädigungsfonds?","ergebnis":"Luca im Beitragsrückstand: Die Proximus zahlt dem Opfer und holt sich alles von Luca zurück. Fahrerflucht am Familien-Pkw: Ohne Vollkasko tragen die Brehmers den Schaden selbst.","norm":"§§ 115, 116, 117 VVG · § 12 PflVG · Ziff. C.2.3, D.5.3, E.7.3 AKB","merksatz":"Außen zahlt der Versicherer, innen holt er zurück – der Fonds zahlt nur, was sonst keiner zahlt."},"exit":{"code":"LF6_LS061_TE3X","url":"https://forms.cloud.microsoft/e/ggGT6xGmvH"}},{"nr":4,"titel":"Unfall im Ausland","zyklus":"kurz","minuten":45,"std":"7","woche":3,"verfuegbar":true,"leitfrage":"Wer hilft den Brehmers, wenn ein Unfall über die Grenze geht – und wer zahlt?","anlass":"Sabine Brehmer fährt mit dem Familien-Pkw in die Türkei, über Österreich, Ungarn, Serbien und Bulgarien. Sie fragt Frau Wendler: „Was mache ich, wenn mir unterwegs jemand ins Auto fährt? Und wenn ich selbst einen Unfall baue?“ Außerdem ist in Halle gerade ein Auto mit polnischem Kennzeichen auf den Familien-Pkw aufgefahren. Heute klären Sie, welche Stelle in welchem Fall zuständig ist.","ziel":"Sie bestimmen für einen Unfall mit Auslandsbezug die zuständige Stelle – Deutsches Büro Grüne Karte, Schadenregulierungsbeauftragter, Entschädigungsstelle oder der ausländische Versicherer selbst – und den Umfang des Schutzes nach Ziff. A.1.4.1 AKB, jeweils mit Norm oder Ziffer.","lehrbuch":"S. 46–47 (8. Aufl.: S. 468–469)","abschnitt":"A 2.3 „Zuständigkeiten und internationale Vereinbarungen für die Regulierung von Unfällen mit Ausländern“ und A 2.3.1 „Schadenregulierung im Rahmen des Grüne-Karte-Systems“","skriptseiten":"S. 27–30","proximus":["Ziff. A.1.1.1","Ziff. A.1.4.1","Ziff. A.1.4.2","Ziff. A.1.5.3"],"schritte":["Entry-Quiz in der Stunde (einmal, zählt nicht)","Lehrbuch lesen: S. 46–47 (8. Aufl.: S. 468–469)","Skripttext: Drei Fragen, dann steht die zuständige Stelle fest","Verständnisfragen beantworten","Mit Proximus 5 arbeiten","Übung 1 · Die Brehmers und das Ausland","Lehrbuchaufgabe · Lernkontrolle zu A 2, Aufgabe 23 (Pflichtkern)","Exit-Quiz (wiederholbar)","Kundenakte: Zeile TE 4 eintragen"],"merke":[{"kopf":"Drei Fälle, drei Wege","zeilen":["Ausländisches Auto verursacht einen Unfall in Deutschland: Deutsches Büro Grüne Karte (§ 10 Abs. 1 AuslPflVG).","Unfall im EU- oder EWR-Ausland, Geschädigter wohnt in Deutschland: SRB des fremden Versicherers in Deutschland (§ 163 Abs. 1 VAG); Auskunft beim Zentralruf (§ 8a PflVG); notfalls Entschädigungsstelle (§ 15 PflVG).","Sie verursachen selbst einen Unfall im Ausland: Ihre Kfz-Haftpflicht zahlt, mindestens im Umfang Ihres Vertrags (Ziff. A.1.4.1 AKB)."]}],"skript":[{"titel":"Drei Fragen, dann steht die zuständige Stelle fest","absaetze":["Die Tabelle auf S. 46 (8. Aufl.: S. 468) folgt immer denselben drei Fragen: Wo ist der Unfall passiert? Woher kommt der Schädiger? Ist seine Versicherung bekannt? Aus den Antworten ergibt sich die zuständige Stelle. Die Tabelle geht dabei stets von einem Geschädigten aus, der in Deutschland wohnt.","Verursacht ein Auto aus dem Ausland in Deutschland einen Unfall, wenden Sie sich an das Deutsche Büro Grüne Karte. Voraussetzung ist ein Kennzeichen aus einem Staat, für den die Deckung am Kennzeichen hängt, oder eine Grüne Karte (S. 47; 8. Aufl.: S. 469). Dann können Sie Ihren Anspruch gegen das Büro wie gegen einen Haftpflichtversicherer geltend machen, auch vor Gericht (§ 10 Abs. 1 AuslPflVG). Das meint das Wort Passivlegitimation: Das Büro ist der richtige Gegner, auch wenn es einen Versicherer mit der Abwicklung beauftragt.","Passiert der Unfall in einem anderen EU- oder EWR-Staat, streiten Sie nicht im Ausland. Jeder Kfz-Haftpflichtversicherer benennt in den anderen Staaten einen Schadenregulierungsbeauftragten, kurz SRB (§ 163 Abs. 1 VAG). Bei ihm melden Sie den Schaden in Deutschland und auf Deutsch an. Wer der Versicherer und sein SRB sind, sagt Ihnen der Zentralruf der Autoversicherer als Auskunftsstelle (§ 8a Abs. 1 und 3 PflVG). Notieren Sie deshalb immer das Kennzeichen. Antwortet der Versicherer nicht binnen drei Monaten mit Gründen oder ist er binnen zwei Monaten nicht zu ermitteln, hilft die Verkehrsopferhilfe als Entschädigungsstelle (§ 15 Abs. 1 PflVG). Außerhalb von EU und EWR fehlt diese Hilfe meist: Dann wenden Sie sich selbst an den ausländischen Versicherer.","Verursachen Sie selbst im Ausland einen Unfall, zahlt Ihre eigene Kfz-Haftpflicht. Der Geschädigte kann sich an das Grüne-Karte-Büro seines Landes wenden. Im Grüne-Karte-System gilt die Regel: Reguliert wird nach dem Recht des Landes, in dem der Unfall geschah. Bis zu welchem Umfang die Proximus zahlt, regelt Ziff. A.1.4.1 AKB."]}],"vf":[{"frage":"Nach welchen drei Merkmalen ordnet die Tabelle auf S. 46 (8. Aufl.: S. 468) einen Unfall einer zuständigen Stelle zu?","loesung":"Schadenort (Inland, Ausland in der EU, Ausland außerhalb der EU), Schädiger (Ausländer oder nicht zu ermitteln) und die Versicherung des Schädigers bzw. ihr Nachweis (Grüne Karte, Kennzeichen, Versicherungsschein, keine begründete Antwort des SRB)."},{"frage":"Unter welchen Voraussetzungen können Sie nach einem Unfall in Deutschland mit einem ausländischen Auto das Deutsche Büro Grüne Karte in Anspruch nehmen (S. 47; 8. Aufl.: S. 469)?","loesung":"Wenn für das ausländische Fahrzeug Deckung für Deutschland auf Grundlage des amtlichen Kennzeichens besteht (EU, EWR- und EFTA-Staaten sowie die weiteren auf S. 47 genannten Staaten) oder wenn für das Fahrzeug eine Internationale Versicherungskarte ausgestellt war."},{"frage":"Was bedeutet Passivlegitimation des Deutschen Büros Grüne Karte, und ändert sich daran etwas, wenn das Büro einen Versicherer mit der Regulierung beauftragt?","loesung":"Das Büro ist der richtige Anspruchsgegner: Man kann es wie einen Haftpflichtversicherer in Anspruch nehmen und direkt verklagen (§ 10 Abs. 1 AuslPflVG). Beauftragt es einen Versicherer oder ein Regulierungsbüro (§ 10 Abs. 4 AuslPflVG), bleibt das Büro trotzdem der Gegner."},{"frage":"Wozu gibt es den Schadenregulierungsbeauftragten, und wie erfahren Sie, wer es im Einzelfall ist?","loesung":"Wer in einem anderen EU- oder EWR-Staat als seinem Wohnsitzstaat geschädigt wird, soll den Schaden im eigenen Land anmelden können. Der SRB bearbeitet und reguliert den Schaden im Auftrag des ausländischen Versicherers (§ 163 Abs. 1 VAG). Versicherer und SRB nennt der Zentralruf der Autoversicherer als Auskunftsstelle (§ 8a Abs. 1 S. 1 Nr. 1, Abs. 3 PflVG)."}],"akte":{"pruef":"Wo war der Unfall, wer hat ihn verursacht – und welche Stelle ist zuständig?","ergebnis":"Polnisches Auto in Halle: Deutsches Büro Grüne Karte. Schaden in Budapest: SRB des ungarischen Versicherers in Deutschland. Schaden in der Türkei: selbst beim türkischen Versicherer. Sabine verursacht einen Schaden: Die Proximus zahlt, mindestens nach ihrem Vertrag.","norm":"§ 10 Abs. 1 AuslPflVG; § 163 Abs. 1 VAG; § 8a PflVG; Ziff. A.1.4.1 AKB","merksatz":"Wer im EU-Ausland geschädigt wird, meldet den Schaden zu Hause an; wer im Ausland schädigt, ist über die eigene Kfz-Haftpflicht geschützt."},"exit":{"code":"LF6_LS061_TE4X","url":"https://forms.cloud.microsoft/e/8QDYbbm7Yc"}},{"nr":5,"titel":"Tarif und Schadenfreiheitsrabatt","zyklus":"voll","minuten":90,"std":"8–9","woche":3,"verfuegbar":true,"leitfrage":"Wie berechnet die Proximus den Beitrag für Hendrik Brehmers Neuwagen – und in welche SF-Klasse kommt Luca?","anlass":"Hendrik Brehmer fährt ab 01.11.2026 seinen neuen Golf und fragt Frau Wendler, was die Kfz-Haftpflicht kostet. Im selben Gespräch will er wissen, ob Luca den Kleinwagen der Großmutter selbst versichern oder als Zweitwagen der Eltern fahren soll. Heute klären Sie, wie der Tarif der Proximus aus der Tarifprämie einen Beitrag macht und welche SF-Klasse ein neuer Vertrag bekommt.","ziel":"Sie bestimmen für einen Pkw die Tarifmerkmale mit Proximus 5, stufen einen neuen Vertrag mit Ziffer in die richtige SF-Klasse ein, berechnen den Kfz-Haftpflichtbeitrag aus der Tarifprämie und wägen für einen Fahranfänger eigenen Vertrag und Zweitwagen gegeneinander ab.","lehrbuch":"S. 59 bis S. 65 (8. Aufl.: S. 481–487)","abschnitt":"A 3.1.2 „Besonderheiten in Antrag und Tarif bei Proximus 5“","skriptseiten":"S. 31–36","proximus":["Ziff. I.2.1 bis I.2.4 AKB 2021","Ziff. I.3.1, I.3.2 und I.3.4 AKB 2021","Anhang 1, Tabelle 1.1 (SF-Klassen und Beitragssätze Pkw)","Tarif zur Kraftfahrtversicherung: Nachlässe und Zuschläge, Zahlungsweise, Versicherungsteuer","Kennzeichenverzeichnis (Regionalklassen) und Typklassenverzeichnis Pkw","Antrag auf Kraftfahrzeugversicherung, Feld „Fahrzeugnutzerkreis“"],"schritte":["Entry-Quiz in der Stunde (einmal, zählt nicht)","Lehrbuch lesen: S. 59 bis S. 65 (8. Aufl.: S. 481–487)","Skripttext: Von der Tarifprämie zum Beitrag – vier Schritte","Verständnisfragen beantworten","Mit Proximus 5 arbeiten","Lehrbuchaufgabe · Lernkontrollen zu A 3, Aufgabe 4 (Pflichtkern)","Übung 1 · Hendrik Brehmers Neuwagen – Tarifmerkmale und Beitrag","Übung 2 · Wer hat recht? Luca und der Kleinwagen","Exit-Quiz (wiederholbar)","Kundenakte: Zeile TE 5 eintragen"],"merke":[{"kopf":"Erst der Beitragssatz, dann die Nachlässe","zeilen":["Die Tarifprämie (100 %) kommt aus dem Tarifrechner; WKZ, Regional- und Typklasse stecken darin.","Neuer Vertrag: Klasse 0 mit 85 % – es sei denn, jede Voraussetzung einer Sondereinstufung nach Ziff. I.2.2 ist erfüllt.","Nachlässe nacheinander, dann die Zahlungsweise, zuletzt 19 % Versicherungsteuer."]}],"skript":[{"titel":"Von der Tarifprämie zum Beitrag – vier Schritte","absaetze":["Proximus 5 enthält keine Tabellen mit Grundprämien. Den Ausgangswert, die Tarifprämie (100 %), liefert in der Agentur der Tarifrechner. In ihr stecken schon die Wagniskennziffer, die Regionalklasse und die Typklasse. Alles Weitere bestimmen Sie selbst mit dem Bedingungswerk. Gehen Sie immer in vier Schritten vor.","Schritt 1 – Wagnis und Klassen. Die Wagniskennziffer (WKZ) fasst Fahrzeuge gleicher Art und Verwendung zusammen. Ein Pkw, der weder Taxi noch Mietwagen ist, hat die WKZ 112. Die Regionalklasse richtet sich nach dem Zulassungsbezirk am Wohnsitz und steht im Kennzeichenverzeichnis. Die Typklasse finden Sie im Typklassenverzeichnis über die Herstellerschlüsselnummer (HSN) und die Typschlüsselnummer (TSN) aus der Zulassungsbescheinigung. Suchen Sie immer mit beiden Nummern, denn dieselbe TSN kann bei zwei Herstellern vorkommen. Beide Verzeichnisse in Proximus 5 sind Auszüge. Fehlt ein Bezirk, nehmen Sie nie den Nachbarbezirk, sondern den Wert aus dem Tarifrechner.","Schritt 2 – die SF-Klasse. Die Schadenfreiheitsklasse zeigt, wie viele Kalenderjahre ein Vertrag ununterbrochen schadenfrei gelaufen ist. In Anhang 1 der AKB lesen Sie dazu den Beitragssatz ab: den Anteil der Tarifprämie, der zu zahlen ist. Ein neuer Vertrag ohne übernommenen Schadenverlauf beginnt in Klasse 0 mit 85 % (Ziff. I.2.1). Besser startet nur, wer eine Sondereinstufung nach Ziff. I.2.2 erfüllt. SF ½ gibt es nach mindestens drei Jahren Fahrerlaubnis. SF 1 gibt es für einen Zweitwagen, wenn auf den Kunden oder seinen Ehe- oder Lebenspartner schon ein Pkw in mindestens SF 1 läuft und der Kunde die Fahrerlaubnis seit mindestens einem Jahr hat. SF 3 gibt es, wenn der Erstwagen mindestens in SF 3 steht, nur der Kunde und sein Partner fahren und beide mindestens 23 Jahre alt sind. Fährt später jemand anderes, wird der Vertrag ab dann so eingestuft, als hätte er in SF 1 begonnen.","Schritt 3 – Nachlässe und Zuschläge. Der Tarif nennt sie für Fahrzeugalter, Fahrleistung, Wohneigentum, Garage und Fahrerkreis. Rechnen Sie zuerst den Beitragssatz der SF-Klasse, dann jeden Nachlass und Zuschlag nacheinander vom zuletzt errechneten Betrag, in der Reihenfolge der Tabelle. Runden Sie jedes Zwischenergebnis auf den Cent. Nachlass gibt es nur für Angaben, die im Antrag stehen und stimmen: Ein Auto, das nachts auf der Straße steht, bekommt keinen Garagen-Nachlass.","Schritt 4 – Zahlungsweise und Steuer. Bei jährlicher Zahlung zieht der Tarif 5 % ab, bei halbjährlicher 3 %, bei vierteljährlicher 2 %. Zuletzt kommen 19 % Versicherungsteuer hinzu.","Und im nächsten Jahr? Zum 1. Januar steigt ein Vertrag eine Klasse auf, wenn er das ganze Kalenderjahr schadenfrei bestand (Ziff. I.3.2). Beginnt ein neu eingestufter Vertrag zwischen dem 2. Januar und dem 1. Juli, genügen im ersten Jahr sechs Monate (Ziff. I.3.4.2). Beginnt er später, zählt das angefangene Jahr nicht. Aus Klasse 0, SF ½ und M führt ein volles schadenfreies Kalenderjahr direkt in SF 1 (Ziff. I.3.4.1). Wer den Schadenverlauf eines anderen Menschen übernimmt, folgt eigenen Regeln; das ist Thema von TE 6."]}],"vf":[{"frage":"Der Tarifrechner nennt für ein Auto eine Tarifprämie von 800,00 €. Welche Tarifmerkmale stecken schon darin, und was rechnen Sie selbst mit Proximus 5 ein?","loesung":"Darin stecken die Wagniskennziffer, die Regionalklasse und die Typklasse. Selbst rechnen Sie den Beitragssatz der SF-Klasse (Anhang 1), die Nachlässe und Zuschläge (Tarif), den Abschlag für die Zahlungsweise und 19 % Versicherungsteuer."},{"frage":"Warum dürfen Sie für die Brehmers aus Halle nicht die Regionalklasse von SK (Saalekreis) nehmen?","loesung":"Die Regionalklasse richtet sich nach dem Zulassungsbezirk am Wohnsitz (S. 60–61). Halle (HAL) ist ein eigener Bezirk und steht nicht im Auszug in Proximus 5. Der Wert kommt aus dem Tarifrechner und steckt in der Tarifprämie."},{"frage":"Nennen Sie die drei Sondereinstufungen nach Ziff. I.2.2 mit SF-Klasse. An welcher Voraussetzung scheitern Fahranfänger meistens?","loesung":"SF ½ (Ziff. I.2.2.1): mindestens drei Jahre Fahrerlaubnis. SF 1 (Ziff. I.2.2.2): Pkw des Kunden oder seines Ehe- oder Lebenspartners in mindestens SF 1 und mindestens ein Jahr Fahrerlaubnis. SF 3 (Ziff. I.2.2.3): Erstwagen in mindestens SF 3, ein Jahr Fahrerlaubnis, nur Kunde und Partner fahren, alle mindestens 23. Fahranfänger scheitern an der Dauer der Fahrerlaubnis, bei SF 3 auch am Alter."},{"frage":"Ein neuer Vertrag beginnt in Klasse 0 und bleibt schadenfrei. Welche Klasse gilt am 1. Januar des Folgejahres bei Beginn am 01.03., welche bei Beginn am 01.09.?","loesung":"Beginn 01.03.: SF ½ (Halbjahresregelung, Ziff. I.3.4.2). Beginn 01.09.: Klasse 0 bleibt; SF 1 erst am 1. Januar nach dem ersten vollen schadenfreien Kalenderjahr (Ziff. I.3.4.1). Wie eine technische Rückdatierung hilft, zeigt das Lehrbuch auf S. 65."}],"akte":{"pruef":"Welche SF-Klasse, welche Klassen und welche Nachlässe gelten für einen neuen Pkw-Vertrag – und was kostet er?","ergebnis":"Golf: SF 3 (46 %), Typklasse KH 13, −10 % Neuwagen, +5 % Fahrleistung, −10 % Eigenheim, −10 % Partner: 258,74 € im Jahr. Luca: eigener Vertrag in Klasse 0 (85 %) oder Zweitwagen auf Hendrik in SF 1 (52 %).","norm":"Ziff. I.2.1, I.2.2.2, I.2.2.3, I.3.2 AKB 2021 · Anhang 1 · Tarif: Nachlässe und Zuschläge","merksatz":"Erst der Beitragssatz, dann die Nachlässe – und eine Sondereinstufung nur, wenn jede Voraussetzung stimmt."},"exit":{"code":"LF6_LS061_TE5X","url":"https://forms.cloud.microsoft/e/aRNJjsu3gZ"}},{"nr":6,"titel":"Schadenverlauf übernehmen und Rückstufung","zyklus":"voll","minuten":90,"std":"10–11","woche":4,"verfuegbar":false},{"nr":7,"titel":"Vorläufige Deckung und Stilllegung","zyklus":"voll","minuten":90,"std":"12–13","woche":4,"verfuegbar":false}],"stationen":{"1":{"titel":"Welche Sparte? Welches Land?","untertitel":"Frau Wendler sortiert Schadenmeldungen und Reiseziele der Brehmers.","items":[{"id":"t1-09","typ":"frei","art":"abruf","titel":"Außerhalb von Europa und der EU","akte":"Kurzantwort","frage":"Ein Kunde fährt mit seinem Auto in ein Land außerhalb von Europa und der EU. Was gilt dort für Kfz-Haftpflicht, Kasko, Autoschutzbrief und Fahrerschutz? Nennen Sie jeweils die Ziffer.","zuordnung":{"frage":"Prüfen Sie Ihr Wissen: Was gilt außerhalb von Europa und der EU für jede Sparte?","kategorien":["gilt mit IVK","gilt nur mit gesonderter Vereinbarung","keine Erweiterung vorgesehen"],"zeilen":[{"text":"Kfz-Haftpflicht","kat":0,"erkl":"Die IVK erweitert die Haftpflicht auf die Länder, die auf ihr nicht durchgestrichen sind (Ziff. A.1.4.2)."},{"text":"Kasko","kat":1,"erkl":"Die IVK erweitert die Kasko nicht; sie braucht eine eigene Vereinbarung (Ziff. A.2.5.2)."},{"text":"Autoschutzbrief","kat":2,"erkl":"Für den Schutzbrief sehen die AKB keine Erweiterung vor (Ziff. A.3.4)."},{"text":"Fahrerschutz","kat":2,"erkl":"Auch der Fahrerschutz lässt sich nach den AKB nicht erweitern (Ziff. A.4.3)."}]},"kernpunkte":["Kfz-Haftpflicht nur mit IVK, auf der das Land nicht durchgestrichen ist (Ziff. A.1.4.2)","Kasko nur mit gesonderter Vereinbarung (Ziff. A.2.5.2)","Autoschutzbrief: keine Erweiterung vorgesehen (Ziff. A.3.4)","Fahrerschutz: keine Erweiterung vorgesehen (Ziff. A.4.3)"],"muster":"Die Kfz-Haftpflicht gilt dort nur, wenn der Kunde eine IVK erhalten hat und das Land darauf nicht durchgestrichen ist (Ziff. A.1.4.2). Die Kasko gilt nur mit einer gesonderten Vereinbarung (Ziff. A.2.5.2). Für Autoschutzbrief und Fahrerschutz sehen die AKB keine Erweiterung vor (Ziff. A.3.4, A.4.3).","erkl":"Merkkasten TE 1: Außerhalb von Europa und der EU gilt die Haftpflicht nur mit IVK, die Kasko nur mit Vereinbarung, Schutzbrief und Fahrerschutz gar nicht."},{"id":"t1-01","typ":"zuordnung","titel":"Wer zahlt welchen Schaden?","akte":"Schadenmeldungen","fall":"Frau Wendler hat fünf Meldungen der Brehmers notiert. Nehmen Sie an, dass die passende Sparte jeweils vereinbart ist.","frage":"Ordnen Sie jedem Schaden die Sparte zu, die leistet.","kategorien":["Kfz-Haftpflicht (A.1)","Kasko (A.2)","Autoschutzbrief (A.3)","Fahrerschutz (A.4)"],"zeilen":[{"text":"Sabine streift beim Einparken den Gartenzaun eines Nachbarn.","kat":0,"erkl":"Eine fremde Sache ist beschädigt: Kfz-Haftpflicht, Ziff. A.1.1.1 b."},{"text":"Ein Sturm wirft einen Ast auf Hendriks geparkten Golf.","kat":1,"erkl":"Schaden am eigenen Auto durch Sturm: Teilkasko, Ziff. A.2.2."},{"text":"Lucas Kleinwagen bleibt auf der Autobahn bei Leipzig mit einer Panne liegen und wird in die Werkstatt geschleppt.","kat":2,"erkl":"Hilfe unterwegs nach einer Panne: Autoschutzbrief, Ziff. A.3.5."},{"text":"Hendrik kommt bei Glätte allein von der Straße ab und verletzt sich. Sonst ist niemand beteiligt.","kat":3,"erkl":"Personenschaden des Fahrers selbst: Fahrerschutz, Ziff. A.4.1."},{"text":"Luca verletzt beim Abbiegen eine Radfahrerin.","kat":0,"erkl":"Personenschaden eines anderen: Kfz-Haftpflicht, Ziff. A.1.1.1."}],"erkl":"Fragen Sie immer zuerst: Wessen Schaden? Der eines anderen: Haftpflicht. Das eigene Auto: Kasko. Hilfe unterwegs: Schutzbrief. Der verletzte Fahrer: Fahrerschutz (Merkkasten TE 1)."},{"id":"t1-02","typ":"mc","titel":"Eigenes Auto nach selbst verschuldetem Unfall","akte":"Kundengespräch","fall":"Hendrik verschuldet mit dem Golf einen Auffahrunfall. Er fragt, warum seine Kfz-Haftpflicht die Reparatur seines eigenen Autos nicht bezahlt.","frage":"Welche Antwort ist fachlich richtig?","optionen":["Die Kfz-Haftpflicht zahlt nicht für das versicherte Fahrzeug selbst; den Unfallschaden am eigenen Auto trägt nur eine Vollkasko.","Bei einem selbst verschuldeten Unfall zahlt keine Sparte der Kfz-Versicherung.","Die Kfz-Haftpflicht zahlt nur Personenschäden, keine Sachschäden.","Die Teilkasko reicht, weil sie alle Schäden am eigenen Auto übernimmt."],"richtig":0,"warum":[null,"Doch: Die Vollkasko zahlt auch einen selbst verschuldeten Unfall (Ziff. A.2.3.2).","Die Kfz-Haftpflicht zahlt auch Sachschäden, aber nur die anderer (Ziff. A.1.1.1 b).","Die Teilkasko deckt nur die Ereignisse der Ziff. A.2.2, etwa Diebstahl, Sturm oder Hagel, keinen selbst verschuldeten Unfall."],"erkl":"Ziff. A.1.5.3 AKB: Die Beschädigung des versicherten Fahrzeugs selbst ist in der Kfz-Haftpflicht nicht versichert. Einen Unfallschaden am eigenen Auto zahlt die Vollkasko (Ziff. A.2.3.2)."},{"id":"t1-03","typ":"mc","titel":"Eine Sparte kündigen","akte":"Notiz","fall":"Hendrik will für sein Motorrad nur die Teilkasko kündigen.","frage":"Was gilt danach für die Kfz-Haftpflicht des Motorrads?","optionen":["Sie bleibt bestehen; jede Sparte ist ein rechtlich selbstständiger Vertrag.","Sie endet mit der Teilkasko, weil beide ein Vertrag sind.","Sie ruht, bis eine neue Teilkasko abgeschlossen ist.","Sie wird in eine Vollkasko umgewandelt."],"richtig":0,"erkl":"Die AKB 2021 fassen rechtlich selbstständige Verträge zusammen (Einleitung). Die Kündigung eines Vertrags berührt die anderen nicht (Ziff. G.4.1)."},{"id":"t1-04","typ":"urteil","titel":"Grüne Karte für Kappadokien","sprecher":"Sabine Brehmer","aussage":"„Wenn ich mir die Grüne Karte besorge, bin ich in Kappadokien rundum versichert – auch mit meiner Teilkasko.“","urteil":"stimmt nicht","normfrage":"Auf welche Ziffer stützen Sie das Urteil zur Teilkasko?","normoptionen":["Ziff. A.2.5.2 AKB","Ziff. A.1.4.2 AKB","Ziff. A.3.4 AKB","§ 1 PflVG"],"norm":0,"erkl":"Die Internationale Versicherungskarte (Grüne Karte) erweitert nur die Kfz-Haftpflicht auf die dort genannten, nicht durchgestrichenen Länder (Ziff. A.1.4.2). Für die Kasko außerhalb von Europa und der EU braucht Sabine eine gesonderte Vereinbarung (Ziff. A.2.5.2)."},{"id":"t1-05","typ":"zuordnung","titel":"Wo liegt das Reiseziel?","frage":"Ordnen Sie jedes Reiseziel dem richtigen Gebiet zu.","kategorien":["Europa (geografisch)","außereuropäisches Gebiet der EU","außerhalb von beidem"],"zeilen":[{"text":"Serbien","kat":0,"erkl":"Serbien gehört nicht zur EU, liegt aber in den geografischen Grenzen Europas."},{"text":"Réunion","kat":1,"erkl":"Réunion gehört zur EU, liegt aber nicht in Europa (Lehrbuch S. 25)."},{"text":"Tunesien","kat":2,"erkl":"Tunesien liegt weder in Europa noch gehört es zur EU."},{"text":"Martinique","kat":1,"erkl":"Martinique zählt das Lehrbuch zu den außereuropäischen Gebieten der EU (S. 25)."},{"text":"Istanbul (europäischer Teil)","kat":0,"erkl":"Der europäische Teil Istanbuls liegt in Europa."},{"text":"Kappadokien (Anatolien)","kat":2,"erkl":"Kappadokien liegt im asiatischen Teil der Türkei, außerhalb Europas und der EU."}],"erkl":"Europa und die außereuropäischen Gebiete der EU sind ohne Vereinbarung gedeckt (Ziff. A.1.4.1, A.2.5.1, A.3.4, A.4.3). Für alles andere fragen Sie je Sparte nach einer Erweiterung."},{"id":"t1-06","typ":"mc","titel":"Untergrenze im Besuchsland","frage":"Die KfzPflVV verlangt im Ausland als Untergrenze nur den in Deutschland vorgeschriebenen Umfang. Was sehen die AKB 2021 der Proximus darüber hinaus vor?","optionen":["Es gilt der Umfang des Besuchslands, mindestens aber der des eigenen Vertrags.","Es gilt immer der Umfang des Besuchslands, auch wenn er niedriger ist als der Vertrag.","Es gilt nur die Summe, die auf der Grünen Karte steht.","Im Ausland gelten stets 100 Mio. € pauschal."],"richtig":0,"erkl":"Ziff. A.1.4.1 Satz 2 AKB: maßgeblich ist der im Besuchsland vorgeschriebene Umfang, mindestens aber der Umfang des eigenen Vertrags. § 1 Abs. 1 KfzPflVV verlangt nur den deutschen Mindestumfang."},{"id":"t1-07","typ":"mc","titel":"Mit dem Auto nach Tunesien","akte":"Kundengespräch","fall":"Ein Kunde hat Kfz-Haftpflicht und Autoschutzbrief, keine Kasko. Er nimmt sein Auto per Fähre mit nach Tunesien.","frage":"Was empfehlen Sie ihm?","optionen":["Eine IVK anfordern, auf der Tunesien nicht durchgestrichen ist; der Schutzbrief hilft ihm in Tunesien nicht.","Eine gesonderte Vereinbarung für den Schutzbrief beantragen.","Nichts regeln: Tunesien liegt am Mittelmeer und damit im Geltungsbereich.","Eine Kasko-Vereinbarung abschließen; sie erweitert auch die Haftpflicht."],"richtig":0,"warum":[null,"Für den Schutzbrief sehen die AKB keine Erweiterung vor (Ziff. A.3.4).","Tunesien liegt weder in Europa noch gehört es zur EU (Ziff. A.1.4.1).","Eine Kasko-Vereinbarung (Ziff. A.2.5.2) hilft der Haftpflicht nicht; dafür braucht es die IVK."],"erkl":"Haftpflicht außerhalb von Europa und der EU nur mit IVK (Ziff. A.1.4.2). Der Schutzbrief gilt in Europa und den außereuropäischen EU-Gebieten, eine Erweiterung ist nicht vorgesehen (Ziff. A.3.4)."},{"id":"t1-08","typ":"reihe","titel":"Prüfreihenfolge Geltungsbereich","frage":"Bringen Sie die Prüfschritte in die Reihenfolge, die das Skript vorgibt.","schritte":["Sparte bestimmen: Wessen Schaden trägt welche Sparte?","Ort prüfen: Europa oder außereuropäisches Gebiet der EU?","Liegt der Ort außerhalb: je Sparte nach einer Erweiterung fragen (IVK, gesonderte Vereinbarung)","Dem Kunden empfehlen, was die Agentur regelt – mit Ziffer"],"erkl":"Merkkasten TE 1: Erst die Sparte, dann das Land. Außerhalb von Europa und der EU klären Sie je Sparte die Erweiterung (Ziff. A.1.4.2, A.2.5.2)."},{"id":"t1-10","typ":"frei","art":"erklaerung","titel":"Warum die Haftpflicht das eigene Auto nicht zahlt","akte":"Kundengespräch","frage":"Erklären Sie einem Kunden in zwei Sätzen, warum seine Kfz-Haftpflicht nach einem selbst verschuldeten Unfall den Schaden an seinem eigenen Auto nicht bezahlt und welche Versicherung er dafür braucht.","zuordnung":{"frage":"Gehört der Satz in eine richtige Erklärung für den Kunden?","kategorien":["richtig","falsch"],"zeilen":[{"text":"Die Kfz-Haftpflicht zahlt die Schäden, die Sie mit dem Auto anderen zufügen.","kat":0,"erkl":"So regelt es Ziff. A.1.1.1: Geschützt ist der Geschädigte."},{"text":"Ihr eigenes Auto ist in der Haftpflicht nicht versichert.","kat":0,"erkl":"Ziff. A.1.5.3 nimmt Schäden am versicherten Fahrzeug selbst aus."},{"text":"Den Unfallschaden an Ihrem Auto zahlt die Teilkasko.","kat":1,"erkl":"Die Teilkasko greift etwa bei Diebstahl oder Hagel (Ziff. A.2.2); einen Unfallschaden zahlt erst die Vollkasko (Ziff. A.2.3.2)."},{"text":"Weil Sie den Unfall verschuldet haben, zahlt keine Sparte der Kfz-Versicherung.","kat":1,"erkl":"Die Vollkasko zahlt auch einen selbst verschuldeten Unfall (Ziff. A.2.3.2)."}]},"kernpunkte":["Die Kfz-Haftpflicht deckt Schäden, die er mit dem Fahrzeug anderen zufügt (Ziff. A.1.1.1)","Das versicherte Fahrzeug selbst ist in der Haftpflicht nicht versichert (Ziff. A.1.5.3)","Für einen Unfallschaden am eigenen Auto braucht er eine Vollkasko (Ziff. A.2.3.2)"],"muster":"Ihre Kfz-Haftpflicht zahlt nur die Schäden, die Sie mit dem Auto anderen zufügen; das versicherte Auto selbst ist davon ausgenommen (Ziff. A.1.1.1, A.1.5.3). Den Unfallschaden an Ihrem eigenen Auto zahlt nur eine Vollkasko (Ziff. A.2.3.2).","erkl":"Erst die Sparte bestimmen: Wessen Schaden? Der eines anderen gehört in die Haftpflicht, das eigene Auto in die Kasko (Merkkasten TE 1)."}]},"2":{"titel":"Pflicht – Summe – Nachweis","untertitel":"Wer muss versichern, mit welcher Summe, und wie wird der Schutz nachgewiesen?","items":[{"id":"t2-10","typ":"frei","art":"abruf","titel":"Mindestversicherungssummen","akte":"Kurzantwort","frage":"Nennen Sie die drei gesetzlichen Mindestversicherungssummen mit ihrer Schadenart und sagen Sie, ob sie je Person oder je Schadensfall gelten.","zuordnung":{"frage":"Prüfen Sie Ihr Wissen: Welche gesetzliche Mindestversicherungssumme je Schadensfall gilt?","kategorien":["7.500.000 €","1.300.000 €","50.000 €"],"zeilen":[{"text":"Personenschäden aller Verletzten eines Unfalls zusammen","kat":0,"erkl":"Anlage zu § 4 Abs. 2 PflVG: 7.500.000 € je Schadensfall, nicht je Person."},{"text":"Sachschäden","kat":1,"erkl":"Anlage zu § 4 Abs. 2 PflVG: 1.300.000 € je Schadensfall."},{"text":"Reine Vermögensschäden","kat":2,"erkl":"Anlage zu § 4 Abs. 2 PflVG: 50.000 € für Vermögensschäden ohne Personen- oder Sachschaden."},{"text":"Verdienstausfall eines Verletzten","kat":0,"erkl":"Der Verdienstausfall folgt aus der Verletzung und gehört zum Personenschaden: Es gilt die Summe für Personenschäden, nicht die 50.000 € für reine Vermögensschäden (Anlage zu § 4 Abs. 2 PflVG)."}]},"kernpunkte":["7.500.000 € für Personenschäden","1.300.000 € für Sachschäden","50.000 € für reine Vermögensschäden","je Schadensfall, nicht je Person (Anlage zu § 4 Abs. 2 PflVG)"],"muster":"Je Schadensfall mindestens 7.500.000 € für Personenschäden, 1.300.000 € für Sachschäden und 50.000 € für reine Vermögensschäden (Anlage zu § 4 Abs. 2 PflVG). Alle Verletzten eines Unfalls teilen sich die 7.500.000 €.","erkl":"Merkkasten TE 2: 7.500.000 € · 1.300.000 € · 50.000 € je Schadensfall, nicht je Person."},{"id":"t2-01","typ":"mc","titel":"Wer muss versichern?","akte":"Notiz","fall":"Ingrid Brehmer bleibt Halterin ihres Kleinwagens. Luca fährt ihn ab November regelmäßig.","frage":"Wen trifft die Versicherungspflicht nach § 1 PflVG?","optionen":["Ingrid als Halterin; Luca ist als Fahrer mitversichert.","Luca, weil er das Auto regelmäßig fährt.","Ingrid und Luca müssen je einen eigenen Vertrag abschließen.","Niemand, weil Ingrid selbst nicht mehr fährt."],"richtig":0,"erkl":"§ 1 PflVG verpflichtet den Halter. Fahrer und Eigentümer sind mitversichert (§ 4 Abs. 3 PflVG, Ziff. A.1.2 AKB)."},{"id":"t2-02","typ":"stufen","titel":"Pflicht-Check: Sabines S-Pedelec","akte":"Pflicht-Check","fall":"Sabine kauft ein S-Pedelec. Sein Motor unterstützt sie auch über 25 km/h hinaus. Es steht in Halle; Sabine nutzt es auf eigene Rechnung und bestimmt darüber.","schritte":[{"typ":"mc","frage":"Merkmal 1: Gibt es einen Halter?","optionen":["Ja, Sabine nutzt es auf eigene Rechnung und bestimmt darüber.","Nein, Fahrräder haben keinen Halter.","Nein, Halter ist immer der Händler bis zur Zulassung."],"richtig":0,"erkl":"Halter ist, wer das Fahrzeug auf eigene Rechnung nutzt und darüber bestimmt (Skript TE 2)."},{"typ":"mc","frage":"Merkmal 2: Ist das S-Pedelec ein Fahrzeug nach § 1a Abs. 1 Nr. 1 PflVG?","optionen":["Ja, es ist ein Fahrrad mit Hilfsmotor, das nicht unter § 1 Abs. 3 StVG fällt (Nr. 1 b).","Nein, alles mit Pedalen ist ein Fahrrad.","Nein, nur Fahrzeuge mit Kennzeichen fallen darunter."],"richtig":0,"erkl":"Nur ein Pedelec, das bloß beim Treten und nur bis 25 km/h unterstützt, ist kein Kraftfahrzeug (§ 1 Abs. 3 StVG). Das S-Pedelec unterstützt darüber hinaus."},{"typ":"mc","frage":"Merkmal 3: Hat es seinen Standort im Inland?","optionen":["Ja, in Halle.","Nein, Fahrräder haben keinen Standort.","Das spielt für die Pflicht keine Rolle."],"richtig":0,"erkl":"Der regelmäßige Standort ist Halle, also das Inland (§ 1 PflVG)."},{"typ":"mc","frage":"Ergebnis?","optionen":["Sabine muss eine Haftpflichtversicherung abschließen und aufrechterhalten.","Die Versicherung ist freiwillig.","Versichern muss der Händler, der das Rad verkauft hat."],"richtig":0,"erkl":"Alle drei Merkmale liegen vor: Versicherungspflicht nach § 1 PflVG."}],"erkl":"Pflicht-
