<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lernzentrale KVF</title>
<style>
:root{--petrol:#223D42;--mint:#5E9C87;--mint-hell:#E3F0EB;--grund:#F2F6F6;--text:#1A1A1A;--leise:#56656A;--karte:#FFFFFF;--rand:#C9D4D2;--sunk:#EAF0EF;
  --ok:#1F7A4D;--ok-soft:#E2F2E8;--mittel:#9A6B00;--mittel-soft:#FBF1D9;--schwach:#B3412E;--schwach-soft:#FBE6E1;--fokus:#0B5FA5}
@media (prefers-color-scheme:dark){:root{--petrol:#9CC9BB;--mint:#7FBFA8;--mint-hell:#1E3A35;--grund:#142326;--text:#E8EEED;--leise:#A9B8B6;--karte:#1C3034;--rand:#2F4A4F;--sunk:#173035;
  --ok:#6FD39C;--ok-soft:#173A2A;--mittel:#E8C25A;--mittel-soft:#3A3117;--schwach:#F29A87;--schwach-soft:#3D221D;--fokus:#7CB8F0}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--grund);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}
a{color:var(--fokus)}
:focus-visible{outline:3px solid var(--fokus);outline-offset:2px}
.eyebrow{margin:0;color:var(--mint);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:13px}
h1{margin:2px 0 4px;font-size:28px;line-height:1.2}
h2{font-size:19px;margin:0 0 4px}
.leise{color:var(--leise)}.klein{font-size:14px}
.karte{background:var(--karte);border:1px solid var(--rand);border-radius:12px;padding:16px 18px;margin:0 0 14px}
.karte.akzent{border-left:6px solid var(--mint)}
.banner{background:var(--mittel-soft);border:1px solid var(--mittel);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:15px}
.kopf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}
.gross{font-size:52px;font-weight:800;line-height:1;color:var(--petrol);font-variant-numeric:tabular-nums}
.gross small{font-size:16px;font-weight:600;color:var(--leise)}
.balken{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.balken>i{display:block;height:100%;background:var(--mint);border-radius:99px}
.balken.ok>i{background:var(--ok)}.balken.mittel>i{background:var(--mittel)}.balken.schwach>i{background:var(--schwach)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--sunk);border:1px solid var(--rand);white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chip.mittel{background:var(--mittel-soft);border-color:var(--mittel);color:var(--mittel)}
.chip.schwach{background:var(--schwach-soft);border-color:var(--schwach);color:var(--schwach)}
.bereich{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:4px 12px;padding:12px 0;border-top:1px solid var(--rand)}
.bereich:first-of-type{border-top:0}
.nr{width:2.2rem;height:2.2rem;border-radius:50%;background:var(--petrol);color:var(--karte);display:grid;place-items:center;font-weight:700}
.bereich .zeile{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.bereich .titel{font-weight:650;min-width:0}
.zahlen{font-size:14px;color:var(--leise);font-variant-numeric:tabular-nums}
.schritte{margin:0;padding-left:1.2rem}.schritte li{margin:6px 0}
.tage{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;margin:10px 0 6px;max-width:520px}
.tag{aspect-ratio:1;border-radius:4px;background:var(--sunk);border:1px solid var(--rand)}
.tag.an{background:var(--mint);border-color:var(--mint)}
.tag.heute{outline:2px solid var(--petrol);outline-offset:1px}
.lz{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--rand)}.lz:first-of-type{border-top:0}
.stempel{display:flex;flex-wrap:wrap;gap:6px}
.stempel span{font-size:13px;font-weight:700;padding:4px 9px;border-radius:8px;border:2px dashed var(--rand);color:var(--leise)}
.stempel span.an{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
td,th{padding:6px 4px;border-bottom:1px solid var(--rand);text-align:left;vertical-align:top}
td.z,th.z{text-align:right;white-space:nowrap}
tfoot td{font-weight:800;border-bottom:0}
label.feld{display:grid;gap:4px;font-weight:600;margin:10px 0}
input[type=text]{font:inherit;padding:10px 12px;border:1px solid var(--rand);border-radius:8px;background:var(--karte);color:var(--text);width:100%;max-width:22rem;min-height:2.75rem}
.aktionen{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{font:inherit;font-weight:650;cursor:pointer;border:1px solid var(--rand);background:var(--karte);color:var(--text);border-radius:8px;padding:9px 16px;min-height:2.75rem;text-decoration:none;display:inline-flex;align-items:center}
.btn.prim{background:var(--petrol);border-color:var(--petrol);color:var(--karte)}
.btn:disabled{opacity:.45;cursor:default}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:22px;font-weight:800;letter-spacing:.06em;background:var(--sunk);border:2px dashed var(--mint);border-radius:10px;padding:12px 14px;margin:12px 0 4px;word-break:break-all;user-select:all}
details{margin-top:8px}summary{cursor:pointer;font-weight:650}
footer{margin-top:26px;font-size:14px;color:var(--leise)}
.klassenzeile{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 14px;color:var(--leise);font-weight:600}
.klein-btn{min-height:2.4rem;padding:6px 12px;font-size:14px}
.ziele{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin-top:10px}
.ziel{border:1px solid var(--rand);border-radius:10px;padding:12px 14px;display:grid;gap:4px;align-content:start;background:var(--karte)}
.ziel.aktiv{border-left:6px solid var(--ok)}
.ziel.spaeter{border-left:6px solid var(--rand)}
.ziel.abgelegt{opacity:.8;border-style:dashed}
.ziel .zeile{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.ziel strong{font-size:18px}
.termin{font-weight:650;font-variant-numeric:tabular-nums}
.klassen{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px;margin-top:12px}
.klasse-wahl{font:inherit;cursor:pointer;display:grid;gap:2px;text-align:left;border:1px solid var(--rand);border-left:6px solid var(--mint);border-radius:10px;padding:12px 14px;background:var(--karte);color:var(--text);min-height:3.5rem}
.klasse-wahl strong{font-size:20px}
.klasse-wahl:hover{border-color:var(--mint)}
ul.module{margin:8px 0 6px;padding-left:1.2rem}ul.module li{margin:4px 0}
@media (max-width:480px){h1{font-size:23px}.gross{font-size:42px}.code{font-size:18px}.tage{grid-template-columns:repeat(7,minmax(0,1fr))}}
@media print{.aktionen,.btn{display:none}}
</style>
</head>

// Aufbau (Version 2, ab 10.10.2026): 81 Bit Werte + 16 Bit Prüfsumme = 97 Bit in 20 Zeichen Crockford-Base32 (ohne I, L, O, U),

    teile.push(el('section', { class: 'karte', 'aria-labelledby': 'h-pruef' }, [el('h2', { id: 'h-pruef' }, 'Ihre Prüfungen'),
      el('div', { class: 'ziele', 'data-ziele': ziele.map(x => x.z.id + ':' + x.st).join(',') }, ziele.map(x => {
        const T = x.z.training ? P.trainings[x.z.training] : null;
        return el('div', { class: 'ziel ' + x.st, 'data-ziel': x.z.id, 'data-status': x.st }, [
          el('div', { class: 'zeile' }, [el('strong', {}, x.z.titel), el('span', { class: 'chip ' + (x.st === 'aktiv' ? 'ok' : '') }, STATUS[x.st])]),
          el('div', { class: 'leise klein' }, x.z.lang),
          el('div', { class: 'termin', 'data-termin': x.t.termin }, PZEIT.text(x.t, heute) + (x.st !== 'abgelegt' && PZEIT.abstand(x.t, heute) ? ' · ' + PZEIT.abstand(x.t, heute) : '')),
          T ? el('a', { href: T.link, class: 'klein' }, x.st === 'abgelegt' ? 'Training zum Wiederholen' : 'Zum Prüfungstraining') : el('p', { class: 'klein leise', 'data-folgt': '' }, x.z.ohne_training)]);
      }))]));

    if (F) {
      const z = F.z, lzZ = lzSicht.filter(l => l.ziele[z.id]);
      const S = stand(z, lzZ), p = pz(S.punkte, S.max);
      if (!BEISPIEL && S.leer) teile.push(el('div', { class: 'banner', 'data-leer': '' }, ONLINE
        ? 'Noch nichts geübt – oder Sie nutzen ein anderes Gerät oder einen anderen Browser. Die Lernzentrale zeigt nur, was in diesem Browser gespeichert ist.'
        : 'Diese Datei ist direkt geöffnet. Ihren Stand sieht die Lernzentrale nur, wenn Sie sie über ihre Adresse öffnen.'));
      // Trainingspunkte
      teile.push(el('section', { class: 'karte akzent', 'aria-labelledby': 'h-punkte', 'data-fokus': z.id }, [
        el('div', { class: 'kopf' }, [el('div', {}, [el('h2', { id: 'h-punkte' }, 'Trainingspunkte ' + z.titel + (F.wiederholung ? ' · zum Wiederholen' : '')),
          el('p', { class: 'leise klein' }, 'Prüfungstraining und Lernzentralen Ihrer Klasse zusammen – keine Notenpunkte')]),
          el('div', { class: 'gross', 'data-punkte': String(S.punkte), 'data-max': String(S.max) }, [String(S.punkte), el('small', {}, ' / ' + S.max)])]),
        balken(p, '', S.punkte + ' von ' + S.max + ' Trainingspunkten'),
        el('div', { class: 'chips' }, [
          el('span', { class: 'chip' }, S.w.g + ' Aufgaben sitzen'),
          el('span', { class: 'chip' }, 'Simulation ' + (S.sim ? 'bestes ' + S.w.s + '/' + S.T.sim_n : '–')),
          S.stMax ? el('span', { class: 'chip' }, S.w.st + ' von ' + S.stMax + ' Stempeln') : null,
          el('span', { class: 'chip' }, S.w.lt + ' Lerntage in ' + P.fenster + ' Tagen')]),
        el('details', {}, [el('summary', {}, 'So entstehen die Trainingspunkte'), el('table', {}, [
          el('tbody', {}, [['gap1_richtig', S.w.g], ['sim_beste_richtig', S.w.s], ['stempel', S.w.st], ['akte', S.w.ak]].map(([k, n]) =>
            el('tr', {}, [el('td', {}, P.punkte[k] + ' Trainingspunkt' + (P.punkte[k] === 1 ? '' : 'e') + ' ' + P.punkte_text[k]), el('td', { class: 'z' }, n + ' × ' + P.punkte[k]), el('td', { class: 'z' }, String(n * P.punkte[k]))]))),
          el('tfoot', {}, el('tr', {}, [el('td', {}, 'Summe'), el('td', {}), el('td', { class: 'z' }, String(S.punkte))]))])])
      ]));
      const v = vorschlaege(S);
      if (v.length) teile.push(el('section', { class: 'karte', 'aria-labelledby': 'h-weiter' }, [el('h2', { id: 'h-weiter' }, 'Ihr nächster Schritt'),
        el('ol', { class: 'schritte', 'data-schritte': String(v.length) }, v.map(x => el('li', {}, x)))]));
      // Prüfungsreife je Bereich (Messwert aus dem Training; Module als Vorbereitung daneben)
      const sec = el('section', { class: 'karte', 'aria-labelledby': 'h-reife' }, [el('h2', { id: 'h-reife' }, 'Prüfungsreife ' + z.titel),
        el('p', { class: 'leise klein' }, 'Richtig = zuletzt richtig gelöst, gemessen an allen Aufgaben des Bereichs im Prüfungstraining. ' + P.stufen.map(s => s[0] ? 'ab ' + s[0] + ' % ' + s[1] : 'darunter ' + s[1]).join(', ') + '. Stempel aus Lernzentralen stehen als Vorbereitung daneben.')]);
      S.bereiche.forEach(x => {
        const q = pz(x.r, x.t), st = stufe(q), sm = S.sim && S.sim.summe[x.nr];
        const vorb = S.lz.filter(y => (y.l.ziele[z.id] || []).includes(String(x.nr))).map(y => y.l.nr + ': ' + y.stempel.length + ' von ' + y.l.te.length + ' Stempeln');
        sec.appendChild(el('div', { class: 'bereich', 'data-bereich': x.nr }, [el('div', { class: 'nr', 'aria-hidden': 'true' }, x.nr), el('div', {}, [
          el('div', { class: 'zeile' }, [el('span', { class: 'titel' }, x.titel), el('span', { class: 'chip ' + (x.b ? st.klasse : '') }, x.b ? st.text : 'noch offen')]),
          balken(q, x.b ? st.klasse : '', 'Bereich ' + x.nr + ': ' + q + ' % richtig'),
          el('div', { class: 'zahlen' }, x.r + ' von ' + x.t + ' richtig (' + q + ' %) · ' + pz(x.b, x.t) + ' % bearbeitet' + (Array.isArray(sm) && sm[1] ? ' · Simulation ' + sm[0] + ' von ' + sm[1] : '') + ' · ' + x.lf),
          vorb.length ? el('div', { class: 'zahlen', 'data-vorbereitung': '' }, 'Vorbereitet: ' + vorb.join(' · ')) : null])]));
      });
      teile.push(sec);
      teile.push(el('section', { class: 'karte', 'aria-labelledby': 'h-sim' }, [el('h2', { id: 'h-sim' }, 'Prüfungssimulation'),
        S.sim ? el('div', { class: 'chips', 'data-sim': String(S.sim.beste.r) }, [
          el('span', { class: 'chip ' + stufe(pz(S.sim.beste.r, S.sim.beste.n)).klasse }, 'Bestes Ergebnis ' + S.sim.beste.r + ' von ' + S.sim.beste.n + ' (' + datum(S.sim.beste.d) + ')'),
          el('span', { class: 'chip' }, 'Zuletzt ' + S.sim.letzte.r + ' von ' + S.sim.letzte.n + ' (' + datum(S.sim.letzte.d) + ')'),
          el('span', { class: 'chip' }, S.sim.anz + (S.sim.anz === 1 ? ' Durchgang' : ' Durchgänge'))])
          : el('p', { 'data-sim': 'leer' }, ['Noch keine Simulation abgeschlossen. Sie steht im ', el('a', { href: S.T.link }, 'Prüfungstraining'), ' im Menü.'])]));
      if (S.lz.length) teile.push(el('section', { class: 'karte', 'aria-labelledby': 'h-lz' }, [el('h2', { id: 'h-lz' }, 'Stempel aus den Lernzentralen')].concat(S.lz.map(x =>
        el('div', { class: 'lz', 'data-lz': x.l.key }, [el('div', { class: 'zeile' }, [el('a', { href: x.l.link }, x.l.nr + ' · ' + x.l.titel)]),
          el('div', { class: 'stempel', role: 'list' }, x.l.te.map(t => el('span', { role: 'listitem', class: x.stempel.includes(t) ? 'an' : '', title: x.l.te_titel[t] || '' }, 'TE ' + t + (x.stempel.includes(t) ? ' ✓' : '')))),
          el('div', { class: 'zahlen' }, x.stempel.length + ' von ' + x.l.te.length + ' Stempeln · Kundenakte ' + (x.zu ? 'geschlossen ✓' : x.offen + ' von ' + x.l.schloesser + ' Schlössern offen') + ' · zählt für ' + z.titel + ', Bereich ' + (x.l.ziele[z.id] || []).join(', '))])))));
      const kal = el('div', { class: 'tage', 'aria-hidden': 'true' });
      for (let i = P.fenster - 1; i >= 0; i--) { const d = tagVor(i); kal.appendChild(el('span', { class: 'tag' + (S.tage.has(d) ? ' an' : '') + (i === 0 ? ' heute' : ''), title: datum(d) })); }
      teile.push(el('section', { class: 'karte', 'aria-labelledby': 'h-dran' }, [el('h2', { id: 'h-dran' }, 'Dranbleiben'),
        el('p', { 'data-lerntage': String(S.w.lt) }, S.w.lt + (S.w.lt === 1 ? ' Lerntag' : ' Lerntage') + ' in den letzten ' + P.fenster + ' Tagen'), kal,
        el('p', { class: 'leise klein' }, 'Ein Lerntag zählt, wenn Sie an dem Tag im Prüfungstraining oder in einer Lernzentrale geübt haben.')]));
      teile.push(meldeBereich(S, z));
    }

    // Ihre Module
    const trainings = P.ziele.filter(z => z.training).map(z => ({ z, T: P.trainings[z.training] }));
    teile.push(el('section', { class: 'karte', 'aria-labelledby': 'h-module' }, [el('h2', { id: 'h-module' }, 'Ihre Module'),
      el('ul', { class: 'module', 'data-module': lzSicht.map(l => l.id).join(',') }, trainings.map(x => el('li', {}, [el('a', { href: x.T.link }, x.T.titel), el('span', { class: 'leise klein' }, ' · ' + x.z.titel)]))
        .concat(lzSicht.map(l => el('li', {}, [el('a', { href: l.link }, 'Lernzentrale ' + l.nr + ' · ' + l.titel), el('span', { class: 'leise klein' }, ' · ' + l.aj + '. AJ')])))),
      el('p', { class: 'leise klein' }, 'Weitere Module kommen im Takt des Unterrichts dazu. Ihre Noten und den Plan finden Sie in Mein KVF.')]));
    teile.push(fusszeile());
    teile.forEach(x => app.appendChild(x));
  }
  zeichne();
  window.addEventListener('pageshow', e => { if (e.persisted) zeichne(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !document.querySelector('[data-code]')) zeichne(); });
})();
</script>
</body>
</html>
